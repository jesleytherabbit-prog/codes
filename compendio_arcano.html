 "Ritual de protección frente al mal", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de utilidad. Para que tenga éxito, el conjurador de este ritual no puede haber usado ningún arcano que se considere magia oscura (Es decir, ningún arcano cuyo requisito sea tener la especialización de mago negro) durante la anterior escena en la que está ni la actual. Este ritual permite proteger un área frente a cualquier ente o criatura maligna o conjuros de magia negra. Entes espirituales malignos, inferi, dementores, boggarts, heraldos, vampiros u hombres lobo (transformados) son alguno de los ejemplos de seres que no podrán pisar pisar o sobrevolar el area. Además intentar lanzar un arcano con un requisito de Mago Oscuro tendrá una penalización de 2/4/7 en función del nivel de especialización requerido. Para determinar el tamaño del área se realiará una tirada de Rituales: superando un 7 cubrirá el contacto físico directo, con un 9 las inmediaciones del ritualista, con un 12 un par de estancias de distancia, a partir de 15 todo un edificio, con un 18 cubrirá cientos de metros, un 21 cubrirá varios kilómetros, y un 25 cubrirá una ciudad entera."}, {"id": "Rituales-98", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Sanatore Máxima", "categorias": ["Sanación"], "requisito": "Requiere Sanatore.", "texto": "Requiere Sanatore. Arcano de Sanación. Envuelve al objetivo en una poderosa luz que podría molestar a algunos, aunque puede disimularse a voluntad, mientras restaura sus heridas. Al conjurarse este ritual sobre un objetivo, debe hacerse una tirada de Medicina a dificultad 12. En caso de superarse, el ritual estará haciendo efecto durante 7 turnos. Al término de esos 7 turnos, habrá curado completamente cuatro Heridas. Por cada grado de éxito por encima que se supere la tirada, se reducirá un turno la duración del ritual. Este hechizo se puede usar sobre uno mismo, aunque, para hacerlo, se debe tener la Especialización Medimago 3."}, {"id": "Rituales-99", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Transfiguración de objetos a animales grandes | Diversium Animalis Mayoris", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Magizoólogo 2 y Diversium Animalis.", "texto": "Requiere Especialización Magizoólogo 2 y Diversium Animalis. Arcano de Utilidad. Este ritual no es un arcano en concreto, más bien una habilidad genérica que puede hacer con distintas formas. Con este ritual , el objetivo puede convertir un objeto en un animal o criatura mágica, sin ningún tipo de preocupación por las propiedades mágicas de la criatura o cualquier otro criterio, de forma completa."}, {"id": "Rituales-100", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Transformación de objetos grandes | Mutatio Mayoris", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2 y Mutatio.", "texto": "Requiere Especialización Encantador 2 y Mutatio. Arcano de Utilidad. Esta forma de magia es capaz de alterar la forma de un objeto inanimado por la de otro, incluso sin preocuparse por criterios de masa y tamaño. Si se tiene el ritual Malleator Maxima, este objeto puede tener propiedades mágicas. Por ejemplo, podría convertir un armario en una motocicleta voladora, o unas piedras en unas orejas extensibles."}, {"id": "Rituales-101", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Transfiguración humana avanzada | Transfiguratio Mayoris", "categorias": [], "requisito": "Requiere Especialización Magizoólogo 2 y Transfiguratio.", "texto": "Requiere Especialización Magizoólogo 2 y Transfiguratio. Este ritual no es un arcano en concreto, más bien una habilidad genérica que puede hacer con distintas formas. Con este ritual, el objetivo puede convertirse completamente en una forma animal (por ejemplo, convertirse en un pez cuando se meta en el agua), de manera similar a la animagia pero siempre con varita. Podrá revertir esta transformación en el momento en que quiera, incluso sin varita (aunque para deshacer transformaciones sobre otros sí requerirá de varita)."}, {"id": "Rituales-102", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Transfiguración humana absolutas | Alter Humanus", "categorias": [], "requisito": "Requiere Transfiguratio Mayoris.", "texto": "Requiere Transfiguratio Mayoris. Con este ritual, el objetivo puede convertir a otros seres humanos en animales completos o seres mágicos a su voluntad, tal y como si estuvieran recibiendo el efecto de Transfiguratio Mayoris. Un objetivo involuntario puede resistir esta transfiguración con una tirada de Frialdad enfrentada a la tirada de ataque del ritualista."}, {"id": "Pociones-1", "fuente": "Pociones", "nivel": "Básica", "nombre": "Antídoto contra Veritaserum", "categorias": ["Contrahechizo"], "requisito": "", "texto": "ContrahechizoEste particular concentrado se usa para contrarrestar los efectos de pociones de la verdad. Se puede tomar hasta 24 horas antes de la ingesta de Veritaserum o cuando se está sometido a sus efectos y se cancelarán automáticamente. Si has sido envenenado con Veritaserum sin ser consciente de ello y tienes esta poción canjeada, el master hará una tirada por tu personaje de Herbología a dificultad 15. En caso de superarla, podrás escoger haber consumido esta poción de antemano y ser inmune a sus efectos a cambio de tres puntos de pociones en vez del punto de pociones que te costaría normalmente. Para aplicar este efecto será necesario tener al menos un PD sin usar, aunque este no se gastará."}, {"id": "Pociones-2", "fuente": "Pociones", "nivel": "Básica", "nombre": "Chuchería para mascotas", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de utilidad. Este apetitoso tentempié está en muchas casas de familias mágicas con mascotas, aunque también hay algunos magizoologos que las llevan. De muchos tipos diferentes, estas pequeñas delicias son muy efectivas para lograr un mejor trato por parte de una criatura mágica de peligrosidad * o **, o un animal no doméstico pero que no sea completamente salvaje (por ejemplo, un zorro). Si se supera una tirada de Magizoologia a dificultad 9, se logrará un +1 a cualquier tirada futura de Magizoologia con dicha criatura, ya sea para lograr que haga algo en concreto, para bajar la animosidad de la misma o cualquier otra acción. Con uno o dos grados de éxito adicionales ese bonificador pasará a ser un +2 o +4 respectivamente."}, {"id": "Pociones-3", "fuente": "Pociones", "nivel": "Básica", "nombre": "Concentrado de brugmansia", "categorias": ["Combate", "Ultraje"], "requisito": "", "texto": "Arcano de Combate. Arcano de Ultraje. Poción tóxica extraída de la naturaleza. Ingerirla provoca incómodos dolores abdominales, y otros síntomas como diarreas o similares. A partir del siguiente turno a haber consumido esta poción, la víctima empezará a sufrir un daño y malestar constante de 2 PAs cada turno hasta que sea capaz de detener sus efectos con un antídoto. El daño del veneno se acumula entre turnos de cara a causar Heridas (es decir; alguien con un Umbral de Heridas de 5 sufrirá una herida al cabo de tres turnos sufriendo el veneno o dos heridas al cabo de seis turnos, a pesar de no ser daño simultáneo). Se puede embadurnar un arma con este veneno. En caso de hacerlo, la siguiente tirada de Ataque podrá aplicar un efecto. Si el ataque con el arma iguala o supera la defensa del objetivo, el ataque causará, además del daño del impacto, un daño de 2 PA durante 3 turnos, a partir del turno siguiente al ataque."}, {"id": "Pociones-4", "fuente": "Pociones", "nivel": "Básica", "nombre": "Filtro de Upsala", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. En el interior de este vial hay una poción que parece estar condensada en forma gaseosa. Al abrir la tapa del mismo, se debe inhalar el gas que emite y, una vez hecho esto, parecerá estar más en sintonía con lo extraterrenal y lo mágico, como si pudiera ver los rastros de magia. Después de inhalar esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +2 a sus valores de Adivinación y Consciencia. Adicionalmente, y de manera narrativa y a criterio del master, esta poción puede ayudar a aquellas personas con capacidades precognitivas (Oráculos) a desencadenar sus visiones, aunque seguirá siendo necesario una tirada de Adivinación para desentrañarlas."}, {"id": "Pociones-5", "fuente": "Pociones", "nivel": "Básica", "nombre": "Fluido Explosivo", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. El fluido explosivo es una solución inestable que puede estallar si se agita bruscamente. Está pensada para usarse en combate, arrojándolo sobre un objetivo. Si se supera una tirada de Atletismo contra el valor de Defensa del objetivo, explotará y hará un daño de 5 PAs (es decir, no se puede hacer una contra a este ataque pero el daño tampoco aumenta si se supera la defensa). Esta poción cuenta como 2 impactos de cara a la resistencia de las barreras."}, {"id": "Pociones-6", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción agudizadora de ingenio", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Vuelve la mente de aquel que la beba mucho más afilada y preparada para desentrañar misterios, relacionar pistas y descubrir cosas ocultas. Después de consumir esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +2 a sus tiradas de Alerta e Investigación."}, {"id": "Pociones-7", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción calmante", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. La poción se encarga de tranquilizar a aquel que la bebe, eliminando los ataques nerviosos y los errores más propios del miedo, nervios o estrés. Después de consumir esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +2 a sus valores de Frialdad y de Empatía."}, {"id": "Pociones-8", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción de actividad", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Este sencillo filtro funciona como una dosis concentrada de cafeína mágica. Cuando se ingiere, el conjurador sentirá como su mente se despeja completamente y su atención se vuelve más afilada, de pronto más atento al entorno que le rodea. Ideal para las largas jornadas de trabajo o para cuando necesitas estar extra vigilante. Después de consumir esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +1 a sus valores de Defensa e Iniciativa."}, {"id": "Pociones-9", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción de aliento de perro", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Incómoda poción que molesta a la hora de tratar de comunicarse o transmitir ideas. Además de tener un desagradable aliento similar a la respiración de un perro, muchos de los pensamientos se expresan en forma de ladridos. Durante una escena, el objetivo contará con un penalizador de -2 a sus tiradas de Coordinación, Oratoria y Seducción."}, {"id": "Pociones-10", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción de fuerza de culturista", "categorias": ["Combate", "Utilidad"], "requisito": "", "texto": "Arcano de Combate. Arcano de Utilidad. Refuerza los músculos del personaje y le da una constitución mucho más robusta y sólida. Después de consumir esta poción, y durante la siguiente escena o combate, se obtendrá +1 en Vigor. Esto también afectará a los atributos relacionados (como el Umbral de Heridas, el Ataque Físico, los PAs o Valor de Lucha Físico)."}, {"id": "Pociones-11", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción de la memoria", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de UtilidadEsta curiosa poción ayuda a recordar con más claridad las cosas que se hayan podido olvidar, y es particularmente utilizada en el tratamiento de pociones olvidadizas y por estudiantes tramposos en épocas de exámenes. Beber esta poción agudiza la capacidad de memorización y hace que se recuerden pistas con más facilidad. Tras ingerir esta poción, el pocionista podrá recordar con facilidad cosas que puede haber pasado por alto o alguna respuesta a un examen. Concede un +2 adicional a las tiradas de Inteligencia siempre y cuando se posea una Biblioteca específica de la materia, o puede utilizarse para que el master clarifique sobre posible información pasada por alto u olvidada en una misión."}, {"id": "Pociones-12", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción de reanimación", "categorias": ["Sanación"], "requisito": "", "texto": "Arcano de Sanación. Esta poción es un simple remedio contra la inconsciencia y el desvanecimiento. Fuerza el despertar de todo aquel que la beba, contrarrestando los efectos del hechizo Desmaius y otras formas de inconsciencia. Si has sido objetivo del hechizo Desmaius y tienes esta poción canjeada, el master hará una tirada por tu personaje de Herbología a dificultad 15. En caso de superarla, podrás escoger haber consumido esta poción de antemano y ser inmune a sus efectos a cambio de tres puntos de pociones en vez del punto de pociones que te costaría normalmente. Para aplicar este efecto será necesario tener al menos un PD sin usar, aunque este no se gastará. Si la persona está a 0 Heridas pero todavía no ha muerto, el pocionista puede forzarla a despertar con una tirada de Medicina a dificultad 9 mientras le administra la poción, pero después de una escena, el herido volverá a desplomarse inevitablemente."}, {"id": "Pociones-13", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción de Quasimodo", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Esta poción, al contrario que la poción embellecedora, afea a todo aquel que la beba hasta tal punto de que puede crear ligeras deformidades. Indicada para vengarse de ciertas personas o quizá pasar desapercibido. Cuando se ha consumido esta poción, el usuario tendrá un penalizador de -4 en sus valores de Estilo y Seducción pero también tendrá un bonificador de +2 a Subterfugio siempre que intente hacerse pasar por otra persona."}, {"id": "Pociones-14", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción embellecedora", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Otorga al que la bebe un aspecto bien parecido. No convierte a Quasimodo en Adonis, pero hace un apaño interesante. Cuando se ha consumido esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +2 a sus valores de Estilo y Seducción."}, {"id": "Pociones-15", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción herbicida", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta poción es una buena manera de encargarse de mantener bien cuidado un jardín con ingredientes de pociones. Esta poción puede usarse para contrarrestar ciertas plantas nocivas o peligrosas, como un lazo del diablo en el que el personaje caiga prisionero. Además, dará al personaje que la canjee tantos Puntos de Pociones adicionales como su nivel en la habilidad de Herbología (1 si es Novato, 2 Competente, 3 Experto y 4 Maestro). Estos puntos se añaden después de todas las cuentas de otros objetos que otorguen puntos extra, como el Maletín del Pocionista Inquieto."}, {"id": "Pociones-16", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción incorpórea", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta poción permite a quien la ha ingerido atravesar obstáculos físicos durante una escena. El objetivo se vuelve ligeramente inmaterial, teniendo la capacidad de atravesar cualquier muro o pared. Sin embargo, para hacerlo, deberá superar una tirada de Atletismo a dificultad 7. Cuanto más grueso sea el muro, a discreción del master, más elevada será la dificultad, pudiendo grandes bloques mágicos de rocas llegar a dificultades de 18 o 21. Fallar la tirada permite avanzar igualmente, pero, por cada grado de éxito fallado de la dificultad, se sufrirá una Herida."}, {"id": "Pociones-17", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción olvidadiza", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Incómoda poción que, aunque no sea demasiado poderosa, sí que puede suponer una auténtica molestia. Después de beber esta poción, aquel que la haya ingerido sufrirá un momento de amnesia temporal, que, aunque no tiene consecuencias en sus tiradas, le hará olvidarse de las últimas 24h que haya vivido, como si estuviera siendo desmemorizado. Una persona puede tratar de recordar temporalmente algún detalle que haya olvidado haciendo una tirada de Frialdad a dificultad 15, pero este recuerdo será temporal, lo volverá a olvidar al cabo de un tiempo y debe haber algo que le haga recordar."}, {"id": "Pociones-18", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción pimentónica", "categorias": ["Sanación"], "requisito": "Requiere Medimago 1.", "texto": "Requiere Medimago 1. Arcano de Sanación. Conocido remedio para el resfriado y otras dolencias básicas. Su uso moderno está pensado para contrarrestar los efectos de distintas pociones y enfermedades menores. Sirve para anular los efectos de los venenos y pociones básicas, salvo que exista una poción específicamente diseñada contra ellos."}, {"id": "Pociones-19", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción vigorizante", "categorias": ["Sanación"], "requisito": "Requiere Especialización Medimago 2.", "texto": "Requiere Especialización Medimago 2. Arcano de Sanación. Estimula y restablece la salud de aquel que la bebe. Además, provoca una agradable sensación cálida. Esta poción estabiliza una Herida sin necesidad de hacer tirada de Medicina, aunque no la cura."}, {"id": "Pociones-20", "fuente": "Pociones", "nivel": "Básica", "nombre": "Poción Wiggenweld", "categorias": ["Contrahechizo"], "requisito": "", "texto": "Contrahechizo. Esta poción sirve específicamente para remediar los efectos del Filtro de muertos en vida o prevenirlos antes de sufrirlos, de la misma forma que cualquier otro antídoto. Despierta automáticamente a cualquier persona presa del efecto mágico o lo previene. Si has sido envenenado con Filtro de muertos en vida sin ser consciente de ello y tienes esta poción canjeada, el master hará una tirada por tu personaje de Herbología a dificultad 15. En caso de superarla, podrás escoger haber consumido esta poción de antemano y ser inmune a sus efectos a cambio de tres puntos de pociones en vez del punto de pociones que te costaría normalmente. Para aplicar este efecto será necesario tener al menos un PD sin usar, aunque este no se gastará."}, {"id": "Pociones-21", "fuente": "Pociones", "nivel": "Básica", "nombre": "Preparado de mandrágora", "categorias": ["Contrahechizo"], "requisito": "", "texto": "Contrahechizo. El preparado de mandrágora es un remedio contra la petrificación. Puede eliminar los efectos de cualquier petrificación mágica, incluyendo los del hechizo Petrificus Totallus, Mobilus o los de la mirada de un basilisco. Si has sido objetivo de alguna forma de Petrificación y tienes esta poción canjeada, el master hará una tirada por tu personaje de Herbología a dificultad 15. En caso de superarla, podrás escoger haber consumido esta poción de antemano y ser inmune a sus efectos a cambio de tres puntos de pociones en vez del punto de pociones que te costaría normalmente. Para aplicar este efecto será necesario tener al menos un PD sin usar, aunque este no se gastará."}, {"id": "Pociones-22", "fuente": "Pociones", "nivel": "Básica", "nombre": "Reactivo de Descurainia sophia", "categorias": ["Sanación"], "requisito": "Requiere Especialización Medimago 2.", "texto": "Requiere Especialización Medimago 2. Arcano de Sanación. Este filtro contiene una desagradable (de sabor) poción que genera una reacción inmediata en el usuario, similar a la ingesta masiva de cafeína. Beber esta poción recupera la mitad de los PAs perdidos por quien la ingiere en los últimos momentos, dando un subidón de energía e ignorando los PAs máximos por Heridas. Sin embargo, esta poción ni estabiliza ni cura las Heridas, por lo que se sigue manteniendo el penalizador correspondiente."}, {"id": "Pociones-23", "fuente": "Pociones", "nivel": "Básica", "nombre": "Retardante alquímico", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de utilidad. Este filtro tiene la función de retrasar los efectos de cualquier poción ingerida (es decir, sólo las que deben beberse para aplicar sus efectos. No funcionaría con venenos untados en armas ni con filtros explosivos), haciendo que sus efectos no se manifiesten inmediatamente en el momento de la toma, sino hasta más adelante. La mitad del contenido de una dosis de esta poción debe añadirse y diluirse en cualquier otra poción que ya tenga el personaje, y la otra mitad se la queda el alquimista. Después de hacerlo, el alquimista deberá hacer una tirada de Pociones; en un 7, retrasará la aplicación de la poción un turno, un 9 serán tres turnos, un 12 cinco minutos, un 15 veinte minutos, un 18 una hora, un 21 hasta seis horas y un 25 hasta 24 horas. El alquimista podrá activar la poción de inmediato si él se bebe la otra mitad del filtro, pudiendo elegir cuantas quiere activar en caso de haber tomado más de una."}, {"id": "Pociones-24", "fuente": "Pociones", "nivel": "Básica", "nombre": "Solución animadora", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este sencillo filtro se utiliza sobre la lente de una cámara fotográfica o sobre un pincel para que aquello que el artista cree tenga movimiento. El artista o fotógrafo hará una tirada de Arte (Fotografía) o Arte (Pintura) con un bonificador de +4. Si supera 9 o más en esa tirada, la imagen tendrá movimiento. Adicionalmente, puede hacerse esa misma tirada sobre una fotografía o cuadro pintado previamente, pero la dificultad pasa a ser de 12."}, {"id": "Pociones-25", "fuente": "Pociones", "nivel": "Básica", "nombre": "Test de Saberhagen", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta poción es un preparado que permite revelar características de una persona o criatura mágica introduciendo unas gotas de sangre en su interior. Una vez se deja caer sangre, el pocionista hará una tirada de Herbología. En función de la dificultad que supere, conocerá más o menos datos. A dificultad 9, podrá saber la raza de la criatura (humano muggle o mago, o si es una criatura mágica). A dificultad 12, podrá saber una categoría (si es hombre lobo o no, si es sangre limpia o sangre sucia, si es semigigante...). A dificultad 15, conocerá información biográfica (género, edad, si es animago o no...). A dificultad 18 y superiores (a discreción del master), se pueden conocer datos de la persona cuando se tomó la muestra de sangre (enfermedades, si estaba bajo el influjo de algún arcano, su mejor o peor atributo, si estaba herido...)."}, {"id": "Pociones-26", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Antídoto", "categorias": ["Sanación"], "requisito": "Requiere Poción pimentónica.", "texto": "Requiere Poción pimentónica. Arcano de Sanación Crudo remedio pocionista para hacer frente a muchos de los efectos molestos de las pociones. Sirve para contrarrestar los efectos de cualquier poción nociva de categoría intermedia o básica, salvo que exista algún antídoto específico contra ellos."}, {"id": "Pociones-27", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Coles masticadoras chinas", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de utilidad. Para cualquier herbólogo que se tercie. ¿Quién no ha querido lanzar coles masticadoras chinas sobre sus enemigos?. El mago dispondrá de tres coles que podrá sacar de su morral. Las coles giraran y giraran y atacaran al que tenga delante. Se necesita una tirada de Herbologia a dificultad 9 para que las coles no ataquen al usuario. Al atacar, tendrán una iniciativa de +2, ataque +2 y defensa 9."}, {"id": "Pociones-28", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Chuchería para animales", "categorias": ["Utilidad"], "requisito": "Requiere Chcuchería para mascotas.", "texto": "Requiere Chcuchería para mascotas. Arcano de utilidad. Este apetitoso tentempié está en muchas reservas de craituras mágicas, aunque también hay algunos magizoologos que las llevan. De muchos tipos diferentes, estas pequeñas delicias son muy efectivas para lograr un mejor trato por parte de una criatura mágica de peligrosidad *** o un animal salvaje (por ejemplo, un león). Si se supera una tirada de Magizoologia a dificultad 12, se logrará un +1 a cualquier tirada futura de Magizoologia con dicha criatura, ya sea para lograr que haga algo en concreto, para bajar la animosidad de la misma o cualquier otra acción. Con uno o dos grados de éxito adicionales ese bonificador pasará a ser un +2 o +4 respectivamente."}, {"id": "Pociones-29", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Concentrado de Centinodia", "categorias": ["Sanación"], "requisito": "Requiere Reactivo de Descurainia sophia.", "texto": "Requiere Reactivo de Descurainia sophia. Arcano de Sanación.Este filtro contiene una desagradable (de sabor) poción que genera una reacción inmediata en el usuario, similar a la ingesta masiva de cafeína. Beber esta poción recupera todos los PAs perdidos por quien la ingiere en los últimos momentos, dando un subidón de energía e ignorando los PAs máximos por Heridas. Sin embargo, esta poción ni estabiliza ni cura las Heridas, por lo que se sigue manteniendo el penalizador y, además, es posible caer por Heridas incluso cuando se tienen PAs."}, {"id": "Pociones-30", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Concentrado de erumpent", "categorias": ["Combate"], "requisito": "Requiere Fluido explosivo.", "texto": "Requiere Fluido explosivo. Arcano de Combate. El concentrado de erumpent se extrae del cuerno de estas criaturas, una poderosa sustancia explosiva. Está pensada para usarse en combate, arrojándolo sobre un objetivo. Si se supera una tirada de Atletismo contra el valor de Defensa del objetivo, hará siempre un daño de 10 PA (es decir, no se puede hacer una contra a este ataque pero el daño tampoco aumenta si se supera la defensa). Esta poción cuenta como 3 impactos de cara a la resistencia de las barreras."}, {"id": "Pociones-31", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Esencia de Díctamo", "categorias": ["Sanación"], "requisito": "Requiere Poción vigorizante.", "texto": "Requiere Poción vigorizante. Arcano de Sanación. Ayuda a tratar algunas heridas de mediano calibre que puedan haber sufrido los magos. Estabiliza tres heridas, aunque no las cura."}, {"id": "Pociones-32", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Filtro corrosivo", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta curiosa poción burbujeante, de desarrollo reciente, casi transparente, debe guardarse en un vial de cristal o derretirá cualquier otro material. Es muy complicada de preparar. La solución alquímica es un ácido con la capacidad de afectar a cualquier material, pero no tiene efecto sobre el cristal, o sobre la piel, pelaje o plumaje de ningún ser vivo. Puede usarse para derretir fragmentos de suelo, porciones de paredes, cerraduras o cualquier otro material."}, {"id": "Pociones-33", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Obfuscate mortem", "categorias": [], "requisito": "Requiere Mago Oscuro 2.", "texto": "Requiere Mago Oscuro 2. Arcano de utlidad. Esta poción que mezcla alquimia y nigromancia, permite a un inferius aparentar vida durante veinticuatro horas. Haciendo que su piel tenga un tono saludable, la sangre circule por sus venas y camuflando el olor a muerte entre otros detalles. Para detectar el engaño se debe superar una tirada de Conciencia a dificultad 15. Sus efectos no son una ilusión, por lo tanto detectar la poción no hace que terminen."}, {"id": "Pociones-34", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción crecepelo", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad Simple solución que ayuda a crecer el pelo (o el vello corporal) cuando se ha perdido. Usada creativamente, puede conferir o bien un +4 a tiradas de Estilo, o bien un +4 a tiradas de Subterfugio relacionadas con hacerte pasar por otra persona."}, {"id": "Pociones-35", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de Ataraxia", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Veneno de paz mental. Esta poción, cuando se ingiere, causa un estado absoluto de paz mental y calma. Durante una escena, aquel que haya sido envenenado con esta poción no podrá realizar ninguna acción violenta o agresiva, o siquiera concebir la violencia. Sus efectos se contrarrestan con un antídoto o con la Poción de Berserker."}, {"id": "Pociones-36", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de Babel", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Filtro de idiomas. Esta poción, cuyo principal ingrediente es una parte de lengua humana, permite a la persona hablar un idioma que no conozca como si tuviera un nivel de comprensión alto, el mismo idioma que la persona de la lengua que se está usando. La poción durará unas ocho horas activa una vez se ha ingerido. Esta poción sólo permite entender un idioma cada vez que se ingiere, y, para entender otro idioma diferente, deberá ingerirse otra dosis."}, {"id": "Pociones-37", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de Berserker", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Veneno de furia. Esta poción, cuando es ingiere, produce una furia salvaje incapaz de controlarse. Aquel que sea envenenado con esta poción no podrá realizar ninguna acción que no sea violenta o agresiva, atacando a todo el que tenga cerca (o incluso a sí mismo) durante una escena. Sus efectos se contrarrestan con un antídoto o con la Poción de Ataraxia."}, {"id": "Pociones-38", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de fuerza de semigigante", "categorias": ["Combate", "Utilidad"], "requisito": "Requiere Poción de fuerza de culturista.", "texto": "Requiere Poción de fuerza de culturista. Arcano de Combate. Arcano de Utilidad. Refuerza la capacidad física del personaje y le convierte en una pequeña mole, incluso alterando visiblemente su cuerpo y ganando algo de altura y tamaño. Después de consumir esta poción, y durante la siguiente escena o combate, se obtendrá +2 en Vigor. Esto también afectará a los atributos relacionados (como el Umbral de Heridas, el Ataque Físico, los PAs o Valor de Lucha Físico)."}, {"id": "Pociones-39", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de Gregory el Zalamero", "categorias": ["Utilidad"], "requisito": "Requiere Poción embellecedora.", "texto": "Requiere Poción embellecedora. Arcano de Utilidad. Esta poción permite al que la beba desarrollar una especie de sexto sentido que le facilite relacionarse con las personas para conseguir llamar su atención. Gana un +4 a todas las tiradas de Estilo y Seducción ejecutadas durante una escena."}, {"id": "Pociones-40", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de raíces sangrientas", "categorias": ["Combate"], "requisito": "Requiere Concentrado de brugmansia.", "texto": "Requiere Concentrado de brugmansia. Arcano de Combate. Ingerir esta poción causa un dolor terrible capaz de llevarse por delante a magos enfermizos si no se trata adecuadamente. Causa 1 Herida cada turno durante dos turnos. Se puede embadurnar un arma con este veneno. En caso de hacerlo, la siguiente tirada de Ataque podrá aplicar un efecto. Si el ataque con el arma iguala o supera la defensa del objetivo, el ataque causará, además del daño del impacto, un daño de 4 PA durante 3 turnos, a partir del turno siguiente al ataque."}, {"id": "Pociones-41", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de piel ignífuga", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Viscosa solución que provoca una intensa sudoración mágica con propiedades protectoras que previene el daño del fuego. Mientras se tenga esta capa de sudor, que durará hasta que se consuma con los hechizos arrojados, el conjurador ignorará todo el daño del fuego convencional, y el de un hechizo de fuego avanzado, dos intermedios o cuatro básicos (en cualquier combinación)."}, {"id": "Pociones-42", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción rejuvenecedora", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta poción sirve para rejuvenecer el cuerpo de la persona que ingiera la poción. El envejecimiento es un proceso extraño que tiene efectos diferentes en la persona que lo beba. Durante el tiempo que una persona esté afectada por esta poción utilizará los valores base de hasta dos etapas inferiores en su ficha en vez de los de su etapa actual (un Veterano que pase a Adulto pasará de 8 a 17 PAs base, y un Umbral de Heridas y Heridas de base 1 a base 3, por ejemplo). Adicionalmente, la persona contará con un bonificador de +4 a sus tiradas de Subterfugio para hacerse pasar por alguien de una edad distinta a la propia, incluso ante efectos mágicos como Rituales de Paso."}, {"id": "Pociones-43", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción de sentido animal", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Al beber esta poción, el que la ingiere puede escoger un rasgo de una criatura del Bestiario del foro (o una criatura que haya visto durante una misión) y adoptar uno de sus rasgos especiales. Si el rasgo adoptado aumenta una habilidad esta aumentará en +4 siempre y cuando sea Atletismo, Sigilo, Volar, Intimidación, Alerta o Supervivencia."}, {"id": "Pociones-44", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción debilitante", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este suave veneno no es especialmente dañino, pero puede resultar igualmente letal dado que afecta de manera particularmente grave a las condiciones de batalla de su usuario. Quien beba esta poción contará con un penalizador de -2 a sus valores de Ataque, Defensa e Iniciativa durante su siguiente combate (siempre que sea antes de doce horas), además de reducir su Umbral de Heridas en -2. No puede usarse con ninguno de los hechizos Alchimia Incantatio."}, {"id": "Pociones-45", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción envejecedora", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta poción sirve para envejecer el cuerpo del objetivo. El envejecimiento es un proceso extraño que tiene efectos diferentes en la persona que lo beba. Durante el tiempo que una persona esté afectada por esta poción utilizará los valores base de hasta dos etapas superiores en su ficha en vez de los de su etapa actual (un Mago Experimentado que pase a Veterano pasará de 17 a 8 PAs base, y un Umbral de Heridas y Heridas de base 3 a base 1, por ejemplo). Adicionalmente, la persona contará con un bonificador de +4 a sus tiradas de Subterfugio para hacerse pasar por alguien de una edad distinta a la propia, incluso ante efectos mágicos como Rituales de Paso."}, {"id": "Pociones-46", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Poción multijugos", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta compleja poción permite transformarse en una persona diferente durante una hora. La poción tarda un mes en elaborarse normalmente, aunque la mayoría de PJs probablemente tengan una base alquímica para facilitar y agilizar el proceso siempre preparada. Para hacerte pasar por una persona, necesitas una muestra genética de esa persona (un cabello, una uña...) que debe echarse a la poción antes de ingerirla (aunque después de prepararla). Mientras dure la escena, quien la ha bebido contará con un bonificador de +7 a todas sus tiradas de Subterfugio relacionadas con hacerse pasar por otra persona."}, {"id": "Pociones-47", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Preparado del árbol de las hienas", "categorias": ["Utilidad"], "requisito": "Requiere Poción aliento de perro.", "texto": "Requiere Poción aliento de perro. Arcano de Utilidad. Este ligero veneno produce en aquel que lo tome la necesidad insoportable de comenzar a reírse salvajemente, como si estuviera poseído. Esta risa será molesta e incómoda para los que la escuchen. Durante una escena, el objetivo contará con un penalizador de -4 a sus tiradas de Coordinación, Oratoria y Seducción."}, {"id": "Pociones-48", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Solución del estilista trágico", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta poción es ideal para personajes bromistas o dados al engaño. La poción puede disimularse como casi cualquier otra poción en cuanto a aspecto y contextura. A la hora de encontrarse ante una solución del estilista trágico, el objetivo debe hacer una tirada enfrentada de Herbología contra el valor de 5 + Poder + Pociones del pocionista que creó la poción (en caso de ser filtros de un único uso, la dificultad por defecto será de 9) para identificar de qué poción se trata y no confundirla. Cuando alguien bebe la solución del estilista trágico, pierde todo el pelo de su cuerpo (cabello y vello corporal por igual), así como dejando rastros de aspecto desagradable, y sólo podrá recuperarlo aplicando una Poción Crecepelo, no por medios naturales. Hasta ese momento, contará con un penalizador de -4 a todas sus tiradas de Estilo y Seducción."}, {"id": "Pociones-49", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Solución del ritualista", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Lo más angustioso de un ritual es la cantidad de arcanos simultáneos que un mago puede realizar. Esta poción ayuda considerablemente con ese factor. Después de realizar un ritual, el ritualista puede utilizar esta poción para obtener 1/2/4/7/9 puntos en rituales en función de su nivel en la habilidad de Pociones."}, {"id": "Pociones-50", "fuente": "Pociones", "nivel": "Intermedia", "nombre": "Vapores de Dharamsala", "categorias": ["Utilidad"], "requisito": "Requiere Filtro de Upsala.", "texto": "Requiere Filtro de Upsala. Arcano de Utilidad. En el interior de este vial hay una poción que parece estar condensada en forma gaseosa. Al abrir la tapa del mismo, se debe inhalar el gas que emite y, una vez hecho esto, parecerá estar más en sintonía con lo extraterrenal y lo mágico, como si pudiera ver los rastros de magia. Después de inhalar esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +4 a su valores de Adivinación y Consciencia. Adicionalmente, y de manera narrativa y a criterio del master, esta poción puede ayudar a aquellas personas con capacidades precognitivas (Oráculos) a desencadenar sus visiones, aunque seguirá siendo necesario una tirada de Adivinación para desentrañarlas."}, {"id": "Pociones-51", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Aliento de dragón", "categorias": ["Combate"], "requisito": "Requiere Concentrado de erumpent.", "texto": "Requiere Concentrado de erumpent. Arcano de Combate. La más poderosa de las pociones explosivas, llamada así en honor al aspecto que tiene cuando se libera del vial en el que queda recogida. Está pensada para usarse en combate, arrojándolo sobre un objetivo. Si se supera una tirada de Atletismo contra el valor de Defensa del objetivo, hará siempre un daño de 15 PA (es decir, no se puede hacer una contra a este ataque pero el daño tampoco aumenta si se supera la defensa). Esta poción cuenta como 4 impactos de cara a la resistencia de las barreras."}, {"id": "Pociones-52", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Amortentia", "categorias": [], "requisito": "", "texto": "El más poderoso de los filtros de amor. Beber esta poción atará irremediablemente a aquel que le ingiera a alguien por quien sentirá una repentina obsesión. A efectos de juego, el obsesionado tratará de estar siempre cerca del objeto de su obsesión, aprovechará cualquier excusa para hacerle un favor y tratará de protegerle de todo peligro, aún a costa de la propia vida. La persona que ha ingerido la poción sufrirá un penalizador de -7 a todas sus tiradas activas o pasivas para defenderse de todas las interacciones sociales con la persona con la que está obsesionada, y además fallará automáticamente cualquier tirada para resistirse a sus intentos de Seducción. Los efectos de esta poción duran 7 horas, y se irán degradando con el tiempo (un -1 cada hora), aunque, durante este tiempo, será tremendamente sencillo hacer que alguien vuelva a tomar la poción. Igualmente si se obliga a alguien a dañarse así mismo o a un ser querido, obtendrá un +4 a la tirada de Frialdad para resistirse a la orden (que deberá ser modificado por el penalizador que otorgue la poción en ese momento). Esta poción debe ingerirse, no puede aplicarse sobre un arma u otro efecto similar."}, {"id": "Pociones-53", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Chuchería para bestias", "categorias": ["Utilidad"], "requisito": "Requiere chuchería para animales.", "texto": "Requiere chuchería para animales. Arcano de utilidad. Este apetitoso tentempié solo suelen encontrarse en los bolsillos de aquellos magizoologos que tienen un concepto algo inusual de lo realmente peligrosas que son algunas criaturas. De muchos tipos diferentes, estas pequeñas delicias son muy efectivas para lograr un mejor trato por parte de una criatura mágica de peligrosidad **** o *****. Si se supera una tirada de Magizoologia a dificultad 15, se logrará un +1 a cualquier tirada futura de Magizoologia con dicha criatura, ya sea para lograr que haga algo en concreto, para bajar la animosidad de la misma o cualquier otra acción. Con uno o dos grados de éxito adicionales ese bonificador pasará a ser un +2 o +4 respectivamente."}, {"id": "Pociones-54", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Destilado de Asfodelo", "categorias": ["Sanación"], "requisito": "Requiere Concentrado de Centidonia.", "texto": "Requiere Concentrado de Centidonia. Arcano de Sanación. Beber esta poción recupera todos (y una mitad de PAs adicionales) los PAs perdidos por quien la ingiere en los últimos momentos, dando un subidón de energía e ignorando los PAs máximos por Heridas. Sin embargo, esta poción ni estabiliza ni cura las Heridas, por lo que se sigue manteniendo el penalizador y, además, es posible caer por Heridas incluso cuando se tienen PAs"}, {"id": "Pociones-55", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Elixir dorado", "categorias": ["Sanación"], "requisito": "Requiere Antídoto.", "texto": "Requiere Antídoto. Arcano de Sanación. Este líquido dorado y espeso sirve como remedio para eliminar las toxinas del cuerpo. Sirve para contrarrestar los efectos de cualquier poción nociva de categoría avanzada, salvo que exista algún antídoto específico contra ellos."}, {"id": "Pociones-56", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Elixir de Insignificancia", "categorias": [], "requisito": "", "texto": "Arcnao de Utilidad. Complicada poción que sirve para hacerte desaparecer. Sólo que, en realidad, su efecto real no es la desaparición, sino que la gente deje de fijarse en ti e ignorarte por completo. Si no has interactuado directamente con algunas personas, éstas incluso olvidarán que has estado ahí. Ideal para colarse en sitios complicados o para salir armado a la calle sin que te detengan. De hacer una acción que llame la atención sobre ti (como, por ejemplo, comenzar un duelo mágico en mitad de una calle, o abrir una cámara acorazada), deberás hacer una tirada de Subterfugio con un bonificador de +4 enfrentado al valor de Consciencia de los espectadores de la escena. Si superas la tirada, conseguirás que sigan ignorándote. En caso de fallar, el elixir perderá todo su efecto. Si la acción es contra una persona, y esa persona tiene tiempo de reaccionar (por ejemplo, si atacas a alguien y no eres capaz de dejarle inmediatamente inconsciente), se considerará como un fallo en la tirada automáticamente."}, {"id": "Pociones-57", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Elixir Vitalis", "categorias": ["Sanación"], "requisito": "Requiere Esencia de Díctamo.", "texto": "Requiere Esencia de Díctamo. Arcano de Sanación La más poderosa poción curativa que existe. Restaña las heridas provocadas por importantes maldiciones. No sustituye una estancia en San Mungo, pero te ayuda a seguir adelante. Cura completamente una Herida, pero solo puede aplicarse una vez por cada combate realizado en el que se haya sufrido heridas. Es decir si alguien participa en dos combates y sufre dos heridas en uno y ninguno en el otro, tan solo podrá usarse la poción para curar una herida del primer combate."}, {"id": "Pociones-58", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Felix Felicis", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Poción de suerte líquida. Complicadísima poción que otorga a quien la ingiere un efecto que parece recordar a una bendición de la fortuna, aunque los efectos posteriores pueden recordar más a la peor de las resacas. Al consumir esta poción se rebajará en uno los grados de dificultad de todas las tiradas durante una escena. Después se hará una tirada de Pociones a dificultad 15, no pasando nada si se supera. En caso contrario, la resaca de esta poderosa poción hará que se tenga un grado más de dificultad a la siguientes tiradas que se realicen (una por cada grado de fallo). Cada dosis extra de esta poción durante la misma aventura aumenta la dificultad de la tirada de pociones en uno."}, {"id": "Pociones-59", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Filtro de insensibilidad", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este concentrado oscuro resulta totalmente insípido en los labios y desprende un característico olor desagradable. Tras ingerirse, apaga por completo los sentimientos por otras personas y cualquier vinculación emocional existente, ya sea natural o generada mágicamente. La persona que ha ingerido la poción sufrirá un bonificador de +4 a todas activas o pasivas para defenderse de todas las interacciones sociales y un +7 para resistir los efectos de Seducción. Los efectos de esta poción duran 4 horas, y se irán degradando con el tiempo (un -1 cada hora). Además, si esta poción se ingiere mientras se tienen los efectos de la Amortentia, ambas pociones se anulan mutuamente. Esta poción debe ingerirse, no puede aplicarse sobre un arma u otro efecto similar."}, {"id": "Pociones-60", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Filtro de muertos en vida", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Induce en un sueño tremendamente profundo, casi como un coma, a la persona que beba el contenido de la poción, del que no podrá despertar hasta recibir el antídoto, la Poción Wiggenweld."}, {"id": "Pociones-61", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Filtro de precognición", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de utilidad. Esta peculiar mezcla de Azotalenguas, Aguijones de Billywig y Cuerno de Ciervo adquiere un tono violeta brillante cuando es debidamente preparada. Al ser consumida, el personaje obtiene un pequeño vistazo dentro del futuro inmediato permitiéndole actuar en respuesta a este. Al beber esta poción es posible lanzar 2 dados para la siguiente tirada de habilidad que se realice y seleccionar si se desea usar el resultado mayor o menor de entre los dos dados."}, {"id": "Pociones-62", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Poción de fuerza de gigante", "categorias": ["Combate", "Utilidad"], "requisito": "Requiere Poción de fuerza de semigigante.", "texto": "Requiere Poción de fuerza de semigigante. Arcano de Combate. Arcano de Utilidad. Refuerza hasta sus límites la capacidad física del personaje, convirtiéndole en una figura a la que ningún semigigante tendría nada que envidiar, aumentando su complexión, musculatura y fuerza en general. Después de consumir esta poción, y durante la siguiente escena o combate, se obtendrá +3 en Vigor. Esto también afectará a los atributos relacionados (como el Umbral de Heridas, el Ataque Físico, los PAs o Valor de Lucha Físico)."}, {"id": "Pociones-63", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Poción de Helena de Troya", "categorias": ["Utilidad"], "requisito": "Requiere Poción de Gregory el Zalamero.", "texto": "Requiere Poción de Gregory el Zalamero. Arcano de Utilidad. Al igual que Helena, cualquiera que ingiera esta poción podría convertirse en la envidia misma de un dios. Gana un +7 a todas las tiradas de Estilo y Seducción ejecutadas durante una escena."}, {"id": "Pociones-64", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Poción de la desesperación", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Esta poción es una de las formas más terribles de veneno. Aunque no causa ningún tipo de daño en aquel que la beba, sí que pasará factura de manera bastante grave, volviendo a aquel que la beba un despojo desesperado que estará sumido en su propia desesperación. Quien beba esta poción contará con un penalizador de -4 a sus valores de Ataque, Defensa e Iniciativa durante su siguiente combate (siempre que sea antes de doce horas), además de reducir su Umbral de Heridas en -2. No puede usarse con ninguno de los hechizos Alchimia Incantatio."}, {"id": "Pociones-65", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Poción Matalobos", "categorias": [], "requisito": "", "texto": "Arcano de utlidad. Es una de las pociones más complicadas de realizar. Durante una noche, otorga a los hombres lobo la capacidad para mantener su conciencia humana a pesar de la transformación en hombre lobo, que no se puede evitar de ninguna manera."}, {"id": "Pociones-66", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Vahos de Delfos", "categorias": ["Utilidad"], "requisito": "Requiere Vapores de Dharamsala.", "texto": "Requiere Vapores de Dharamsala. Arcano de Utilidad. En el interior de este vial hay una poción que parece estar condensada en forma gaseosa. Al abrir la tapa del mismo, se debe inhalar el gas que emite y, una vez hecho esto, parecerá estar más en sintonía con lo extraterrenal y lo mágico, como si pudiera ver los rastros de magia. Después de inhalar esta poción, y durante la siguiente escena, el usuario tendrá un bonificador de +7 a su valores de Adivinación y Consciencia. Adicionalmente, y de manera narrativa y a criterio del master, esta poción puede ayudar a aquellas personas con capacidades precognitivas (Oráculos) a desencadenar sus visiones, aunque seguirá siendo necesario una tirada de Adivinación para desentrañarlas."}, {"id": "Pociones-67", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Veritaserum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Comúnmente conocida como suero de la verdad. Esta poción incolora, insípida e inodora es una eficaz, aunque no infalible, herramienta para sonsacar los secretos de casi cualquier persona. Cada turno, el interrogador tendrá derecho a realizar una pregunta al objetivo, y éste tendrá que contestar en función de la pregunta. Mientras esté bajo los efectos del Veritaserum, el objetivo no podrá hacer otra cosa que luchar mentalmente por controlarse, por lo que apenas sí podrá moverse o actuar. El interrogado realizará cada turno una tirada de Frialdad contra el valor de 5 + Inteligencia + Herbología +4 del pocionista que ha preparado el Veritaserum para resistirse a contestar a las preguntas que le hagan. En caso de fallar esta tirada, deberá contestar contando toda la información en su conocimiento sobre el tema del que le han preguntado; no serán válidas medias verdades ni similares. Puede intentar mentir, aunque para eso la tirada de Frialdad deberá haber superado por al menos 4 puntos el resultado de la tirada anterior. Aún así, si escoge mentir, tendrá que superar la habitual tirada de Subterfugio, aunque en esta ocasión con un penalizador severo de -4. Esta poción debe ingerirse, no puede aplicarse sobre un arma u otro efecto similar."}, {"id": "Pociones-68", "fuente": "Pociones", "nivel": "Avanzada", "nombre": "Zumo de tentácula venenosa", "categorias": ["Combate"], "requisito": "Requiere Poción de raíces sangrientas.", "texto": "Requiere Poción de raíces sangrientas. Arcano de Combate. La tentácula venenosa es una de las plantas más peligrosas de la naturaleza. Beber este veneno es similar a tomar ácido, y causará estragos en cualquiera que no esté preparado haciéndole perder 1 herida cada turno hasta que sea capaz de detener sus efectos con un antídoto, a partir del momento en que fue ingerida. Se puede embadurnar un arma con este veneno. En caso de hacerlo, la siguiente tirada de Ataque podrá aplicar un efecto. Si el ataque con el arma iguala o supera la defensa del objetivo, el ataque causará, además del daño del impacto, un daño de 6 PA cada turno hasta que sea capaz de detener sus efectos con un antídoto, a partir del turno siguiente al ataque."}, {"id": "Hechizos-1", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Accio", "categorias": [], "requisito": "", "texto": "Encantamiento convocador. Permite atraer un objeto a las manos del lanzador, incluso a una distancia significativa (aunque esto sólo funciona con objetos con los que el conjurador está muy familiarizado, a discreción del master). Este hechizo puede usarse añadiendo a la conjuración el nombre del objeto a convocar (por ejemplo, \"Accio Escoba\") o sin añadirlo, apuntando con la varita directamente a ese objeto. Este hechizo no reemplaza la búsqueda de una pista concreta en una estancia (no se puede atraer algo que no se conozca y esté oculto), y se debe saber qué es lo que se está conjurando en concreto para poder atraer algo que no esté a la vista. Multitud de objetos de importancia están protegidos contra este encantamiento, y sería necesario romper las protecciones con disipadores mágicos antes de atraerlos."}, {"id": "Hechizos-2", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Aguamenti", "categorias": [], "requisito": "", "texto": "Conjuración de agua. Este hechizo genera un chorro de agua desde la punta de la varita. Si se usa sobre un fuego natural, el conjurador deberá superar una tirada de Supervivencia (dificultad a criterio del master en función de la intensidad del fuego. Por defecto, una hoguera tendrá una dificultad de 7, y un incendio forestal puede tenerla de 15) para apagarlo correctamente. No puede usarse sobre un fuego provocado por efectos mágicos, como arcanos."}, {"id": "Hechizos-3", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Arresto Momentum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de detención. Detiene en seco cualquier movimiento. Puede usarse para detener una avalancha o desprendimiento, o prevenir una caída desde grandes alturas. Debido al tiempo necesario para conjurarlo correctamente, no se puede usar sobre uno mismo para caídas inferiores a 50 metros."}, {"id": "Hechizos-4", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Ascendio", "categorias": [], "requisito": "", "texto": "Encantamiento de ascenso. Se usa para levantarse del suelo a gran velocidad. También se usa para salir del agua cuando estás a bajas profundidades. Si se utiliza mal, puede provocar daños menores, pero nada considerable como para quitar PA."}, {"id": "Hechizos-5", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Bauleo", "categorias": [], "requisito": "", "texto": "Encantamiento de ordenación. Útil hechizo que hace que se ordenen los objetos a sí mismos dentro de un baúl. Perfecto para hacer el equipaje."}, {"id": "Hechizos-6", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Calidum", "categorias": [], "requisito": "", "texto": "Encantamiento de aire caliente. Genera una pequeña brisa de aire caliente de la punta de la varita, que puede secar la ropa húmeda o derretir la nieve. Usando este hechizo, el conjurador puede hacer una tirada de Supervivencia a dificultad 7. En caso de superarla, eliminará cualquier posible penalización o consecuencia negativa del frío o las bajas temperaturas, y será capaz de secar cualquier cantidad de ropa mojada."}, {"id": "Hechizos-7", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Colovaria", "categorias": [], "requisito": "", "texto": "Hechizo de cambio de color. Este encantamiento artístico permite cambiar el color a un objeto o ser vivo."}, {"id": "Hechizos-8", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Crinus Muto", "categorias": [], "requisito": "", "texto": "Hechizo estilístico. Este hechizo de transformación permite cambiar el color y el estilo del cabello (y otras zonas del vello corporal) de una persona."}, {"id": "Hechizos-9", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Depulso", "categorias": [], "requisito": "", "texto": "Encantamiento repulsor. Permite enviar los objetos lejos del usuario. Si se usa sobre un objeto que está siendo atraído en tu dirección mediante Accio, provoca una tirada enfrentada de Poder."}, {"id": "Hechizos-10", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Descendo", "categorias": [], "requisito": "", "texto": "Encantamiento de descenso. Este hechizo, que sólo se puede conjurar sobre uno mismo, te hace caer a gran velocidad y sin ningún tipo de control. Sobre todo es útil para controlar una inmersión en el agua. Este hechizo no ayuda a controlar la caída, y, si se usa desde grandes alturas para caer en suelo firme, lo más probable es que termine con resultados truculentos."}, {"id": "Hechizos-11", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Fregotego", "categorias": [], "requisito": "", "texto": "Encantamiento de aseo doméstico. Permite realizar de manera automática y mágica ciertas tareas domésticas, como limpiar los cacharros."}, {"id": "Hechizos-12", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Lumos", "categorias": [], "requisito": "", "texto": "Ilumina la punta de la varita y ésta alumbra a su alrededor, como si fuera una antorcha."}, {"id": "Hechizos-13", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Nox", "categorias": [], "requisito": "", "texto": "Encantamiento de oscuridad. Apaga cualquier fuente de luz cercana al mago, ya sea mágica (como Lumos) o mecánica (una farola, una antorcha...). Obviamente, no sirve para apagar la luz del sol."}, {"id": "Hechizos-14", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Sonorus", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de amplificación sonora. Se usa sobre la garganta del conjurador. Inmediatamente aumenta el sonido y la potencia de su voz, además de darle un aire bastante distinguido mientras esté hablando así. En algunas reuniones sociales, se considera protocolario el uso de este hechizo sobre la muchedumbre."}, {"id": "Hechizos-15", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Tergeo", "categorias": [], "requisito": "", "texto": "Encantamiento limpiador. Permite aspirar líquido, polvo y otras sustancias con la punta de la varita."}, {"id": "Hechizos-16", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Waddiwasi", "categorias": [], "requisito": "", "texto": "Encantamiento de repulsión. Expulsa un objeto que esté obstruyendo una apertura y lo lanza en otra dirección."}, {"id": "Hechizos-17", "fuente": "Hechizos", "nivel": "Doméstico", "nombre": "Wingardium Leviosa", "categorias": [], "requisito": "", "texto": "Encantamiento levitador. Permite elevar objetos siguiendo los movimientos de la varita. Este encantamiento no sirve sobre personas humanas, aunque sí sobre animales pequeños (como ardillas, hurones o ratas)."}, {"id": "Hechizos-18", "fuente": "Hechizos", "nivel": "", "nombre": "Adoleret", "categorias": ["Combate"], "requisito": "Requiere ser Ordenista Novato.", "texto": "Requiere ser Ordenista Novato. Arcano de Combate. Hechizo de deflagración. Este hechizo lanza una pequeña chispa de fuego que golpea al enemigo y le hace un pequeño daño ígneo de 2 PAs. Si el hechizo llega sobre un enemigo al que en este turno o el anterior le ha atacado un ordenista, el daño será de 8 PAs y causará un -2 al ataque del rival."}, {"id": "Hechizos-19", "fuente": "Hechizos", "nivel": "", "nombre": "Agmen", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Arcano de Utilidad. La varita del objetivo empieza a brillar tenuemente, iluminada con una luz blanquecina. Potencia los efectos base del próximo hechizo que lance el objetivo. En caso de hechizos dañinos, este efecto será de +2 a la base de daño, sin alterar el resto de factores. En caso de hechizos de penalización, aumentará la penalización en -2 puntos (priorizando, si lo hubiera, el valor principal afectado). En hechizos narrativos, el efecto queda a discreción del master. Este hechizo no puede usarse sobre uno mismo."}, {"id": "Hechizos-20", "fuente": "Hechizos", "nivel": "", "nombre": "Alarte Ascendere", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate.Embrujo ascendente. Un rápido movimiento de muñeca hace que el objetivo salte por los aires, haciéndolo volar y caer al cabo de varios metros. La altura en seres vivos no es suficiente para hacer daño, pero mareará y desplazará al objetivo, haciéndole sufrir un penalizador -1 en sus valores de Ataque e Iniciativa."}, {"id": "Hechizos-21", "fuente": "Hechizos", "nivel": "", "nombre": "Alchimia Incantatio Mínima", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad.El conjurador debe remover la mano por encima de un vial de una poción básica destapado. Los gestos de varita condensarán el reactivo alquímico y lo alzarán, convertido en un preparado líquido que se absorberá en la punta de la varita. Después de eso, y cuando lo desee, el conjurador podrá impulsar la esencia de la poción contra otra persona como si fuera un hechizo cualquiera, aplicando sus efectos si superan el valor de Defensa del objetivo con una tirada de Ataque Mágico del mismo modo que si hubieran bebido la poción. Este ataque no tiene que ser el siguiente conjuro que se lance, aunque se contará con un penalizador de -2 a todas las acciones con varita hasta que se consiga enviar adecuadamente."}, {"id": "Hechizos-22", "fuente": "Hechizos", "nivel": "", "nombre": "Alohomora", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de apertura. Permite abrir y desbloquear puertas cerradas con llave. El mago hace una tirada de Latrocinio con un bonificador de +2. Si supera una dificultad de 9, abrirá cualquier puerta con una cerradura normal. Un 12 será para cerraduras muggles complejas (por ejemplo, una puerta blindada). Un 15 abrirá las cerraduras muggles más complejas (por ejemplo, de cajas fuertes). 18 o más será para las cerraduras muggles más difíciles del mundo, y se recomienda al master usar esas dificultades con prudencia. Alohomora no permite abrir cerraduras mágicas o encantadas, como las de los rituales Fermaportus y Fermaportus Máxima. Sin tener este hechizo, las dificultades aumentan en un grado de éxito."}, {"id": "Hechizos-23", "fuente": "Hechizos", "nivel": "", "nombre": "Alset", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Arcano de Utilidad. Un pequeño chispazo eléctrico negro salta de la punta de la varita hasta un objeto. Éste se desmontará y separará en todos sus componentes, dejando de funcionar hasta que se repare. El objeto no puede ser mágico. Si se lanza en combate (como al arma no encantada de un enemigo) requerirá tirada de impacto de manera normal."}, {"id": "Hechizos-24", "fuente": "Hechizos", "nivel": "", "nombre": "Amica Plantae", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate.El conjurador consigue la ayuda de las plantas con un movimiento de varita. Éstas se moverán a obedecer su conjuración, intentando estorbar el movimiento e incordiar a varios objetivos en una zona, creciendo enredaderas en los pies de una persona o surgiendo brotes de la tierra que la vuelvan removida y difícil de manejarse. Este hechizo convierte un terreno en un terreno inestable, lo que causará un penalizador de -2 en la Iniciativa."}, {"id": "Hechizos-25", "fuente": "Hechizos", "nivel": "", "nombre": "Aparecium", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Hechicero 2.", "texto": "Requiere Especialización Hechicero 2. Arcano de Utilidad. Se utiliza sobre un objeto para saber si es un objeto encantado o no, además de los encantamientos que tenga este objeto. También revela tinta invisible o mensajes escondidos mágicamente. Después de conjurar este hechizo, se ha de hacer una tirada de Consciencia, a dificultad 9. Si se supera la tirada, se podrá analizar el objeto en cuestión o revelar la tinta invisible en un papel. En caso de objetos intermedios o tinta ocultada mediante arcanos intermedios, la dificultad aumenta a 12, y a 15 en caso de objetos avanzados."}, {"id": "Hechizos-26", "fuente": "Hechizos", "nivel": "", "nombre": "Aquaeructo", "categorias": ["Combate", "Utilidad"], "requisito": "", "texto": "Arcano de Combate. Arcano de Utilidad.Conjuración de agua. Este hechizo genera un chorro de agua parecido al de una manguera a presión, más potente que el del hechizo Aguamenti. Usado contra una persona, será un incómodo chorro de agua que causará 4 PAs. El mago puede hacer una tirada de Supervivencia con un bonificador de +2. Si supera una dificultad de 9, será capaz de apagar la mayoría de incendios de naturaleza muggle. Si se trata de un fuego totalmente descontrolado, la dificultad puede aumentar a 12 y a 15. También puede apagar los efectos de fuegos mágicos sobre una persona, impidiendo que sigan haciendo efecto. La misma escala de dificultades anteriores representará el nivel del hechizo (9 para básicos, 12 para intermedios, 15 para avanzados), pero, usado de esta forma, también causará el penalizador en el aliado."}, {"id": "Hechizos-27", "fuente": "Hechizos", "nivel": "", "nombre": "Atabraquium", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Embrujo ata-manos. Sirve para mantener atadas y pegadas las manos del objetivo sin necesidad de cuerda o esposas, impidiéndole hacer magia con la varita o usar las manos e incluso aparecerse. Sólo se puede usar con un enemigo derrotado que tenga las manos juntas. Un enemigo derrotado con este hechizo no tendrá la opción de hacer nada por su propio pie hasta que sea liberado."}, {"id": "Hechizos-28", "fuente": "Hechizos", "nivel": "", "nombre": "Avis", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Conjuración de pájaros. El hechizo convoca una bandada de pájaros que acosa y molesta al objetivo, obligándole a quitarse de en medio o apartarse de la molestia que provocan antes de poder continuar combatiendo con normalidad. El objetivo tendrá un penalizador de -1 a sus valores de Ataque, Defensa e Iniciativa pero la bandada de pájaros también molesta al conjurador de este hechizo provocándole un -1 en Iniciativa."}, {"id": "Hechizos-29", "fuente": "Hechizos", "nivel": "", "nombre": "Bombarda", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Embrujo explosivo. Este hechizo provoca una pequeña detonación que se usa para hacer temblar estructuras, porciones de muro y similares. Usado sobre una persona, causa 4 PAs de daño. Usado sobre una barrera mágica, contará como 3 impactos en vez de 1. En caso de que Bombarda destruya una barrera mágica, también aplicará el daño correspondiente al conjurador de dicha barrera."}, {"id": "Hechizos-30", "fuente": "Hechizos", "nivel": "", "nombre": "Carpe Retractum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de tira y afloja. Conjura un lazo en la punta de la varita, que se enrolla en los objetos hacia los que se esté apuntando. Permite arrastrar peso o usarlo como cuerda en caso de necesidad. Este hechizo permite tener siempre un látigo a mano. Adicionalmente, si se usa sobre un objeto que está en el suelo o que ha sido desarmado, este hechizo siempre actuará antes que las acciones del resto de personas que traten de hacerse con ello."}, {"id": "Hechizos-31", "fuente": "Hechizos", "nivel": "", "nombre": "Claustra Terrae", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. El hechizo genera una pequeña protección construida con su entorno que ayuda a proteger de 2 impactos. Este hechizo genera una zona de protección estática que puede cubrir a un grupo de personas. Mientras mantengas este hechizo y la protección siga en pie, el conjurador no puede usar otros hechizos. Si se desea desvanecer la barrera preventivamente, el conjurador puede escoger hacerlo: si es así, actuará el último en el orden de Iniciativa (independientemente del resultado de su tirada) y, además, no tendrá el efecto de la barrera desde el inicio de ese turno. También actuará el último en iniciativa el turno siguiente a que la barrera sea destruida. Si el conjurador intenta alejarse de la zona en la que ha conjurado, la barrera se desvanecerá."}, {"id": "Hechizos-32", "fuente": "Hechizos", "nivel": "", "nombre": "Calvorio", "categorias": [], "requisito": "", "texto": "Maldición de pérdida de cabello. Provoca que el cabello de la víctima empiece a caerse. La pérdida de cabello es temporal, y regresará al cabo de las horas (tardará más cuanto mayor sea la diferencia del resultado de Ataque frente a la Defensa). Mientras se tenga la pérdida de cabello, el objetivo sufrirá un penalizador de -1 a todas sus tiradas de Estilo y Seducción, siempre que sea en casos que dependen de la apariencia física."}, {"id": "Hechizos-33", "fuente": "Hechizos", "nivel": "", "nombre": "Defodio", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad.Hechizo excavador. Permite cavar túneles a través de la tierra y la roca. La velocidad de excavado no es demasiado grande, pero alguien con el tiempo adecuado puede crear un camino con algo más de velocidad que si tuviera que llevar una pala. Este hechizo puede excavar también muros y otros elementos. Para alcanzar un objetivo (por ejemplo, acertar en el interior de una casa después de haber excavado el camino) debe superarse una tirada de Supervivencia a dificultad 9 (aunque el master puede añadir bonificadores o penalizadores por diversas situaciones)."}, {"id": "Hechizos-34", "fuente": "Hechizos", "nivel": "", "nombre": "Diffindo", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Encantamiento seccionador. Permite crear cortes e incisiones en ciertos objetos. Puede generar cortes en seres vivos si se apunta sobre ellos. Sobre un ser humano, causará un daño de 2 PA durante 3 turnos."}, {"id": "Hechizos-35", "fuente": "Hechizos", "nivel": "", "nombre": "Dissendium", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento pasadizos. Este hechizo permite forzar a abrir cualquier pasadizo y secreto o camino oculto. Si se usa sobre un pasadizo que el conjurador conoce previamente (ya sea porque ha sido informado de éste durante la misión o porque lo conocía gracias a su conocimiento previo), el hechizo es automático. En caso de no saber si hay o no un pasadizo, Dissendium puede ayudar a encontrarlos: el mago debe superar una tirada de Supervivencia, a una dificultad variable según lo escondido del pasadizo (si está tras una ilusión simple, la dificultad será de 9. Si es un camino secreto para entrar en la guarida de un mago oscuro poderoso y utilizado como recurso de emergencia, seguramente sea de 21. Es tarea del master determinar esta dificultad). En caso de superarla, podrá localizar también ese pasadizo. Algunos pasadizos pueden incluir otros obstáculos que han de superarse de forma independiente (por ejemplo, una puerta cerrada todavía requerirá la llave o el uso de Alohomora o similares)."}, {"id": "Hechizos-36", "fuente": "Hechizos", "nivel": "", "nombre": "Ennervate", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Contrahechizo de Desmaius.. Permite levantar a una persona que esté sometida a un sueño mágico. También ayuda a despertar a personas inconscientes o heridas. Si la persona está a 0 Heridas pero todavía no ha muerto, el conjurador de Ennervate puede forzarla a despertar con una tirada de Medicina a dificultad 9, pero después de una escena, el herido volverá a desplomarse inevitablemente."}, {"id": "Hechizos-37", "fuente": "Hechizos", "nivel": "", "nombre": "Episkey", "categorias": ["Contrahechizo", "Sanación"], "requisito": "Requiere Especialización Medimago 1.", "texto": "Requiere Especialización Medimago 1. Contrahechizo de Diffindo. Arcano de Sanación. Cura pequeñas heridas y molestias, como un labio sangrante o un pequeño corte inofensivo. Detiene los efectos de heridas sangrantes provocadas por el hechizo Diffindo y recupera los PAs perdidos por su efecto si se aplica antes de que éste termine el combate (aunque el efecto del maleficio ya haya concluido)"}, {"id": "Hechizos-38", "fuente": "Hechizos", "nivel": "", "nombre": "Expulso", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de combate. Embrujo de empujón. Empuja bruscamente por los aires a una persona u objeto, desestabilizándolo por completo y haciéndolo retroceder. La persona queda vulnerable hasta que consigue recuperar la posición, sufriendo un penalizador de -2 en su valor de Defensa."}, {"id": "Hechizos-39", "fuente": "Hechizos", "nivel": "", "nombre": "Ferula", "categorias": ["Sanación"], "requisito": "Requiere Especialización Medimago 1.", "texto": "Requiere Especialización Medimago 1. Arcano de Sanación. Permite entablillar zonas heridas y conjurar cabestrillos, tiritas o vendas en caso de ser necesario. Permite tirar y da un +2 a las tiradas de Medicina para estabilizar Heridas de otras personas (que, aún así, deberán ser curadas posteriormente) y eliminar el penalizador que producen. Para estabilizar una Herida, debe superarse una tirada de Medicina a dificultad Complicada (12). Cada grado de éxito que se supere la tirada de Medicina, estabilizará una Herida extra (hasta un máximo de dos Heridas, contando la inicial). Este hechizo se puede usar sobre uno mismo, aunque, para hacerlo, se debe tener la Especialización Medimago 3."}, {"id": "Hechizos-40", "fuente": "Hechizos", "nivel": "", "nombre": "Fett", "categorias": ["Combate"], "requisito": "Requiere ser Ordenista Novato.", "texto": "Requiere ser Ordenista Novato. Arcano de Combate. Este hechizo dificulta el movimiento y la capacidad de acción del objetivo llenándolo de lo que parece una sustancia incómoda y viscosa, reduciendo Defensa en -1 durante un turno. Si el hechizo llega sobre un enemigo al que en este turno o el anterior le ha atacado un ordenista, el penalizador será de -2 a su Ataque, Defensa e Iniviativa pero el esfuerzo también causará un -2 al ataque del conjurador."}, {"id": "Hechizos-41", "fuente": "Hechizos", "nivel": "", "nombre": "Fiendlock", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Contrahechizo de fuego. Hechizo diseñado específicamente para luchar contra los efectos de Fiendfyre, aunque su potencia lo hace útil para deshacerse también de los causados por otros hechizos de fuego inferiores como Lacarnum Inflamarae e Incendio. Este hechizo cesa automáticamente los efectos continuados que se están sufriendo por parte de esos hechizos."}, {"id": "Hechizos-42", "fuente": "Hechizos", "nivel": "", "nombre": "Finestra", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de ventana. Este hechizo crea una abertura en paredes muy finas (no más gruesas que un muro de ladrillos) o en ventanas de cristal con la forma de una ventana perfecta. Si se supera una tirada de Latrocinio a dificultad 9, la abertura creada se cerrará mágicamente tras unos momentos sin dejar rastro de su existencia. Ideal para ciertas infiltraciones, aunque no serviría para atravesar un lugar realmente protegido o atrincherado."}, {"id": "Hechizos-43", "fuente": "Hechizos", "nivel": "", "nombre": "Flipendo", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Embrujo de rechazo. Este pequeño maleficio causa un empujón en el objetivo. Es ideal para desparasitar un terreno lleno de gnomos de jardín. Sobre un mago es más difícil que le haga daño, pero, aún así, le causará un penalizador de -2 en su valor de Ataque."}, {"id": "Hechizos-44", "fuente": "Hechizos", "nivel": "", "nombre": "Fluctus Mínima", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este hechizo sólo se puede conjurar cuando se está canalizando una barrera mágica. El conjurador envía un pulso de energía arcana desde la punta de su varita a su propia barrera (no funciona en protecciones ajenas) y la convierte en restos arcanos que, posteriormente, enviar contra un enemigo. Convierte los impactos básicos restantes de las barrera en un hechizo que los arroja contra el enemigo y hace un daño de 1 PAs de daño por cada impacto restante. Después de conjurar este hechizo, se pierde la iniciativa igual que si se hubiera destruido la barrera."}, {"id": "Hechizos-45", "fuente": "Hechizos", "nivel": "", "nombre": "Frigus", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Hechizo helado. Baja ligeramente la temperatura de las cosas y congela pequeñas partes del cuerpo del objetivo, ralentizando su movimiento y causando un daño por una sensación de frío incómoda. Causa un daño de 4 PAs y un penalizador de -1 en el valor de Ataque."}, {"id": "Hechizos-46", "fuente": "Hechizos", "nivel": "", "nombre": "Homorphus", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Hechicero 3.", "texto": "Requiere Especialización Hechicero 3. Contrahechizo de Transformaciones. Fuerza a un ser humano transformado mediante algún hechizo o fórmula mágica, independientemente de su procedencia, a regresar a su forma original. También puede forzar a un animago a volver a su forma humana. No funciona con hombres lobo durante la luna llena."}, {"id": "Hechizos-47", "fuente": "Hechizos", "nivel": "", "nombre": "Jaulio", "categorias": ["Combate"], "requisito": "Requiere Claustra Terrae.", "texto": "Requiere Claustra Terrae. Arcano de Combate. El hechizo levanta una serie de barrotes dorados del suelo que envuelven en una jaula a su objetivo, dejándole completamente atrapado hasta que se destroce la jaula con 4 impactos. Esta jaula sólo puede encerrar a un objetivo, para el que se debe superar una tirada de Ataque Mágico convencional para impactar. Mientras mantengas este hechizo y la jaula siga en pie, el conjurador no puede usar otros hechizos. Si se desea desvanecer la barrera preventivamente, el conjurador puede escoger hacerlo: si es así, actuará el último en el orden de Iniciativa (independientemente del resultado de su tirada) y, además, no tendrá el efecto de la barrera desde el inicio de ese turno. También actuará el último en iniciativa el turno siguiente a que la barrera sea destruida. Si el conjurador intenta alejarse de la zona en la que ha conjurado mientras lo mantiene, la bar
