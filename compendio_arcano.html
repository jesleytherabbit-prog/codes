<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compendio Arcano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,650;1,9..144,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d100e;
  --ink-2:#141815;
  --ink-3:#1b201c;
  --hairline:#2a3129;
  --parchment:#e8e2cf;
  --parchment-dim:#a9a493;
  --parchment-faint:#716c5d;
  --gold:#c9a24b;
  --gold-soft:#8a7233;

  --c-objetos:#c9a24b;
  --c-objetos-bg:rgba(201,162,75,.13);
  --c-rituales:#8a6bd1;
  --c-rituales-bg:rgba(138,107,209,.14);
  --c-pociones:#4fa87b;
  --c-pociones-bg:rgba(79,168,123,.14);
  --c-hechizos:#c0554c;
  --c-hechizos-bg:rgba(192,85,76,.14);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,75,.06), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(138,107,209,.05), transparent 55%),
    var(--ink);
  color:var(--parchment);
  font-family:'Spectral', Georgia, serif;
  min-height:100vh;
}

.wrap{max-width:920px;margin:0 auto;padding:40px 22px 90px;}

/* ---------- Header ---------- */
header.top{margin-bottom:34px;}
.crest{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:650;
  font-size:clamp(2.1rem, 5vw, 3.1rem);
  letter-spacing:.01em;
  margin:0;
  color:var(--parchment);
  line-height:1;
}
.rune{
  font-size:1.4rem;
  color:var(--gold);
  opacity:.85;
}
.tagline{
  font-family:'Jost',sans-serif;
  font-size:.92rem;
  color:var(--parchment-dim);
  margin:10px 0 0;
  max-width:60ch;
  line-height:1.5;
}
.hr{
  height:1px;
  margin-top:22px;
  background:linear-gradient(90deg, var(--hairline), transparent 75%);
}

/* ---------- Search ---------- */
.searchbar{
  position:relative;
  margin-top:26px;
}
.searchbar input{
  width:100%;
  background:var(--ink-2);
  border:1px solid var(--hairline);
  border-radius:3px;
  color:var(--parchment);
  font-family:'Spectral',serif;
  font-size:1.05rem;
  padding:14px 44px 14px 18px;
  outline:none;
  transition:border-color .15s ease;
}
.searchbar input::placeholder{color:var(--parchment-faint);font-style:italic;}
.searchbar input:focus{border-color:var(--gold-soft);}
.searchbar .ic{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--parchment-faint);pointer-events:none;
}

/* ---------- Filters ---------- */
.filters{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.filter-row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}
.filter-label{
  font-family:'Jost',sans-serif;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--parchment-faint);
  width:78px;
  flex-shrink:0;
}
.chip{
  font-family:'Jost',sans-serif;
  font-size:.8rem;
  padding:6px 13px;
  border-radius:20px;
  border:1px solid var(--hairline);
  background:transparent;
  color:var(--parchment-dim);
  cursor:pointer;
  transition:all .13s ease;
  user-select:none;
}
.chip:hover{border-color:var(--gold-soft);color:var(--parchment);}
.chip.active{
  color:var(--ink);
  border-color:transparent;
  font-weight:600;
}
.chip[data-fuente="Objetos"].active{background:var(--c-objetos);}
.chip[data-fuente="Rituales"].active{background:var(--c-rituales);}
.chip[data-fuente="Pociones"].active{background:var(--c-pociones);}
.chip[data-fuente="Hechizos"].active{background:var(--c-hechizos);}
.chip[data-cat].active{background:var(--gold);}
.chip[data-nivel].active{background:var(--parchment-dim);}
.clear-link{
  font-family:'Jost',sans-serif;
  font-size:.78rem;
  color:var(--parchment-faint);
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
  background:none;border:none;
  padding:0;margin-left:2px;
}
.clear-link:hover{color:var(--gold);}

/* ---------- Meta / count ---------- */
.meta-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:28px;margin-bottom:14px;
  font-family:'Jost',sans-serif;
}
.count{
  font-size:.78rem;
  color:var(--parchment-faint);
  letter-spacing:.03em;
}
.count strong{color:var(--gold);font-weight:600;}

/* ---------- Results ---------- */
#results{display:flex;flex-direction:column;gap:0;}

.card{
  border-bottom:1px solid var(--hairline);
  padding:18px 0;
  cursor:pointer;
}
.card:first-child{padding-top:4px;}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
.card-title-group{flex:1;min-width:0;}
.card-name{
  font-family:'Fraunces',serif;
  font-weight:560;
  font-size:1.28rem;
  color:var(--parchment);
  margin:0 0 6px;
  line-height:1.25;
}
.card-name mark, .card-snippet mark{
  background:none;
  color:var(--gold);
  font-weight:600;
}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.tag{
  font-family:'Jost',sans-serif;
  font-size:.68rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:2px 9px;
  border-radius:20px;
  white-space:nowrap;
}
.tag.fuente{font-weight:600;}
.tag.fuente[data-f="Objetos"]{background:var(--c-objetos-bg);color:var(--c-objetos);}
.tag.fuente[data-f="Rituales"]{background:var(--c-rituales-bg);color:var(--c-rituales);}
.tag.fuente[data-f="Pociones"]{background:var(--c-pociones-bg);color:var(--c-pociones);}
.tag.fuente[data-f="Hechizos"]{background:var(--c-hechizos-bg);color:var(--c-hechizos);}
.tag.nivel{border:1px solid var(--hairline);color:var(--parchment-faint);}
.tag.cat{border:1px solid var(--hairline);color:var(--parchment-dim);}

.expand-ic{
  color:var(--parchment-faint);
  font-size:1rem;
  flex-shrink:0;
  transition:transform .18s ease;
  margin-top:3px;
}
.card.open .expand-ic{transform:rotate(45deg);color:var(--gold);}

.card-snippet{
  font-size:.92rem;
  color:var(--parchment-dim);
  line-height:1.6;
  margin:9px 0 0;
  max-width:74ch;
}
.card-full{
  display:none;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--hairline);
}
.card.open .card-full{display:block;}
.card-full .req{
  font-family:'Jost',sans-serif;
  font-size:.75rem;
  color:var(--gold);
  margin:0 0 10px;
  font-style:italic;
}
.card-full p{
  font-size:.98rem;
  line-height:1.75;
  color:var(--parchment);
  margin:0;
  max-width:74ch;
}

.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--parchment-faint);
  font-family:'Jost',sans-serif;
}
.empty-state .glyph{font-size:2rem;display:block;margin-bottom:12px;color:var(--gold-soft);}

footer{
  margin-top:50px;
  padding-top:18px;
  border-top:1px solid var(--hairline);
  font-family:'Jost',sans-serif;
  font-size:.72rem;
  color:var(--parchment-faint);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}

@media (max-width:560px){
  .filter-row{gap:7px;}
  .filter-label{width:100%;margin-bottom:-2px;}
  .card-head{flex-direction:row;}
  .card-name{font-size:1.14rem;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="crest">
      <span class="rune">✦</span>
      <h1>Compendio Arcano</h1>
    </div>
    <p class="tagline">Índice de objetos, rituales, pociones y hechizos. Busca por nombre, efecto o palabra clave.</p>
    <div class="hr"></div>
  </header>

  <div class="searchbar">
    <input id="search" type="text" placeholder="Buscar un arcano por lo que hace, su nombre…" autocomplete="off">
    <span class="ic">⌕</span>
  </div>

  <div class="filters">
    <div class="filter-row" id="row-fuente">
      <span class="filter-label">Tipo</span>
      <!-- fuente chips injected -->
    </div>
    <div class="filter-row" id="row-nivel">
      <span class="filter-label">Nivel</span>
      <!-- nivel chips injected -->
    </div>
    <div class="filter-row" id="row-cat">
      <span class="filter-label">Efecto</span>
      <!-- categoria chips injected -->
    </div>
  </div>

  <div class="meta-row">
    <span class="count" id="count"></span>
    <button class="clear-link" id="clearAll">limpiar filtros</button>
  </div>

  <div id="results"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <span class="glyph">✦</span>
    No se ha encontrado ningún arcano que coincida.
  </div>

  <footer>
    <span id="totalCount"></span>
    <span>Objetos · Rituales · Pociones · Hechizos</span>
  </footer>

</div>

categorias": [], "requisito": "", "texto": "Unas botas de buena calidad diseñadas para hacer largos y kilómetros viajes y permanecer tan nuevas como si solo hubieran sido usadas durante unos minutos. Y eso es porque realmente tarda minutos en hacer esos viajes. Con estas botas se puede caminar a una velocidad aproximada de 300 kilómetros por hora. El viajante sentirá que está haciendo senderismo, pero se moverá a una velocidad muy superior. Sin embargo hay varias condiciones para usar las botas. La primera es que el destino no puede estar a menos de 50 kilómetros a la redonda del punto de origen. La segunda es que el usuario debe conocer un camino para llegar hasta dicho punto, aunque con ver un mapa o que alguien le de unas indicaciones más o menos correctas sería suficiente."}, {"id": "Objetos-4", "fuente": "Objetos", "nivel": "Básico", "nombre": "Botella del genio", "categorias": [], "requisito": "", "texto": "A pesar de lo que pueda parecer por su nombre, esta botella no tiene un genio en su interior. En lugar de eso, la botella contiene un fragmento de cada uno de los cuatro elementos naturales (tierra, agua, aire y fuego) guardado dentro de una boquilla con una insignia para señalar cuál de ellas es la que se va a abrir. Una vez se ha gastado su contenido (el aire es respirable, el agua es potable), tarda 10 turnos en rellenarse mágicamente, o en su defecto 24 horas."}, {"id": "Objetos-5", "fuente": "Objetos", "nivel": "Básico", "nombre": "Brújula de Godric", "categorias": [], "requisito": "", "texto": "Esta brújula de origen francés, y cuyo inventor tenía un fino sentido del humor, es el perfecto instrumento para aquella persona que quiera conservar su vida intacta el mayor tiempo posible. En lugar de señalar el norte, este ingenioso aparato señala el camino hacia el que se está con menos posibilidades de recibir daño (físico o mental, pero no emocional o de cualquier otro tipo). En caso de que para llegar a ese lugar haya que atravesar algún tipo de peligro, la brújula buscará un rodeo. Ah, sí. Ese francés odiaba a los Gryffindor por algún motivo que no ha trascendido. Para ser capaz de conciliar las orientaciones de la Brújula de Godric con orientaciones normales debe superarse una tirada de Supervivencia a dificultad 9. En caso contrario, es posible (aunque sólo si la situación lo amerita) que el personaje acabe perdido y sin saber dónde se encuentra."}, {"id": "Objetos-6", "fuente": "Objetos", "nivel": "Básico", "nombre": "Camilla Plegable Levitante de Primeros Auxilios", "categorias": [], "requisito": "", "texto": "Cómo indica su nombre, se trata de una camilla plegable en la que cabe con facilidad un humano medio tumbado (dos, si se aprietan mucho y tres si van sentados), la cual el portador podrá guiar para llevar a aquellos heridos o inconscientes que no puedan seguir por su propio pie. Quienes sean transportadas por ella, verán sus dolores ligeramente menguados e incluso daños menores (como rasguños o pequeñas hemorragias) ir curándose poco a poco aunque no estabilizara o curará ninguna Herida ni detendrá efectos mágicos dañinos como los de la cadena de Diffindo."}, {"id": "Objetos-7", "fuente": "Objetos", "nivel": "Básico", "nombre": "Campana de llamada", "categorias": [], "requisito": "", "texto": "Esta nueva campana plateada es el no-va-más entre la alta sociedad. El pequeño artefacto se lleva siempre en un estuche seguro. La campana está conectada a varias réplicas, ligeramente más pequeñas. Cuando la campana maestra se haga sonar, una o varias (que pueden ser todas, cuáles exactamente debe ser algo que determine el maestro al hacer sonar la campana) las campanas esclavas o subordinadas sonarán también. Para vincular una campana maestra con cualquier campana esclava, se debe tener una vinculación entre maestro y campanas esclavas (a efectos mecánicos, sólo pueden tener campanas esclavas los Aliados, Reanimados, Compañeros Animales o Vinculos). Adicionalmente, el quien poseea una campana subordinada o esclava conocerá instintivamente la localización de su maestro, para facilitar llegar hasta ellos, aunque es un conocimiento instintivo y no podrían transmitirlo a otras personas. Solo es necesario canjear un objeto por PJ, indistintamente del número de campanas subordinadas que se necesiten."}, {"id": "Objetos-8", "fuente": "Objetos", "nivel": "Básico", "nombre": "Chivatoscopio", "categorias": [], "requisito": "", "texto": "Objeto con forma de peonza de cristal tremendamente útil para detectar engaños y falsedades. Siempre que a cinco metros a la redonda del chivatoscopio (indistintamente de si es en la misma sala u otra) haya algún tipo de ocultación (mágica, verbal, mental o de cualquier tipo) el chivatoscopio adquirirá un color rojizo y comenzará a girar sobre sí mismo, emitiendo un poderoso chillido. Para burlar a un chivatoscopio, la ocultación o mentira debe superar un resultado de 18 o más en una tirada de Subterfugio. Sin embargo, este objeto no señalará cuál es la falsedad de la que está alarmando ni la intensidad de la misma. Un chivatoscopio reaccionará igual ante alguien mintiendo sobre un retraso al acudir a una cita que ante un asesino con poción multijugos."}, {"id": "Objetos-9", "fuente": "Objetos", "nivel": "Básico", "nombre": "Colmillo de Peligro", "categorias": [], "requisito": "", "texto": "Este colmillo completamente blanco perteneció a las fauces de alguna terrible criatura mágica (la que quieras, está presente en varios modelos). Cuando el portador del colmillo se encuentra en una zona peligrosa para él, el Colmillo comenzará a adoptar un color verde moteado. Cuanto más peligro haya en la zona, más oscura será la tonalidad del verde. Para recuperar su color blanco habitual, el colmillo debe pasar una hora en un lugar seguro (a discreción de los jugadores y el master)."}, {"id": "Objetos-10", "fuente": "Objetos", "nivel": "Básico", "nombre": "Conjunto de Flavio el Engreído", "categorias": [], "requisito": "", "texto": "La última moda en ropa mágica. Un conjunto completo de ropa interior, zapatos, túnica y sombrero capaces de adoptar la forma de prácticamente cualquier otro estilo de ropa cuando su dueño realiza el pase adecuado de varita. Se dice que Flavio dedicó toda su vida al desarrollo de la magia capaz de crear estas piezas de ropa después de sufrir una grave depresión al llevar por accidente el mismo modelito exacto que otro de los invitados a una gran fiesta de sociedad. Esta ropa puede cambiar a voluntad del portador con un simple pase de varita, permitiendo adaptarse a las necesidades estilísticas de cada situación. Si se supera una tirada de Estilo a dificultad 7, se obtendrá un +1 a las tiradas de Estilo y Seducción durante el resto de la escena."}, {"id": "Objetos-11", "fuente": "Objetos", "nivel": "Básico", "nombre": "Cruz de plata", "categorias": [], "requisito": "", "texto": "Este colgante en forma de cruz cristiana tiene poco que ver con la religión. En realidad, está mojada con una variedad de la poción matalobos diseñada exclusivamente para funcionar con este colgante. Desde el momento en que la lleve, el portador será menos atractivo para los hombres lobo, que buscarán otras presas antes de atacarle. Sin embargo, si encontrar otras presas fuera excesivamente complicado (o si el portador del colgante fuera la única opción), los hombres lobo le atacarían igualmente, como si no llevara nada."}, {"id": "Objetos-12", "fuente": "Objetos", "nivel": "Básico", "nombre": "Espectrogafas", "categorias": [], "requisito": "", "texto": "No, no sirven para detectar torposoplos, tal y como decían en El Quisquilloso. Pero sí que son de un color rosa chillón con lentes azules y una llamativa forma. Además son bastante útiles. Las espectrogafas ayudan al mago a detectar con más facilidad los rastros. Una vez puestas las gafas, el jugador podrá usar una tirada de Consciencia con un bonificador de +2 para sustituir su tirada de Investigación a la hora de seguir cualquier rastro, gracias a que verá la zona ligeramente iluminada y con unos destellos dorados."}, {"id": "Objetos-13", "fuente": "Objetos", "nivel": "Básico", "nombre": "Medallón de Lucidez Extrema", "categorias": [], "requisito": "", "texto": "Es un medallón de bronce que muestra el diagrama clásico de las proporciones humanas por Leonardo da Vinci en un lado, y un círculo, un triángulo y un cuadrado superpuestos en el otro. Se cree que está infundido con la visión del propio Leonardo en cierta magnitud: meditando con él o portándolo, el usuario tendrá llamaradas de inspiración de todo tipo. Al llevarse, este medallón otorga un bonificador de +2 a todas las tiradas que tengan que ver con un tema que haya visto previamente dentro de una misma aventura: ya sea a una tirada de Inteligencia para recordar una lección de una clase pasada, o a las tiradas de combate para enfrentarte por segunda vez a una criatura cuyas debilidades ya hayas descubierto en esa misma misión. Este bonificador sólo se aplica cuando se ha encontrado con el mismo problema anteriormente onrol, y ayuda a tener una nueva perspectiva sobre cómo enfrentarlo. Para obtener este bonificador se debe superar una tirada de la Habilidad de Inteligencia que mejor se corresponda a una dificultad decidida por el master (normalmente 9, pero algunos casos puede subir a 15 o 18)."}, {"id": "Objetos-14", "fuente": "Objetos", "nivel": "Básico", "nombre": "Monóculo Áurico", "categorias": [], "requisito": "", "texto": "Este monóculo dorado de mano muestra el aura de las personas que aparecen reflejadas en él. Este aura indicará el humor, secretismo y las emociones principales de la persona reflejada en él. Cuando se consigue observar a una persona a través de este monóculo, el usuario debe hacer una tirada de Empatía con un bonificador de +2 enfrentado al valor de 5 + Carisma + Subterfugio del objetivo del hechizo. En caso de superarla, podrá distinguir los detalles del aura de la persona. A más sucio sea el color del aura, más sentimientos negativos o misterios esconde la persona en cuestión (lo que no nos dice que necesariamente sea una mala persona). Además, un aura más intensa puede manifestar unas intenciones agresivas, mientras que una pálida puede mostrar calma, y otros tonos hacer una descripción del estado emocional de la persona. Cada color y su significado quedaría a consideración del máster."}, {"id": "Objetos-15", "fuente": "Objetos", "nivel": "Básico", "nombre": "Morsseum", "categorias": [], "requisito": "Requiere ser Mortifago Novato.", "texto": "Requiere ser Mortifago Novato. Este interesante objeto se asocia a su dueño a través de un potente conjuro. Al hacer un movimiento con la mano, en el rostro del mortífago habrá aparecido la máscara mortífaga de ese mortífago en cuestión, o desaparecido si se vuelve a conjurar con ella puesta. Detectar la verdadera identidad del mortifago mientras tenga esta máscara puesta contará con un penalizador de -4. La máscara solo puede invocarla su propio dueño y una persona no podrá tener más de una máscara."}, {"id": "Objetos-16", "fuente": "Objetos", "nivel": "Básico", "nombre": "Instrumento musical encantado", "categorias": [], "requisito": "", "texto": "Estos instrumentos mágicos tienen una apariencia similar a cualquier instrumento muggle, aunque siempre hay algo que parece ligeramente fuera de lugar. Quizás el mástil de una guitarra es un pelín más largo de la cuenta, o un violín se toca sin un arco y sólo con una púa. Sin embargo, todos estos instrumentos con una amplia gama de encantamientos que permiten regular el volumen o la distorsión sin necesitar recurrir a ningún tipo de aparato auxiliar. Así mismo, el instrumento funciona con magia, por lo que no necesita ninguna fuente de energía para funcionar (en el caso de algunos teclados o instrumentos eléctricos muggles). Por último, estos instrumentos tienen la cualidad de crear efectos visuales como llamaradas, nubes de humo y demás efectos pirotécnicos. En el caso de instrumentos musicales más clásicos, estos efectos pueden variar a la creación de auras cromáticas o la generación de corrientes de viento alrededor del músico. Cuando se toque el instrumento, el músico deberá hacer una tirada de Arte (Instrumento) con un bonificador de +2. Si supera una dificultad de 9, ganará un +1 a su tirada de Estilo al estar tocando. Por cada grado de éxito por encima, tendrá un +1 adicional."}, {"id": "Objetos-17", "fuente": "Objetos", "nivel": "Básico", "nombre": "La Mano de la Gloria", "categorias": [], "requisito": "", "texto": "Este objeto es una mano putrefacta, usada por los ladrones mágicos de la antigüedad como una herramienta indispensable de su repertorio. La Mano de la Gloria se usa para sujetar una vela que alumbrará mágicamente sólo a aquel que la lleve, manteniendo en la penumbra a los que no sujeten una. Este objeto anula cualquier penalizador por oscuridad del usuario del objeto, pero no de los que le rodean. Si la oscuridad la produce un arcano u objeto avanzado, el portador de la Mano de la Gloria deberá superar una tirada de Alerta a dificultad 12 para que la Mano de la Gloria siga funcionando con normalidad."}, {"id": "Objetos-18", "fuente": "Objetos", "nivel": "Básico", "nombre": "Lechuza mecánica", "categorias": [], "requisito": "", "texto": "Este pequeño autómata mágico es una lechuza en miniatura con un aspecto mecánico, lleno de engranajes y otros aspectos. A la lechuza puedes susurrarle un mensaje, y ésta sabrá encontrar a cualquier amigo o conocido a quien el personaje le haya presentado previamente y replicarlo. También hay magos que vinculas sus libros a este objeto, de tal manera que la lechuza pueda localizar el tomo que mejor responda a la petición del mago. La lechuza se transporta mediante métodos mágicos, por lo que barreras antiaparición no detendrán su vuelo, y llegará casi inmediatamente a su objetivo, además de poder transmitir el mensaje de vuelta. Este objeto sirve para acceder a la Influencia, los Informantes y los Seguidores de un PJ en cualquier lugar, sin necesidad de ir a la localización física donde tiene dichos trasfondos, aunque todavía tendrá que hacer las tiradas correspondientes."}, {"id": "Objetos-19", "fuente": "Objetos", "nivel": "Básico", "nombre": "Libro Infinito", "categorias": [], "requisito": "", "texto": "Este pequeño tomo encapsula muchos libros en uno. Cuando el personaje decida utilizarlo, podrá pensar en cualquier libro que tenga encantado con un sencillo encantamiento, y serán las páginas de éste las que aparezcan en el Libro Infinito. Sirve para acceder a todos los tomos de la Biblioteca de un PJ en cualquier lugar, sin necesidad de ir a su localización física, aunque todavía tendrá que hacer las tiradas correspondientes."}, {"id": "Objetos-20", "fuente": "Objetos", "nivel": "Básico", "nombre": "PARA", "categorias": [], "requisito": "requiere de 5 turnos o en su defecto 30 minutos para recargar su energía.", "texto": "La Peonza Antiapariciones de Rápida Actuación del Ministerio de Magia, también conocida como PARA, es una reciente invención que se popularizó para el Departamento de Aurores, aunque rápidamente se extendió al mercado negro y a los bajos fondos. Este curioso dispositivo, con la forma de una peonza, contiene un potente encantamiento antiapariciones que se despliega en un radio de un kilómetro a la redonda. Para activarse, la peonza debe hacerse girar, y el encantamiento sólo funcionará mientras continúe girando. La PARA está encantada para continuar girando durante varios minutos (o, por defecto, lo que dure una escena) de manera natural, pero no lo hará si es interrumpida (por ejemplo, con un hechizo dirigido contra ella), por lo que la colocación de la PARA es casi tan importante como utilizarla. Tras cada uso la PARA requiere de 5 turnos o en su defecto 30 minutos para recargar su energía."}, {"id": "Objetos-21", "fuente": "Objetos", "nivel": "Básico", "nombre": "Pensadero", "categorias": [], "requisito": "", "texto": "El Pensadero es un pesado espejo con un cuenco de agua que permite al usuario introducirse en los recuerdos que hay almacenados en su interior y vivirlos desde una perspectiva cercana al usuario original del Pensadero. Estos recuerdos no son interactivos, y sólo servirán para revivir el evento desde una tercera persona, sin sentir nada ni poder cambiar nada. La acción de volcar recuerdos en un Pensadero se hace automáticamente, y suele ser un conocimiento extendido entre magos adultos."}, {"id": "Objetos-22", "fuente": "Objetos", "nivel": "Básico", "nombre": "Polvo peruano de oscuridad instantánea", "categorias": [], "requisito": "requiere de vientos fuertes, y no basta con un hechizo de disipación).", "texto": "Producto importado de Perú que causa una profunda oscuridad. Esta oscuridad no puede ser penetrada por ninguna forma de luz, muggle o mágica, y es muy densa y difícil de disipar (se requiere de vientos fuertes, y no basta con un hechizo de disipación). La oscuridad dura una escena completa hasta que consigue deshacerse completamente. Mientras la gente esté en la oscuridad, recibirán un penalizador de -4 a todas las tiradas relacionadas con la vista (como Alerta o Investigación) aunque en combate sólo se perderá un -2 a las tiradas de Ataque y Defensa. En cualquier caso, estos polvos no distingue entre su lanzador o cualquier otra persona y afecta a todos por igual. Esta oscuridad se considera oscuridad total."}, {"id": "Objetos-23", "fuente": "Objetos", "nivel": "Básico", "nombre": "Puertas de Larga Distancia", "categorias": [], "requisito": "", "texto": "A pesar de su nombre, en realidad lo que se está comprando son dos pomos de puerta rudimentarios y de aspecto bastante ordinario, incluso cubiertos de herrumbre. Estos dos pomos podrán colocarse en cualquier puerta que se quiera, y sus efectos son los de que, cada vez que se abre una puerta con uno de los pomos, en realidad se está apareciendo al lado de la puerta del segundo pomo, y viceversa. Una curiosa forma de ir desde casa al trabajo."}, {"id": "Objetos-24", "fuente": "Objetos", "nivel": "Básico", "nombre": "Recordadora", "categorias": [], "requisito": "", "texto": "Objeto con forma de bola de cristal llena de humo blanco que tiene el tamaño de una pelota de tenis. Cuando el que sujeta la recordadora ha olvidado algo, este humo se vuelve rojizo y no cambiará a su color normal hasta que lo recuerde. No obstante, la recordadora nunca podrá ayudarte a saber qué has olvidado. En las aventuras, un jugador atrapado puede mirar a su recordadora y hacer una tirada de la habilidad de Inteligencia más apropiada, a una dificultad decidida por el master. Si supera la tirada, recibirá información que haya podido olvidar o se le haya pasado por alto para avanzar en la trama. Ideal para tus primeras misiones."}, {"id": "Objetos-25", "fuente": "Objetos", "nivel": "Básico", "nombre": "Reloj Lunar", "categorias": [], "requisito": "", "texto": "Permite al usuario del reloj saber la fase exacta lunar en la que se encuentra. Además, tanto los días de noche de luna llena, como tres días antes y tres días después, el usuario de este reloj podrá identificar automáticamente a un hombre lobo, aunque no esté convertido. Y eh, es un reloj muy cuco: da la hora."}, {"id": "Objetos-26", "fuente": "Objetos", "nivel": "Básico", "nombre": "Saquito de habichuelas mágicas", "categorias": [], "requisito": "", "texto": "Estas cuatro habichuelas pueden ser plantadas en cualquier superficie y casi al instante harán crecer una mata dura y resistente que se extenderá hasta el cielo y alcanzará una altura de 25 metros, aunque si se plantan varias de ellas a la vez la altura crecerá de manera proporcional. Ideal para trepar si se quiere llegar a un lugar alto, para lo que deberá superarse una tirada de Atletismo a dificultad 7. Son necesarios dos arcanos de nivel intermedio o uno de nivel avanzado para acabar con ella."}, {"id": "Objetos-27", "fuente": "Objetos", "nivel": "Básico", "nombre": "S.C.R.O.L.L.", "categorias": [], "requisito": "requiere de flujo mágico personal, por lo que la distancia de alcance de sus mensajes depende de cada persona, detalle que hace que muchos aún prefieran el uso más confiable de lechuzas si no es para el uso en colegios, oficinas o similares, motivo por el cual los más jóvenes han creado incluso comunidades sociales dentro de su sistema.", "texto": "El dispositivo de Socialización Centralizada Rápida de Operación Lechucera Licenciada, conocido comúnmente como Scroll, es la última creación de Humphrey Lacroix, inventor egipcio conocido por adaptar tecnología muggle para la comunidad mágica con diversos grados de éxito. Visualmente idéntico a un pergamino blanco cuando está plegado, se despliega lateralmente en lugar de verticalmente para mostrar las más recientes actualizaciones de mensajería o socialización. Permite la mensajería instantánea con personas a las que se les ha compartido el código SCROLL personal, así como el uso de imágenes en movimiento. El envío de mensajería vía SCROLL requiere de flujo mágico personal, por lo que la distancia de alcance de sus mensajes depende de cada persona, detalle que hace que muchos aún prefieran el uso más confiable de lechuzas si no es para el uso en colegios, oficinas o similares, motivo por el cual los más jóvenes han creado incluso comunidades sociales dentro de su sistema. Se podrá enviar cualquier tipo de texto, imagen o sonido de un scroll a otro siempre que se supere una tirada de rituales: 7; para el mismo edificio, 9; para cubrir cientos de metros, 12; varios kilómetros, 15; a través de una ciudad entera, 18; con 21, a través del país, y con 25, a través del continente. Si la tirada es exitosa, su destinatario recibirá el mensaje automáticamente."}, {"id": "Objetos-28", "fuente": "Objetos", "nivel": "Básico", "nombre": "Tienda Adaptable, Rápidamente Desplegable, Ingeniosamente Segura", "categorias": [], "requisito": "", "texto": "Tienda de campaña azul (aunque la hay en otros colores) que es más grande por dentro. Aunque su apariencia externa es simple, por dentro incluye una pequeña casa decorada al gusto del dueño. Las más grandes tienen hasta dos plantas. La seguridad de la tienda es algo básica y protege de cualquier tipo de inclemencia meteorológica como si se tratase de una casa normal (y no una tienda de campaña). También tiene un repelente de muggles que impide que estos quieran entrar dentro. Ah, y, obviamente, montarla cuesta tanto esfuerzo como montar una tienda de campaña normal; por eso, los magos suelen usar un hechizo cuyas instrucciones vienen junto a la tienda en el momento de comprarla. El interior de la tienda se considerará un entorno cómodo para cualquier tarea que se necesite (como tratar heridas, hacer pociones, etc)"}, {"id": "Objetos-29", "fuente": "Objetos", "nivel": "Básico", "nombre": "Tinta de Veracidad", "categorias": [], "requisito": "", "texto": "Esta tinta normalmente se guarda en frascos especialmente sellados, cubiertos con detallados símbolos relacionados con la verdad, la justicia y la honestidad. Cualquier contrato escrito y firmado con esta tinta arderá al instante si una de las partes incumple sus obligaciones. Si se invocan maldiciones especiales o amenazas en el texto, se harán realidad. La tinta también reaccionará del mismo modo cuando sea usada para escribir testimonios o descripciones, obligando a escribir nada más que la verdad. La única manera de anular este contrato es destruyendo el texto, aunque por eso suele guardarse en cámaras protegidas y con gran vigilancia, como en Gringotts."}, {"id": "Objetos-30", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Amuleto del guardián", "categorias": [], "requisito": "", "texto": "Cuando el portador de este amuleto con forma de escudo recibe al menos una herida por algún tipo de ataque, puede de manera gratuita activar el poder de este objeto. En ese momento, el colgante crece hasta tomar la forma de un escudo pavés que flota alrededor de su poseedor. El escudo es considerado un reanimado (aunque el daño ígneo no se duplica en este caso) con la siguientes características: Iniciativa 6, Defensa 8, PAs: Irrelevante, Heridas 5, Umbral de Heridas 6 y Atletismo: +4. No tiene ninguna capacidad de atacar pero dispone del talento Proteger que sólo puede ser usado hacia el portador del objeto. El objeto permanecerá activo durante una cantidad de turnos equivalente al número de heridas recibidas hasta el momento (independientemente de cuando ocurrieran) o hasta ser destruido. El escudo se recupera totalmente tras pasar una hora desde su última activación, salvo que el golem hubiera sido destruido en cuyo caso no podrá volverse a usar en toda la aventura."}, {"id": "Objetos-31", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Ancla del expedicionista", "categorias": [], "requisito": "", "texto": "Estas dos varillas de metal que se adquieren a la vez se han diseñado a raíz de los muchos descubrimientos de yacimientos, zonas donde la magia se comporta de manera extraña, o incluso para que las fuerzas de seguridad retiren a un compañero herido. Una de las varillas de metal puede clavarse en cualquier superficie y, en su interior, contiene un cristal mágico reactivo que es el gemelo de otro que tiene la otra varilla. En cualquier momento, el personaje puede desear agarrarse a la varilla que lleva entre las manos y aparecerse. Cuando se haga eso, el personaje debe hacer una tirada de Supervivencia: la dificultad aumentará en función de las dificultades, la distancia, protecciones mágicas y otras consideraciones del master, desde un 7 para algo normal (una casa con un ritual simple antiaparición para una vivienda) hasta un 15 para poder salir de una cámara de Gringotts después de haberla robado. Hay que tener cuidado si se utiliza en misiones donde la Aparición esté restringida o limitada: la huída del personaje de la zona puede suponer que abandone la partida y no pueda regresar a ella (aunque es recomendable que el master le avise si éste va a ser el caso)."}, {"id": "Objetos-32", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Anillo de los Carstein", "categorias": [], "requisito": "", "texto": "Una fina reliquia de plata pura que parece completamente inocua. El Anillo de los Carstein fue forjado con el uso de intensos poderes nigrománticos, y tiene una curiosa conexión con la muerte. Este anillo se nutre de la fuerza vital del conjurador, y reducirá los PAs que gane por su puntuación de Vigor a 0. Esa puntuación quedará almacenada en el anillo y le dará una apariencia esplendorosa y reluciente. Sin embargo, si, llevándolo puesto, el objetivo muere por heridas, el anillo se apagará por completo y quedará convertido en poco más que estaño, curando una Herida automáticamente. Una vez usado, el anillo se convierte en una bagatela sin valor durante 24 horas, antes de recuperar sus propiedades."}, {"id": "Objetos-33", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Anillo de Moebius", "categorias": [], "requisito": "", "texto": "Este simple anillo consiste en una única pieza de oro torcida medio giro antes de unirse. Si el usuario termina de enrollarla en su dedo, inmediatamente desaparecerá de la vista... pero él también dejará de ver a todos los seres vivos que haya a su alrededor, encontrándose en el mismo lugar en el que estaba antes, pero únicamente con su propia imagen reflejada. Podrá moverse con total libertad por el lugar, sin chocar con nadie cercano, e investigar cómodamente objetos y la estancia sin ser detectado. Si esto es parte del Otro Lado o algún efecto secundario visual es algo que todavía no está claro, aunque lo más probable es que simplemente sea un efecto de invisibilidad, porque todos los objetos que se manipulen estando en el otro giro del anillo se manipulan también en el mundo real. Otro giro del anillo permitirá al usuario regresar a la realidad. Desgraciadamente, este anillo tiene un inconveniente: cuando se usa demasiado a menudo, el portador empieza a deslizarse cada vez más entre las dos visiones, incluso cuando no quiere, y puede llegar a terminar completamente encarcelado dentro de la segunda visión cuando el anillo de repente decida cambiar sin él y no volver a separarse. Cada vez que se activa, se obtiene un 10% (hasta un máximo de 80%) de posibilidades de que el anillo se active sin que su portador quiera."}, {"id": "Objetos-34", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Armadura de Warlock", "categorias": [], "requisito": "", "texto": "Esta curiosa corza puede adoptar la apariencia de casi cualquier prenda, característica pensada para poder pasar desapercibida en el mundo muggle. Sin embargo, sea cual sea su aspecto, sus características no cambian. Diseñada por antiguos brujos acostumbrados a enfrentarse tanto a otros magos como a criaturas mágicas, esta armadura es bastante resistente al daño, aunque no tanto al resto de efectos mágicos. También es bastante pesada, incluso aunque tenga la apariencia de un fino kimono de seda. Mientras se lleve puesta, se obtendrá un -2 a toda tirada de Iniciativa y Defensa debido a su peso. Pero, gracias a su resistencia, reducirá hasta 4 puntos de daño (7 si el ataque no procede de un arcano o arma mágica, rúnica o encantada) cuando se haya terminado de calcular el efecto."}, {"id": "Objetos-35", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Bisutería Arcana", "categorias": [], "requisito": "", "texto": "Collar, pulsera o anillo el cual concentra la energía de un mago o bruja. Se dice que dicho objeto pudo ser una idea duendigonza la cual copiaron los magos para poder potenciar su poder en casos de agotamiento. El objeto multiplica por dos la habilidad de rituales que tenga el ritualista de cara a la suma de puntos de rituales (alguien con Poder 4 y Rituales +4 tendrá 12 Puntos de Rituales, 4 + 4*2), siendo sumados antes de cualquier otro bonificador."}, {"id": "Objetos-36", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Bola de cristal", "categorias": [], "requisito": "", "texto": "La bola de cristal es una de las más icónicas formas de adivinación que existen, y por un buen motivo. Todo aquel que tenga una bola de cristal puede intentar ver el futuro. Para ello, debe superar una tirada de Adivinación a dificultad 15 y podrá recibir una versión críptica de una profecía. Si lo usa un Oráculo, podrá compaginarlo con su pregunta de Oráculo para recibir una visión completa y explicaciones alrededor de la pregunta. Cada pregunta sucesiva a la bola de cristal aumentará la dificultad de la tirada de Adivinación en un grado de éxito."}, {"id": "Objetos-37", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Bufanda de Babel", "categorias": [], "requisito": "", "texto": "Una elegante bufanda de acabados en gris que rodea el cuello del portador. Siempre que se lleve puesta, éste poseerá el curioso efecto del don de lenguas: podrá hablar cualquier idioma a nivel avanzado que se proponga y hacerse entender entre cualquier interlocutor que tenga. Sin embargo, los problemas de la Torre de Babel no se libran de los males que asolaron la construcción, y siempre que se comunique en un idioma que no es el suyo, el portador se encontrará sumamente irritado, como proclive a la rabia, pero tendrá que morderse la lengua y tratar a sus interlocutores con sumo respeto para lo que necesitará superar una tirada de Frialdad a dificultad 12. A la primera mala respuesta que dé, el portador del objeto perderá la capacidad de seguir usando la bufanda de Babel durante la aventura. La bufanda también sirve para escribir e interpretar textos, pero toda acción que realice deberá ser completamente respetuosa y protocolaria, superando una tirada de Estilo a dificultad 12 o perdiendo esa capacidad."}, {"id": "Objetos-38", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Capa del líder de la manada", "categorias": [], "requisito": "", "texto": "la prenda de todo líder que acostumbra a monologar cuando llega la batalla contra el villano para inspirar a sus aliados. Confeccionada con el pelaje de un licántropo transformado, brinda confianza a aquel que la porta, y más aún a aquel que escucha las palabras de su líder. Dos veces por aventura se puede hacer una tirada de Coordinación con un +2 a Dificultad 15, si se supera, todos los que hagan caso al portador obtendrán un +2 a sus tiradas durante un turno."}, {"id": "Objetos-39", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Dado del destino", "categorias": [], "requisito": "", "texto": "Este poliedro es un dado tallado con el hueso de alguna criatura mágica extraña, tan desmejorada que nadie sabe realmente de qué ser es. El dado tiene diez caras. El portador del dado puede lanzarlo para intentar forzar una dosis de suerte para sí mismo. Al resultado del dado se le deben restar 3 puntos: ese resultado será el valor del bonificador o penalizador a todas las tiradas que tendrá durante la siguiente escena."}, {"id": "Objetos-40", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "El Mapa Rojo", "categorias": [], "requisito": "", "texto": "Este mapa es legendario entre ciertos grupos de magos exploradores. Físicamente, es sólo un mapa de pergamino, teñido de rojo profundo y cubierto con símbolos y diagramas poco familiares. Sin embargo, cuando su dueño vierte su propia sangre sobre él, el mapa comienza a cobrar sentido, y le mostrarán el camino a cualquier destino en la Tierra. Desgraciadamente, el mapa se vuelve ilegible si se deja de verter sangre, pero lo que el mago se ve obligado a estar continuamente vertiendo sangre sobre él para mantenerlo legible y llegar hasta el destino. A efectos de juego, el mapa sólo será legible si el mago está sufriendo algún tipo de hemorragia y la dirige sobre el mapa. La información de la localización sólo permanecerá en la meten del usuario siempre y cuando continúe sangrando. Cuesta 1 PA por turno (y cada turno sufrirá 1 PA adicional más; el segundo turno sufrirá 2 PAs, el tercero sufrirá 3... y así). y ofrece esas localizaciones. Curiosamente los mapas mostrados son imposibles de duplicar de manera alguna o incluso de ser recordados más allá de unos pocos minutos una vez deje de verterse sangre. Los PAs perdidos de este modo se acumulan, por lo que si una persona tiene un Umbral de Heridas de 6, sufriría una Herida tras 3 turnos utilizando el mapa, a no ser que se detenga lo suficiente como para recuperar sus PAs según las normas de descanso."}, {"id": "Objetos-41", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Instrumento de Hamelín", "categorias": [], "requisito": "", "texto": "El instrumento de Hamelín es un objeto diseñado por magizoólogos a imitación del famoso flautista de la fábula muggle. Se supone que, aquel que toque este instrumento, será capaz de atraer a varias criaturas de un mismo tipo que puedan estar en los alrededores, y, mientras se encuentren embelesados por la melodía, no actuarán violentamente y seguirán al flautista, aunque no obedecerán órdenes e instrucciones. El personaje debe superar una tirada de Arte (Instrumento) a una dificultad variable, en función de la peligrosidad de la criatura (7 por *, 9 por **, 12 por ***, 15 por **** y 18 por *****)."}, {"id": "Objetos-42", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "La lengua de Crucasma", "categorias": [], "requisito": "", "texto": "Tras sobrevivir, por los pelos, a varios intentos de asesinato orquestados por la competencia, Aimé creó (y luego comercializó) la lengua de Crucasma. Esta pequeña lengua de madera se disuelve en un líquido rosáceo (y bastante desagradable de sabor) al introducirlo en la boca, que envuelve toda la lengua del sujeto. Mientras la lengua de Crucasma esté activada, ningún veneno o poción afectará (positiva o negativamente) a su portador. En caso de tomar cualquier tipo de queso, la lengua de Crucasma volverá a convertirse en madera. Esto es porque Aimé consideraba el queso un alimento repugnante, que nadie en su sano juicio usaría para envenenar a alguien con papilas gustativas decentes."}, {"id": "Objetos-43", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "La nariz de Crucasma", "categorias": [], "requisito": "", "texto": "Harta de que todo el mundo creyera que podía engañarla por ser mujer, Aimé creó (y después comercializó) un objeto basado en su capacidad para saber cuando le estaban mintiendo. Esta nariz de cerdo se coloca sobre la nariz de quien quiera usarla, momento en el que adquirirá el tamaño y la forma de la nariz de la persona en cuestión. Solo que un poco más rojiza, como si estuviera resfriada. Mientras la persona tenga la nariz, cada vez que alguien le mienta o le oculte alguna información, un olor desagradable le llenará las fosas nasales. Olvidar mencionar un dato podría hacer que la persona olfatear algo similar a un perro mojado, mientras que una mentira descarada podría oler a carne putrefacta de varios meses. Cuando alguien cuente una mentira (independientemente de si es descubierta o no) el portador del objeto podrá hacer una tirada de Supervivencia a dificultad variable (mentiras descaradas podría ser 9 mientras que obviar detalles podría ser 18), si se supera la tirada el portador reconocerá el olor desagradable de la mentira. En caso de oler alguna flor desde cerca, quien esté usando la Nariz de Crucasma empezará a estornudar fuertemente hasta que el objeto se desprenda de su propia nariz. Esto es así debido a que Aimé era terriblemente alérgica a la mayoría de las flores, y no le gustaba la idea de que sus objetos anduvieran cerca de tamañas asesinas silvestres."}, {"id": "Objetos-44", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Los oídos de Crucasma", "categorias": [], "requisito": "", "texto": "Debido a la soledad inherente a ser una gran mujer en un mundo de hombres (envidiosos), Aimé no tuvo durante gran parte de su vida muchas personas con las que hablar. Por ello creó (y después comercializó) un objeto para poder encontrar otros seres con los que hablar. Estas cálidas orejeras rojas (el color favorito de Aimé) se convierten en humo al ponertelas, y dejan tus propios oídos de un color azul frío. Mientras los oídos de Crucasma están activos, permiten escuchar con facilidad lo que haya tras muros y paredes, así como a grandes distancias, como si no hubiera obstrucción de sonidos. La persona con los oídos de Crucasma podrá escuchar cualquier cosa al otro lado de muros, paredes y en la distancia con una tirada de Alerta a dificultad 12. Sin embargo, tendrá que superar esa misma tirada también para escuchar cualquier conversación o ruido que esté sucediendo en sus inmediaciones; tan concentrada estará en el exterior que no podrá sentir a su alrededor. En caso de que alguien diga algo bonito a quien tenga los oídos de Crucasma, al usuario de dicho objeto le saldrá humo por los oídos hasta que las orejeras se materialicen de nuevo, volviendo el objeto en algo inútil durante tres horas. Esto es así porque Cruscama prefería por mucho una conversación (siempre que fuera agradable) con escuchar pasivamente las conversaciones de otras personas."}, {"id": "Objetos-45", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Los Ojos de Crucasma", "categorias": [], "requisito": "", "texto": "Cansada de que los otros inventores entrasen por la fuerza a su casa para robar sus ideas, Aimé creó (y luego comercializó) un objeto para poder ser ella quien robase ideas a sus enemigos, solo que de forma más sutil. Estas pequeñas esferas gelatinosas, del tamaño de un ojo, se disuelven automáticamente al entrar en contacto con los globos oculares. El proceso es tremendamente desagradable y, da la sensación que se se te ha metido jabón en los ojos. Una vez completado, quien tenga los Ojos de Crucasma será capaz de ver a través de cualquier material sólido como si éste fuera casi totalmente transparente. En caso de echarse agua en el rostro, los ojos de Crucasma volverán a convertirse en dos pelotas gelatinosas. Esto es así porque las costumbres higiénicas del siglo XIX no eran precisamente de envidiar, y Aimé consideraba que era algo harto improbable que alguien tuviera que hacerlo en varias semanas."}, {"id": "Objetos-46", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Los dedos de Crucasma", "categorias": [], "requisito": "", "texto": "Acostumbrada a trabajar con objetos tremendamente delicados, Aimé creó (y después comercializó) unas pequeñas plantillas viscosas que se colocaban en las yemas de los dedos para otorgar a quien los usase una gran agilidad manual. Una vez se colocan se fijan a la mano, proceso que es algo doloroso (similar a que se clave una aguja en la yema de cada uno de los dedos). Tras estar fijados, los dedos de Cruscasma permiten a quien los tiene atravesar cualquier obstáculo sólido que pueda haber con una simple tirada de Latrocinio a dificultad 12: ya sea meter una mano a través de una puerta para abrir la cerradura, en un bolsillo ajeno sin tener que meterse por dentro o en un maletín cerrado. En caso de que quien los tenga sufra algún tipo de excitación sexual, las plantillas viscosas se caen inmediatamente. Esto es así porque Aimé siempre fue de la opinión que había formas mejores de quererse que el trabajar."}, {"id": "Objetos-47", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Llave de las Mil Puertas", "categorias": [], "requisito": "", "texto": "Esta curiosa llave tiene la curiosa habilidad de guardar en su \"memoria física\" las cerraduras de todas las puertas que el mago haya atravesado con ella en la mano, permitiendo abrirlas sin problemas. De este modo, si el portador de la llave atraviesa una puerta y tiempo después vuelve a ella y se encuentra cerrada, bastará con introducir la llave en la cerradura para que se abra, independientemente de todas las protecciones mágicas que pueda tener. Para poder atravesar puertas relevantes para la trama general del foro (por ejemplo, una cerradura del Ministerio de Magia), el personaje deberá adjuntar cuando intente volver a utilizarla el link al post donde lo hizo, o en la descripción de este objeto. Se puede asumir que cualquier puerta doméstica o relacionada con sus lugares habituales puede estar registrada en la llave, y cualquier puerta particular de una misión que no sea común a la trama del foro debe atravesarse durante la misión."}, {"id": "Objetos-48", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Máscara mortuorioa", "categorias": [], "requisito": "", "texto": "Una capa de arcilla reblandecida de un intenso color blanco. La máscara mortuoria se adaptará al tamaño del rostro sobre el que se coloque, poco a poco modificándose hasta adoptar esa forma. El rostro debe ser el de un muerto que haya perecido recientemente. El rostro quedará inmortalizado, pero también lo harán la personalidad y los conocimientos de la persona que quede vinculada a este objeto, siendo prácticamente una réplica sin cuerpo de la persona que era en el momento de la muerte, parecido a un retrato. Convertido en una máscara, ningún hechizo será útil sobre el objetivo salvo los de destrucción, además de que no sentirá dolor alguno, por lo que hay que ser especialmente ingenioso para usar esto con fines de interrogatorio o tortura. Cada máscara sólo podrá encerrar la identidad de una persona. Tras una misión, un jugador puede escoger conservar la identidad que ha asesinado con un link al post en cuestión, o puede liberarla para tener un nuevo uso."}, {"id": "Objetos-49", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Monóculo del tasador", "categorias": [], "requisito": "", "texto": "Pequeña lente de cristal con una cadena dorada. Este monóculo tiene la propiedad de poder analizar cualquier objeto, ya sea mágico o muggle. Cuando se coloca el monóculo en el ojo, la persona en cuestión podrá hacer una tirada de Arcanismo o de Cultura Muggle (según la procedencia del objeto). Si supera un 7, conocerá automáticamente el valor monetario de ese objeto (según los estándares del lugar en el que se encuentre). Con un 9, podrá conocer todas las propiedades y la estructura e integridad del objeto mágico, si es de categoría básica, o muggle. En caso de objetos intermedios la dificultad aumenta a 12, y a 15 en caso de objetos avanzados. Adicionalmente, cuando se lleva puesto, este monóculo permite detectar las propias siluetas de los objetos mágicos, sirviendo como una posible herramienta para penetrar la invisibilidad, permitiendo al portador hacer una tirada de Consciencia enfrentada al valor de ocultación de los objetos mágicos."}, {"id": "Objetos-50", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Papel psíquico", "categorias": [], "requisito": "", "texto": "Este trozo de papel encantado se vende junto a una curiosa funda de cuero con las mismas propiedades. Cuando este documento se muestra, quien lo tiene en la mano puede pensar rápidamente en algún tipo de documento en el que el papel se convertirá, algo para lo que deberá superar una tirada de Latrocinio con un bonificador de +2 a dificultad 9. Es muy utilizado por oficiales de excusas muggles para hacerse pasar por agentes de policía y mostrar una placa, por ejemplo. La persona observando el papel tendrá derecho a hacer una tirada de Consciencia enfrentada al valor de la anterior tirada de Latrocinio del usuario del papel para descubrir que se trata de algo falso, y, si falla la tirada, simplemente será engañado por lo que se muestre."}, {"id": "Objetos-51", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Petardes", "categorias": [], "requisito": "", "texto": "Los Petardes son artefactos pirotécnicos con efecto retardado, con diferentes efectos visuales, que varían entre simples explosiones monocromas a estallidos de color o formación de palabras con la chispa de la explosión. Para activar un Petarde, basta con conjurar sobre él cualquier hechizo, incluso domésticos. El tiempo de explosión varía entre los cinco minutos y las dos horas, en función de lo que desee el mago que los activa. No tienen poder ofensivo ni capacidad de incendiar, por lo que únicamente sirven como elemento de distracción o para llamar la atención o dibujar mensajes en el aire. Todo aquel que no esté en el equipo de quien utiliza los Petardes deberá superar una tirada de Frialdad, a dificultad 12. En caso de fallarla, contará con un penalizador de -7 en sus tiradas de Alerta. Si la supera, este penalizador será sólo de -2. En caso de haber visto al personaje preparar los Petardes, tendrá un +2 a la Frialdad."}, {"id": "Objetos-52", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Polvo fantasmal", "categorias": [], "requisito": "", "texto": "Este saquito contiene polvo fantasmal, hecho de uranio empobrecido, hierro frío, albahaca y algún tipo de estiércol, el polvo fantasmal afecta a los fantasmas incluso en el plano mortal. Les causa un tremendo dolor y los inmoviliza. Si se supera una tirada de arcanismo a dificultad 12 el fantasma (o derivado) sobre el que se arroje el polvo fantasmal quedará inmovilizado durante un turno, más un turno extra por cada grado de éxito conseguido."}, {"id": "Objetos-53", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Polvo Fúnebre", "categorias": [], "requisito": "", "texto": "El polvo negro como el tizón que hay en el interior de este saco es un polvo nigromántico tremendamente poderoso. Si se introduce en la boca de una persona que haya muerto recientemente, podrá tenerse una conversación de diez minutos con el difunto antes de que muera definitivamente, aunque si éste era un mago, por ejemplo, ya no podrá hacer magia o seguir combatiendo. A efectos prácticos, será un cadáver con la única facultad de hablar, aunque todavía puede sufrir dolor o ser afectado por hechizos y pociones de manera convencional. Sin embargo, si la persona llevaba más tiempo muerta, la operación es inútil."}, {"id": "Objetos-54", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Prótesis Mágica", "categorias": [], "requisito": "", "texto": "De diferentes materiales y estilos según el fabricante, este objeto sustituye un miembro perdido. Sin embargo, los encantamientos de esta prótesis otorgan a su portador cierta proficiencia en las habilidades relacionadas con la misma, a determinar en el momento de canjearlo (solo se puede afectar a una habilidad al canjearlo), aunque no podrá tener ningún efecto en combate o en las tiradas necesarias para usar algún arcano u objeto mágico. El usuario de la prótesis mágica debe superar una tirada de la habilidad que eligió al momento de canjearla a dificultad 9 para usarla apropiadamente. En caso de hacerlo, recibirá un bonificador de +4 a la siguiente tirada de esa habilidad."}, {"id": "Objetos-55", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Reloj de Parada", "categorias": [], "requisito": "", "texto": "Este curioso reloj de muñeca tiene una función muy curiosa. Si el portador del reloj detiene el reloj, tirando de una de las manecillas, conseguirá \"detener\" parcialmente el tiempo. Esto es, por supuesto, sólo una ilusión del verdadero poder temporal, no una realidad, pero todos los hechizos que se lancen durante ese turno y los dos siguientes en un área de diez metros de radio quedarán detenidos en una especie de estasis, para liberarse todos de golpe a los tres turnos. Como curioso efecto secundario ocurre que los hechizos pueden cambiar de rumbo para dirigirse hacia el nuevo punto donde se encuentra su objetivo, por lo que las tiradas de impacto de dichos arcanos siguen funcionando con normalidad salvo que las personas a las que iban dirigidos los arcanos hayan abandonado la estancia."}, {"id": "Objetos-56", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Saco de piel de Moke", "categorias": [], "requisito": "requiere de una tirada de latrocinio a dificultad 21.", "texto": "Este curioso saco está elaborado con la piel de un moke, un lagarto que tiene la capacidad de contraer y expandir su piel en distintas situaciones. Eso permite que alberguen muchos más objetos por fuera que por dentro, y que algo del aspecto de un saco tenga la capacidad de un baúl. Tener un saco de piel de Moke permite llevar cualquier objeto encima en el inventario sin tener que tenerlo a la vista. Además, abrir este saco sin el conocimiento y autorización de su dueño requiere de una tirada de latrocinio a dificultad 21. En caso de no superarla, el dueño podrá hacer una tirada refleja de Consciencia enfrentada a la tirada de Latrocinio. Si la supera, se enterará de que éste ha sido forzado al instante y dónde se encuentra, independientemente de la distancia que le separe de su saco."}, {"id": "Objetos-57", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Tatuaje Arcano", "categorias": [], "requisito": "requieren de canalización continua (como barreras mágicas), si se usan desde el tatuaje tienen la misma problemática que desde la varita, y necesitarán que se atiendan constantemente sin poder hacer otra acción.", "texto": "El tatuaje arcano es una compleja forma de almacenamiento mágico que permite a alguien tener un uso de un hechizo tatuado en su propio cuerpo. Puedes liberar ese hechizo a voluntad, sin necesidad de varita. Este hechizo tiene un solo uso, y tiene que ser un hechizo que el tatuado conozca previamente, pues ha tenido que conjurarlo durante el proceso de dotar de poder al tatuaje. El tatuaje, sin embargo, permanece en el usuario, y al principio de cada aventura puede determinar qué hechizo es el que lleva tatuado. Una persona puede tener varios tatuajes arcanos, aunque no puede repetirse el hechizo encerrado ni se puede tener más de un hechizo en el mismo tatuaje. Este hechizo puede utilizarse como una acción gratuita en el turno en que se libera, pero liberar esa cantidad de energía mágica implica que, el turno siguiente a hacerlo, no se pueda conjurar ningún arcano. Aunque se pueden tatuar hechizos que requieren de canalización continua (como barreras mágicas), si se usan desde el tatuaje tienen la misma problemática que desde la varita, y necesitarán que se atiendan constantemente sin poder hacer otra acción."}, {"id": "Objetos-58", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Tercer brazo", "categorias": [], "requisito": "requieran una gran habilidad (como, por ejemplo, para que haga una acción en combate), el usuario deberá superar una tirada de Supervivencia a dificultad 12 (que aumentará un grado de dificultad cada turno).", "texto": "Es una bufanda o cinturón de tela encantados para que se muevan siguiendo la voluntad de un mago, como si fuera un tercer brazo. Este tercer brazo tiene la misma movilidad que un miembro convencional, y se utiliza para hacer una acción adicional que se pueda hacer con una mano normal mientras el usuario concentra su acción normal en otra cosa. Para poder utilizarlo con precisión en situaciones de tensión o que requieran una gran habilidad (como, por ejemplo, para que haga una acción en combate), el usuario deberá superar una tirada de Supervivencia a dificultad 12 (que aumentará un grado de dificultad cada turno). En caso de fallar esta tirada, la acción no se podrá llevar a cabo y el usuario del Tercer Brazo tendrá un penalizador de -7 a todas sus acciones de ese turno. En caso de tener éxito, la tirada usará los mismos valores que el PJ. En caso de utilizarse para acciones simples (coger algo de una mochila, usarlo como apoyo para tareas mundanas a las que el PJ está prestando toda su atención...), no necesitará tirada alguna."}, {"id": "Objetos-59", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Trampa Onírica", "categorias": [], "requisito": "", "texto": "Esta pequeña red debe usarse sobre un objetivo dormido para ser útil. La red atrapará al objetivo en un estado de letargo eterno, hasta que alguien la retire o él mismo se libere superando una tirada de Frialdad 25, pudiendo llegar a ser completamente mortal. Si el dueño de la red se concentra, podrá entrar en los sueños del objetivo atrapado por la red y modificarlos a voluntad, convirtiéndose en una especie de divinidad dentro de los sueños. Al despertarse, el durmiente tendrá la sensación inquietante de que todo lo que ha experimentado es real, y pasará una semana entera confundiendo sus sueños con la realidad."}, {"id": "Objetos-60", "fuente": "Objetos", "nivel": "Intermedio", "nombre": "Vehículo volador", "categorias": [], "requisito": "Requiere Cultura Muggle 2 para poder conducirlo.", "texto": "Requiere Cultura Muggle 2 para poder conducirlo. Este artefacto de la ingeniería muggle ha sido encantado para que tenga la función de una escoba, y también permita al mago desplazarse por tierra sin llamar la atención de las gentes no mágicas. El deposito está hechizado y no es necesario llenarlo (funciona con magia, como las radios o las propias escobas). También puede alzarse en el cielo y volar, a una velocidad de unos ciento cincuenta kilómetros por hora. Tiene sistemas integrados de ocultación que facilitan especialmente su despegue y aterrizaje. Para detectar el vehículo en el cielo, será necesario superar una tirada de Consciencia a dificultad 12 (que se elevará a 15 durante el despegue o aterrizaje). Si el vehículo recibe algún tipo de golpe o choque, también perderá su ocultación."}, {"id": "Objetos-61", "fuente": "Objetos", "nivel": "Avanzado", "nombre": "Altar del ritualista", "categorias": [], "requisito": "", "texto": "Más que un objeto, el Altar del ritualista es una serie de materiales con los que un mago puede crear y establecer una especie de sagrario de manera más o menos rápida en cualquier lugar donde se encuentre. El aspecto, motivo y representación del altar dependen de la moralidad y creencias del ritualista, pero debe guardar una estrecha relación con sus creencias más fuertes (ya sean ramas de la magia, antiguos dioses, facciones u organizaciones, conceptos morales etc.). Gracias a este objeto, y según lo que logre vincularse al mismo, el ritualista podrá forzar su poder un paso más allá de lo que normalmente podría siempre que esté dentro del área de influencia del altar. Para construir el Altar se usará la Artesanía de Albañileria, Alfareria, Carpintería, Forja o Ingeniería y según el nivel de dicha habilidad su dueño obtendrá tantos puntos de Rituales como su valor en dicha habilidad (1 si es Novato, 2 Competente, 3 Experto y 4 Maestro) y obteniendo un 0/1/2/4 en tantas tiradas para realizar rituales como el doble de su puntuación dicha Artesania. Para determinar el área de influencia del altar se realizará una tirada de Baile, Canto, Escritura, Escultura, Fotografía, Instrumento Musical [X] o Pintura y superando un 7 cubrirá una estancia entera, con un 9 una casa, con un 12 podrá cubrir un terreno de cientos de metros, con un 15 podrá alcanzar una extensión de varios kilómetros, con 18 podrá llegar a recorrer una ciudad, un 21 cubrirá un país, y un 25 podrá llegar a afectar a todo un continente. Sólo podrá crearse un altar por aventura, aunque este sea destruido por cualquier motivo. ● Capa de Invisibilidad: Las capas de invisibilidad son, como su propio nombre indica, capas (u otros fragmentos de tela) encantados para volver invisible todo lo que se coloque bajo ellos. Las capas de invisibilidad son productos caducos (la única que se conoce permanente es la de las Reliquias de la Muerte), pero pueden dar servicio durante varios años. El usuario de una capa de invisibilidad debe superar una tirada de Sigilo a dificultad 9 para usarla apropiadamente y no dejarse partes del cuerpo (como los pies) sin cubrir. En caso de hacerlo, podrá moverse sin ser detectado por ningún medio visual. La única manera de detectar una Capa de Invisibilidad es que el usuario interactúe con el entorno cercano a otros personajes pudiendo hacer que estos les oigan; si eso sucede, la gente hará una tirada de Alerta enfrentada al valor pasivo de Sigilo+4 del usuario de la Capa de Invisibilidad."}, {"id": "Objetos-62", "fuente": "Objetos", "nivel": "Avanzado", "nombre": "Cinturón del Herbalista", "categorias": [], "requisito": "", "texto": "Este cinturón viene equipado con diversas Hierbas e Ingredientes Mágicos bien almacenados que poseen diferentes efectos y pueden ser utilizadas por una Herbalista entrenada. El cinturón puede ser utilizado 1 vez durante una aventura por cada nivel de Herbología que posea el personaje (1 uso en nivel Novato, 2 en Competente, 4 en Experto, 7 en Maestro y 9 en Legendario). Las Hierbas e Ingredientes contenidos son las siguientes: ---Branquialgas: Al consumirlas permiten al personaje respirar con normalidad bajo el agua durante 1 hora, sin embargo, al volver a la superficie pueden ser peligrosas, pues le puede ser difícil al personaje respirar bajo los efectos de las branquialgas. ---Díctamo: Utilizada correctamente puede estabilizar heridas y recuperar del cansancio. Pueden utilizarse al aplicar primeros auxilios para disminuir en dos categorías la dificultad de la tirada o utilizarse para recuperar PA por el modificador de la habilidad de Herbología (1 si es Novato, 2 Competente, 4 Experto, 7 Maestro y 9 Legendario). Se necesita la especialización Medimagia en 3 para poder usarlo en una misma ---Bezoar: El bezoar puede ser utilizado como un antídoto contra los venenos básicos. Una Herbalista puede utilizarlo con una tirada de Herbología con dificultad de 15 para remover los venenos intermedios que no posean un antídoto específico. ---Moly: Esta hierba mágica puede ser ingerida para remover un encantamiento en curso que afecte a una persona. Esto solo puede remover arcanos considerados encantamientos de una persona, para saber si el encantamiento es removido, quién aplicó esta hierba debe realizar una tirada de Inteligencia enfrentada al valor de Poder + 5 del conjurador del efecto mágico a remover. ---Madera de Wiggentree: La madera de Wiggentree posee cualidades mágicas que protegen de criaturas oscuras. Mientras se toque la madera de Wiggentree no se podrá ser atacado por criaturas oscuras, sin embargo, esto solo es cierto para árboles vivos y sanos. El cinturón del Herbalista Precavido tiene un trozo de madera de Wiggentree. Mientras se sostenga, durante una escena, la usuaria obtiene un +2 a su defensa mágica contra criaturas oscuras, como el Basilisco, los Dementores, las Acromántulas, etc... ● Maleta de los mil acres: Ingeniosa maleta de viaje que puede ser abierta de dos maneras, en función de cómo tenga colocados ciertos mecanismos de seguridad. En una de las posiciones mostrará el contenido de una maleta ordinaria que pasaría cualquier tipo de control de seguridad muggle. Sin embargo, en la otra posición la maleta dará lugar a un gran espacio de unas 600 hectáreas de tamaño. Ese espacio puede tener varios tipos de clima, por muy opuestos que sean entre sí, y albergar lo que sea que el dueño de la maleta haya introducido en su interior. A todos los efectos, esta maleta ofrece un ambiente seguro en cualquier situación, así como probable laboratorio de trabajo y una capacidad ilimitada para guardar cualquier posesión que se descubra, y sólo puede abrirse adecuadamente por el dueño de la maleta, funcionando también como una cámara relativamente segura. El interior de la tienda se considerará un entorno ideal para cualquier tarea que se necesite (como tratar heridas, domar criaturas, etc) lo que podrá dar ciertos bonificadores de hasta +4 a algunas tiradas de habilidades o trasfondos a discreción del master. ● Maletín del pocionista inquieto: ¿Eres un famoso pocionista pero no dispones de un lugar dónde llevar a cabo tus experimentos? ¿Te gusta viajar con la casa a cuestas? Entonces este maravilloso maletín es perfecto para tí. Gracias a él, podrás llevar contigo siempre un pequeño laboratorio con todo lo indispensable para hacer pociones, ya sea el fuego, el caldero o los ingredientes necesarios. Y lo mejor de todo es que además está protegido del agua. Gracias a este maletín, el personaje podrá detenerse en una misión y elaborar cualquier poción aunque no la tenga canjeada por 2 veces su valor en puntos de pociones normal (una básica costaría dos puntos de pociones). Esta acción no debería requerir más de un turno (siempre que la escena lo permita) y se puede interpretar en caso de ser necesario que compró esa poción o la preparó hacía semanas. Adicionalmente, tener este maletín duplica los Puntos de Pociones totales del Pocionista. Esta operación se hace antes de los arcanos (como el hervibicus). ● Magnífico Magnificador del Arcanista: Esta engarzada brújula de mano no tiene ninguna capacidad por sí misma, pero sí la tiene cuando se combina con un arcanista o investigador que sepa usar sus secretos. El Magnificador puede usarse como canalizador mágico para cualquier hechizo o ritual que tuviera componentes de investigación (por ejemplo, Aparecium, Appare Vestigium o Ritual del arcanista) como si fuera una varita mágica, y, además, dará un bonificador de +4 a todas las tiradas (generalmente de Consciencia o de Investigación) que se hagan con esos hechizos. Adicionalmente, el Magnificador tiene la propiedad de seguir rastros mágicos siempre que se estén enfocando con su cristal. Si has detectado la presencia de algún hechizo (por ejemplo con Specialis Revelio), la brújula te mostrará el camino hasta la varita que lo conjuró si superas una tirada de Consciencia a dificultad 15. Por último, esta brújula es capaz de detectar y seguir los rastros de Aparición o trasladores. Si una persona se ha Aparecido en las inmediaciones de la Brújula, puedes enfocar el punto en el que se ha aparecido y hacer una tirada de Consciencia, también a dificultad 12. En caso de superarla, podrás Aparecerte automáticamente donde se ha Aparecido el rastro que estás persiguiendo, siempre que ninguna otra magia lo impida (como un ritual antiaparición). ● Máscara de las Mil Caras: Esta curiosa máscara es una burda imitación de la verdadera metamorfomagia. Para ser usada, primero debe colocarse sobre el rostro de una persona, rostro que \"asimilará\" de manera natural, y luego debe colocársela el usuario, de tal manera que imitará la imagen de la primera persona sobre la que se colocó la máscara, otorgándole un +7 a todas las tiradas de Subterfugio relacionadas con hacerse pasar por esa persona. La máscara tiene capacidad para asimilar cinco rostros diferentes, entre los que el usuario puede escoger a voluntad. Para tener el rostro de algún PJ o PNJ Destacado, el usuario debe haber usado la Máscara en una aventura mayor o menor y linkearlo cuando intente utilizarlo en otra misión."}, {"id": "Rituales-1", "fuente": "Rituales", "nivel": "Básico", "nombre": "Avencompedium", "categorias": ["Utilidad"], "requisito": "", "texto": "Require Mago Oscuro 2. Arcano de Utilidad. Este ritual de rastreo funciona casi a la inversa que sus hermanos. En lugar de poder guiar al mago hacia una persona, este ritual indicará al nigromante el camino hacia alguna de las posesiones más importantes para un fantasma en concreto. Utilizando este objeto al que le ha guiado este ritual, el nigromante tendrá entre uno y tres grados de dificultad menos para utilizar cualquier arcano contra ese fantasma en cuestión. Para que este ritual funcione, el nigromante deberá superar una tirada de Investigación cuya dificultad variará en función de los datos que se conozcan del fantasma y de la distancia a la que se encuentre el objeto (ir hasta un objeto que está en la misma habitación de un fantasma del que se conoce casi todo sería dificultad 5 o 7, mientras que buscar en Hogwarts un objeto de un fantasma del que no se conoce ni su nombre podría ser 21 o 25)."}, {"id": "Rituales-2", "fuente": "Rituales", "nivel": "Básico", "nombre": "Avensegium", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este ritual se usa sobre un objeto para convertirlo en un rastreador. Cuando tienes un objeto, debes hacer una tirada de Investigación a dificultad 9. Si superas la tirada, el objeto se convertirá en una brújula que apuntará y guiará permanentemente hacia el dueño de ese objeto, flotando en su dirección."}, {"id": "Rituales-3", "fuente": "Rituales", "nivel": "Básico", "nombre": "Bullapetasum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Conjuración casco-burbuja. Crea una burbuja alrededor de la cabeza del objetivo del hechizo, aislándole y permitiéndole respirar en condiciones extremas (bajo el agua, rodeado de gases, veneno...)."}, {"id": "Rituales-4", "fuente": "Rituales", "nivel": "Básico", "nombre": "Cave Inimicum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad.Ritual protector. Se utiliza para proteger un área contra intrusos. Alerta al conjurador y a sus compañeros en el interior del área de conjuración de la presencia de enemigos en el exterior, incluso ayudando a despertarlos si están dormidos. Su uso genera pequeñas alteraciones alrededor de la zona encantada, como si el lugar se llenase de una tenue neblina. Si alguien atraviesa la zona, todo el que se encuentre en su interior se enterará automáticamente. Si el ritualista está dormido, tiene derecho a despertarse con una tirada de Alerta a dificultad 12 con un bonificador de +2."}, {"id": "Rituales-5", "fuente": "Rituales", "nivel": "Básico", "nombre": "Crescemultum", "categorias": ["Contrahechizo", "Utilidad"], "requisito": "Requiere Especialización Encantador 1.", "texto": "Requiere Especialización Encantador 1. Arcano de Utilidad. Contrahechizo de Dimminuendo. Hechizo de ampliación. Aumenta ligeramente el tamaño de los objetos sobre los que se conjuren, haciéndolos versiones más grandes. Por ejemplo, podría aumentar el tamaño de un coche hasta convertirlo en un camión. No puede usarse sobre personas. Este aumento de tamaño podría traer consecuencias mecánicas a discreción del master como aumentar el daño de un arma o lograr una mejor cobertura en un callejón. Si se lanza en combate (como al arma del enemigo) requerirá tirada de impacto de manera normal. También funciona como contrahechizo de Dimminuendo."}, {"id": "Rituales-6", "fuente": "Rituales", "nivel": "Básico", "nombre": "Deletrius", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad.Ritual de erradicación. Es usado para ocultar mientras el ritual está activo todo tipo de marcas y señales mágicas, como la Marca Tenebrosa (la del cielo o la del brazo) o un mensaje dejado con Flagrate. También se puede usar sobre un texto para volverlo completamente invisible (en su totalidad o en parte). Un texto alterado de esta manera sólo puede leerse con el encantamiento Aparecium."}, {"id": "Rituales-7", "fuente": "Rituales", "nivel": "Básico", "nombre": "Dimminuendo", "categorias": ["Contrahechizo", "Utilidad"], "requisito": "Requiere Especialización Encantador 1.", "texto": "Requiere Especialización Encantador 1. Arcano de Utilidad. Contrahechizo de Crescemultum Encantamiento reductor. Encoge ligeramente el tamaño de los objetos sobre los que se conjure, haciéndolos versiones más pequeñas. Por ejemplo, podría encoger un coche hasta el tamaño de una motocicleta. No puede usarse sobre personas. Esta disminución de tamaño podría traer consecuencias mecánicas a discreción del master como disminuir el daño de un arma o lograr una peor cobertura en un callejón. Si se lanza en combate (como al arma del enemigo) requerirá tirada de impacto de manera normal. Puede usarse como contrahechizo de Crescemultum."}, {"id": "Rituales-8", "fuente": "Rituales", "nivel": "Básico", "nombre": "Duro", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 1.", "texto": "Requiere Especialización Encantador 1. Arcano de Utilidad. Encantamiento de endurecimiento. Este encantamiento permite convertir objetos en piedra, volviéndolos rígidos y duros. La mayoría de objetos afectados por este ritual se vuelven prácticamente irrompibles salvo por algunos arcanos, y difíciles de manipular. El conjurador podrá manipularlos como si no fueran de piedra, sino de su material original, libremente. Si supera una tirada de Ar
