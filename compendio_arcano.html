rera se desvanecerá automáticamente. Los aliados de la persona o criatura encerrada pueden intentar colaborar para romperla, pero el resto de hechizos ofensivos contra el que se encuentre en el interior la atravesarán con normalidad."}, {"id": "Hechizos-48", "fuente": "Hechizos", "nivel": "", "nombre": "Lacarnum Inflamarae", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Conjuración de fuego. Crea una pequeña chispa flamígera de la punta de la varita que viaja desde ésta hasta el objetivo del hechizo, prendiéndole fuego. Causa un daño de 4 PAs, y, a partir del turno siguiente a recibirlo, el objetivo seguirá sufriendo 1 PA de daño adicional cada turno hasta que se cesen los efectos del fuego."}, {"id": "Hechizos-49", "fuente": "Hechizos", "nivel": "", "nombre": "Legeremens Minoris", "categorias": ["Ultraje"], "requisito": "Requiere Especialización Mago Oscuro 1.", "texto": "Requiere Especialización Mago Oscuro 1. Arcano de Ultraje. Cuando se conjura este hechizo, el conjurador debe hacer una tirada de Empatía enfrentado al valor de 5 + Carisma + Subterfugio del objetivo del hechizo. En caso de superarla, podrá saber si la última afirmación que ha hecho el objetivo es verdad o mentira. Una vez superado este hechizo, puede mantenerse conjurado, en cuyo caso el conjurador no podrá usar otros arcanos, durante tanto cuanto dure un intercambio social, para valorar todas las afirmaciones. En caso de que no exista contacto ocular entre el conjurador y el objetivo, el conjurador tiene un penalizador de -4 a su tirada de Empatía. En caso de que el enemigo esté derrotado, la tirada de Empatía tiene +1 que pasa a ser un +2 si el objetivo está inconsciente. Este hechizo puede intentar hacerse de forma sutil (que el objetivo no lo sienta en su mente, aunque seguirá necesitando los pases de varita y pronunciar el arcano), pero, en caso de ser así, suma otro -2 adicional a la tirada de Empatía. Se podrá realizar sin varita ni verbalización con un penalizador a la tirada de Empatía de -7 (salvo que se tenga Magia sin Varita y Conjuración Silenciosa, ambos) que no contará para el máximo de penalizador que pueda acumularse."}, {"id": "Hechizos-50", "fuente": "Hechizos", "nivel": "", "nombre": "Liberacorpus", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Contrahechizo de movimiento. Este hechizo elimina los efectos de todos los arcanos que restringen la movilidad del usuario. Te permitirá caer después de un Levicorpus, liberarte después de un Locomotor Mortis, o ser capaz de continuar combatiendo tras un Petrificus Totallus o un Impedimenta, entre otros."}, {"id": "Hechizos-51", "fuente": "Hechizos", "nivel": "", "nombre": "Locomotor Mortis", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Embrujo de cuerpo muerto. Pega las piernas de la víctima entre sí y la tumba en el suelo, dificultando considerablemente el movimiento. El objetivo sufre un penalizador de -1 en sus valores de Defensa e Iniciativa."}, {"id": "Hechizos-52", "fuente": "Hechizos", "nivel": "", "nombre": "Meteoloembrujo recanto", "categorias": ["Contrahechizo", "Utilidad"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Contrahechizo climático. Este hechizo es capaz de eliminar cualquier efecto de clima alterado. Contrarresta automáticamente los efectos de Climatus. Además, es capaz de calmar las expresiones extremas de la meteorología, haciendo que la lluvia o los fuertes vendavales cesen en pro de un clima normal o que las poderosas tormentas se conviertan en lluvias más normales. ● Morslauter: Requiere ser Mortifago Novato. Arcano de Utilidad. Sencillo hechizo que se lanza sobre cualquier muestra de sangre para descubrir el origen de una determinada persona. El conjurador realizará una tirada de Consciencia con un bonificador de +2, a dificultad 9, y para lograr que la muestra de sangre cambie de color. Se tornará verde si sus ambos padres son magos, negra si ambos son muggle y de un curioso grisáceo si uno es muggle y otro mago. Por cada grado de éxito adicional (y siempre que la muestra sea de al menos del tamaño de un pequeño vial), el análisis se podrá remontar una generación (12 abuelos, 15 bisabuelos etcétera) haciendo que al color principal se le añadan pequeñas vetas de otros tonos en función de la sangre de sus ancestros. Por ejemplo una sangre que sea verde pero tenga una veta negra podría indicar una abuela muggle mientras que una sangre totalmente grisácea sería indicativo de su familia paterna es totalmente sangre limpia y su familia materna totalmente muggle."}, {"id": "Hechizos-53", "fuente": "Hechizos", "nivel": "", "nombre": "Nuntius Minoris", "categorias": ["Utilidad"], "requisito": "Requiere Legeremens Minoris.", "texto": "Requiere Legeremens Minoris. Arcano de Utilidad. Hechizo de comunicación mental. Este arcano permite comunicar un mensaje sin necesidad de verbalizarlo, de modo que la persona que lo recibe lo escucha en su cabeza. En el momento de conjuración del hechizo, el conjurador deberá pensar el mensaje que quiere enviar y apuntar hacia la persona en cuestión con la que quiere comunicarse. Solo permite enviar un mensaje a una única persona, que deberá estar en el campo de visión del conjurador para poder recibirlo."}, {"id": "Hechizos-54", "fuente": "Hechizos", "nivel": "", "nombre": "Obscuro", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Encantamiento de ceguera. Una venda oscura envuelve los ojos del objetivo. El objetivo puede quitarse la venda con facilidad, pero tendrá un penalizador de -1 a sus valores de Ataque y Defensa."}, {"id": "Hechizos-55", "fuente": "Hechizos", "nivel": "", "nombre": "Oclumens Minoris", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Mago Oscuro 1.", "texto": "Requiere Especialización Mago Oscuro 1. Contrahechizo Legeremántico. Cuando se conjura este hechizo, el conjurador debe hacer una tirada de Frialdad a una dificultad de 9. En caso de superarla, será inmune al hechizo Legeremens Minoris. Este hechizo también permite una mayor sensibilidad ante la legeremancia y prevenir sus efectos: si el personaje es víctima de un hechizo legeremántico básico, hará una tirada de Consciencia +1 enfrentada al valor pasivo de Subterfugio del legeremante. En caso de superarla, podrá reaccionar cerrando su mente incluso contra intentos de legeremancia furtivos. Se podrá realizar sin varita ni verbalización con un penalizador de -7 a la tirada de Frialdad (salvo que se tenga Magia sin Varita y Conjuración Silenciosa, ambos) que no contará para el máximo de penalizador que pueda acumularse."}, {"id": "Hechizos-56", "fuente": "Hechizos", "nivel": "", "nombre": "Oppugno", "categorias": ["Combate"], "requisito": "requieren una postura demasiado estática que causará un penalizador de -1 a la Defensa del conjurador.", "texto": "Arcano de combate Embrujo de expulsión. Se usa sobre un objeto para lanzar ese objeto violentamente sobre la víctima. Los objetos arrojados golpean causando un daño de 6 PA, aunque requieren una postura demasiado estática que causará un penalizador de -1 a la Defensa del conjurador."}, {"id": "Hechizos-57", "fuente": "Hechizos", "nivel": "", "nombre": "Parasitus Mínima", "categorias": ["Combate"], "requisito": "Requiere Especialización Mago Oscuro 2.", "texto": "Requiere Especialización Mago Oscuro 2. Arcano de Combate. Este pervertido hechizo roba energía vital al objetivo para transmitirla al mago que lo conjura. Causa 4 PAs de daño base al objetivo y recupera la mitad de la cantidad de daño causado al conjurador. Con este hechizo no se puede superar el máximo de PAs ni el límite de PAs impuesto por Heridas."}, {"id": "Hechizos-58", "fuente": "Hechizos", "nivel": "", "nombre": "Petrificus Totalus", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Encantamiento de parálisis de cuerpo entero. El hechizo petrifica a la víctima, permitiéndole mover sólo los ojos. Este hechizo sólo se puede usar contra un enemigo que esté en 0 PAs o menos. El objetivo queda fuera de combate mientras dure la petrificación. La petrificación durará una base de 1 turno, y se añadirá un turno por cada grado de éxito que esté por encima la tirada de Ataque frente a la de Defensa. En todo este tiempo, el objetivo será considerado como derrotado."}, {"id": "Hechizos-59", "fuente": "Hechizos", "nivel": "", "nombre": "Prior Incantato", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Arcano de Utilidad. Hechizo simple de investigación. Este hechizo se usa sobre una varita. Si se supera una tirada de Consciencia con un bonificador de +1 a dificultad 9, el conjurador sabrá los últimos hechizos conjurados por la varita. Si se supera una dificultad de 18 o más, el conjurador podrá averiguar cualquier hechizo que le interese que haya sido conjurado en la última semana. Si la dificultad que se supera es de 21, el plazo será de un mes."}, {"id": "Hechizos-60", "fuente": "Hechizos", "nivel": "", "nombre": "Protego", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Encantamiento protector. Genera una barrera en forma de pequeño escudo en la punta de la varita que repele y protege de 3 impactos sobre una única persona (que puede ser el conjurador u otro objetivo). Mientras mantengas este hechizo y la protección siga en pie, el conjurador no puede usar otros hechizos. Si se desea desvanecer la barrera preventivamente, el conjurador puede escoger hacerlo: si es así, actuará el último en el orden de Iniciativa (independientemente del resultado de su tirada) y, además, no tendrá el efecto de la barrera desde el inicio de ese turno. También actuará el último en iniciativa el turno siguiente a que la barrera sea destruida. El conjurador podrá desplazarse libremente mientras este hechizo esté conjurado, lo que lo hace ideal para protegerse para ganar tiempo o escapar."}, {"id": "Hechizos-61", "fuente": "Hechizos", "nivel": "", "nombre": "Rayo", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. De la varita del conjurador sale un rayo de energía arcana que golpea al objetivo. Causa un daño de 4 PAs y un penalizador de -1 en su Iniciativa."}, {"id": "Hechizos-62", "fuente": "Hechizos", "nivel": "", "nombre": "Relashio", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Contrahechizo repulsor. Separa ataduras y dos fuerzas entre sí. Libera a magos de una presa, deshace automáticamente los hechizos Atabraquium, Incarcerous o Fulgari y también rompe otras cadenas, cuerdas o cualquier tipo de atadura. Mientras se tenga varita, este hechizo es el único que puede hacerse estando atado."}, {"id": "Hechizos-63", "fuente": "Hechizos", "nivel": "", "nombre": "Reparo Mínima", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Contrahechizo de Alset. Reconstruye objetos desmontados pero no destruidos por medios violentos. Este hechizo interfiere con objetos electrónicos, y no les devuelve el funcionamiento que deberían tener."}, {"id": "Hechizos-64", "fuente": "Hechizos", "nivel": "", "nombre": "Repelium Mínima", "categorias": ["Combate"], "requisito": "Requiere Especialización Combatiente 1.", "texto": "Requiere Especialización Combatiente 1. Arcano de Combate. Este hechizo es, en realidad, una arriesgada maniobra de duelista que consiste en utilizar el poder de un mago contra sí mismo, aunque a costa de un gran riesgo. El hechizo Repelium Mínima permite devolver a su conjurador un hechizo básico que haya lanzado. Para que esto funcione, sin embargo, el conjurador de Repelium Mínima deberá superar en la tirada de Iniciativa al mago al que intenta devolver el hechizo. Además, deberá superar con su propia tirada de Ataque Mágico la tirada de Ataque Mágico del conjurador del hechizo original. El hechizo se devolverá con el valor de Ataque Mágico del conjurador original del hechizo. En caso de fallar, recibirá el hechizo con un penalizador de -1 a su Defensa."}, {"id": "Hechizos-65", "fuente": "Hechizos", "nivel": "", "nombre": "Rictumsempra", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Encantamiento de cosquillas. Genera cosquillas en la víctima, impidiéndole mantenerse serio o concentrarse adecuadamente y tener unas irrefrenables ganas de rascarse. El objetivo tendrá un penalizador de -1 a sus valores de Ataque, Defensa e Iniciativa pero la risa se contagiará un poco al conjurador de este hechizo provocándole un -1 en Defensa."}, {"id": "Hechizos-66", "fuente": "Hechizos", "nivel": "", "nombre": "Riddikulus", "categorias": ["Contrahechizo"], "requisito": "", "texto": "Contrahechizo boggart. Se basa en usar los pensamientos felices para convertir a un boggart en una forma que deje de dar miedo. No tiene ningún otro efecto, pero derrota a un boggart si se supera una tirada de Frialdad a dificultad 9."}, {"id": "Hechizos-67", "fuente": "Hechizos", "nivel": "", "nombre": "Sensus Animal", "categorias": ["Utilidad"], "requisito": "Requiere un nivel de la especialización magizoología acorde a la clase de bestia o criatura.", "texto": "Requiere un nivel de la especialización magizoología acorde a la clase de bestia o criatura. Arcano de Utilidad. Una tirada de Empatía a dificultad 9 permite saber lo que podría sentir el animal, que tendría que ser como mucho un animal doméstico. No son pensamientos, sino una sensación casi mística que indicará al mago si se siente enfadado, contento, tranquilo, curioso, etc. Para animales domésticos sólo se necesitaría magizoología a nivel 1. Para bestias y/ o criaturas de peligrosidad hasta 3, haría falta magizoología al nivel 2. Y para criaturas de peligrosidad más alta, magizoologia al rango 3."}, {"id": "Hechizos-68", "fuente": "Hechizos", "nivel": "", "nombre": "Surgito", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Hechicero 1.", "texto": "Requiere Especialización Hechicero 1. Contrahechizo mental. Elimina automáticamente los efectos de los hechizos de alteración mental, como Confundo. Adicionalmente, si se conjura Surgito sobre una persona con recuerdos borrados, el conjurador puede hacer una tirada de Empatía enfrentada al valor pasivo de Subterfugio del desmemorizador. En caso de superarlo, será capaz de identificar que los recuerdos de la persona han sido modificados. En caso de superarlo por más de dos grados de éxito, podrá recuperar esos recuerdos."}, {"id": "Hechizos-69", "fuente": "Hechizos", "nivel": "", "nombre": "Tragababosas", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Embrujo vomitababosas. Embrujo vomitababosas. Provoca que el objetivo empiece a regurgitar y vomitar babosas descontroladamente, causándole un gran malestar. El objetivo tendrá un penalizador de -1 a sus valores de Ataque, Defensa e Iniciativa pero la visión será un poco desagradable y el conjurador de este hechizo tendrá un -1 en Ataque."}, {"id": "Hechizos-70", "fuente": "Hechizos", "nivel": "", "nombre": "Ventus", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Crea una fuerte ráfaga de viento que empuja y golpea con tanta sequedad y frío que puede llegar a causar daño por las altas velocidades. Causa un daño de 4 PAs y un penalizador de -1 en su valor de Defensa."}, {"id": "Hechizos-71", "fuente": "Hechizos", "nivel": "", "nombre": "Alchimia Incantatio Máxima", "categorias": ["Utilidad"], "requisito": "Requiere Alchima Incantantio.", "texto": "Requiere Alchima Incantantio. Arcano de utilidad. El conjurador debe remover la mano por encima de un vial de una poción avanzada destapada. Los gestos de varita condensarán el reactivo alquímico y lo alzarán, convertido en un preparado líquido que se absorberá en la punta de la varita. Después de eso, y cuando lo desee, el conjurador podrá impulsar la esencia de la poción contra otra persona como si fuera un hechizo cualquiera, aplicando sus efectos si superan el valor de Defensa del objetivo con una tirada de Ataque Mágico del mismo modo que si hubieran bebido la poción. Este ataque no tiene que ser el siguiente conjuro que se lance, aunque se contará con un penalizador de -2 a todas las acciones con varita hasta que se consiga enviar adecuadamente."}, {"id": "Hechizos-72", "fuente": "Hechizos", "nivel": "", "nombre": "Anteoculatia", "categorias": ["Combate"], "requisito": "Requiere Locomotor Terminatus.", "texto": "Requiere Locomotor Terminatus. Arcano de combate. Embrujo de de ojos boxeadores. Los ojos del objetivo salen disparados de sus órbitas, quedando simplemente unidos por el nervio ocular, como si de una caricatura muggle se tratara. Aunque no tardan en volver a su lugar correcto, esto hace que la víctima pierda muchas facultades de combate. El objetivo tendrá un penalizador de -4 a sus valores de Ataque, Defensa e Iniciativa, pero el conjurador del hechizo tendrá tanto asco por lo que está viendo que evitará mirar a su objetivo y obtendrá un -4 en Ataque."}, {"id": "Hechizos-73", "fuente": "Hechizos", "nivel": "", "nombre": "Ardoribus Sempiternis", "categorias": ["Combate"], "requisito": "Requiere ser Ordenista Experto.", "texto": "Requiere ser Ordenista Experto. Arcano de Combate. Este hechizo requiere distintos movimientos circulares con la varita a medida que se va conformando. Una pequeña llama comienza a extenderse bruscamente hasta convertirse en un terrible tifón de fuego que golpeará brutalmente al enemigo. Hace un daño ígneo de 8 PAs. Si el hechizo llega sobre un enemigo al que en este turno o el anterior le ha atacado un ordenista distinto al conjurador, el daño será de 16 PAs y causará un -2 al ataque, defensa e iniciativa del rival."}, {"id": "Hechizos-74", "fuente": "Hechizos", "nivel": "", "nombre": "Arctis", "categorias": ["Combate"], "requisito": "Requiere Glacius.", "texto": "Requiere Glacius. Arcano de Combate. El conjurador convoca una enorme tormenta de hielo que centra sobre un objetivo, haciendo que descienda la temperatura y congelándole casi por completo, volviendo cada movimiento un dolor enorme e incómodo. El objetivo de Arctis sufrirá 12 PAs y un penalizador de -4 en su valor de Ataque."}, {"id": "Hechizos-75", "fuente": "Hechizos", "nivel": "", "nombre": "Arovlop", "categorias": ["Combate"], "requisito": "Requiere Antus.", "texto": "Requiere Antus. Arcano de Combate. Este hechizo causa una reacción mágica muy inestable en el interior de los objetos que los destruye, sean mágicos o no. No afecta a seres vivos. Los objetos mundanos y encantados serán destruidos de manera automática. Algunos objetos especiales (como las varitas mágicas, aunque no exclusivamente) sólo pueden ser destruidos por este hechizo superando determinados resultados en la tirada de Poder, a criterio del master (una varita mágica podría requerir un 15 y un Horrocrux un 18, y el resto de objetos deben asemejarse a unos u otros). Si se lanza en combate (como al arma no encantada de un enemigo) requerirá tirada de impacto de manera normal."}, {"id": "Hechizos-76", "fuente": "Hechizos", "nivel": "", "nombre": "Artivestringo", "categorias": ["Combate"], "requisito": "Requiere Cohortis.", "texto": "Requiere Cohortis. Arcano de combate. El objetivo siente como todo el aire es expulsado de sus pulmones, obligando a centrar todos sus esfuerzos en recuperar el aire lo más rápidamente posible. Esto le provoca un penalizador de -4 en sus valores de Ataque y Defensa."}, {"id": "Hechizos-77", "fuente": "Hechizos", "nivel": "", "nombre": "Avada Kedavra", "categorias": ["Combate"], "requisito": "Requiere Especialización Mago Oscuro 3.", "texto": "Requiere Especialización Mago Oscuro 3. Arcano de Combate. Maldición asesina. Una de las tres Maldiciones Imperdonables. Su uso sobre una persona conlleva la cadena perpetua en Azkaban. No existe manera de detener esta maldición (ni con barreras), y no puede ser contrarrestada (aunque se falle la tirada de ataque). Acaba automáticamente con la vida de lo que impacte. Este hechizo puede usarse sobre un enemigo que no esté a 0 PAs, pero contará con un -7 a su tirada de Ataque."}, {"id": "Hechizos-78", "fuente": "Hechizos", "nivel": "", "nombre": "Avium Legio", "categorias": ["Combate"], "requisito": "Requiere Avis Grex.", "texto": "Requiere Avis Grex. Arcano de combate. Este hechizo convoca una gran legión de animales alados mágicos que se meten en el camino del objetivo de manera tremendamente atosigante. No hacen daño, pero entorpecen su tiro y se ponen en medio de casi todos los hechizos, incluso recibiéndolos ellos antes de echar a volar y desvanecerse. El objetivo tendrá un penalizador de -4 a sus valores de Ataque, Defensa e Iniciativa pero la bandada de animales alados también molesta al conjurador de este hechizo provocándole un -4 en Iniciativa."}, {"id": "Hechizos-79", "fuente": "Hechizos", "nivel": "", "nombre": "Bombarda Máxima", "categorias": ["Combate"], "requisito": "Requiere Confringo.", "texto": "Requiere Confringo. Arcano de Combate. Embrujo explosivo. Provoca una gran explosión capaz de derrumbar una muralla de piedra. Causa un daño de 12 PAs y cuenta como 7 impactos en vez de 3 al usarse contra una barrera mágica."}, {"id": "Hechizos-80", "fuente": "Hechizos", "nivel": "", "nombre": "Brackium Emendo", "categorias": ["Sanación"], "requisito": "Requiere Reparifors.", "texto": "Requiere Reparifors. Arcano de Sanación. Hechizo crece-huesos. Hace crecer huesos que pudieran estar rotos y cura desgarros menores. Da un bonificador de +7 a la tirada de Medicina para estabilizar Heridas de otras personas (que, aún así, deberán ser curadas posteriormente) y eliminar el penalizador que producen. Para estabilizar una Herida, debe superarse una tirada de Medicina a dificultad Complicada (12). Cada grado de éxito que se supere la tirada de Medicina, estabilizará dos Heridas extra (sin ningún límite). Este hechizo se puede usar sobre uno mismo si se posee la Especialización Medimago 3."}, {"id": "Hechizos-81", "fuente": "Hechizos", "nivel": "", "nombre": "Confundo", "categorias": ["Ultraje"], "requisito": "Requiere Especialización Mago Oscuro 1.", "texto": "Requiere Especialización Mago Oscuro 1. Arcano de Ultraje. Encantamiento confundus. Este encantamiento altera las percepciones de la persona (e incluso las actitudes de los objetos encantados, como bludgers) y causa confusión. Puede cambiar las percepciones de una persona y alterar sus percepciones del momento, pudiendo hacer que se crea que ya se ha examinado un lugar, que las normas permiten cuatro participantes en el torneo o que el plan que te acaban de contar en realidad es obra tuya.. Esto no modificará sus recuerdos ni sus pensamientos, pero sí cambiará su forma de ver el mundo.Este hechizo no puede usarse y no tiene efecto en combate, aunque sí sobre un enemigo derrotado o que no se lo espere (en cuyo caso su Defensa se calcularía con Voluntad + Frialdad en vez de Destreza + Esquivar). La víctima de este hechizo deberá realizar una tirada de Frialdad contra el valor pasivo de Intimidación +7 del conjurador. En caso de fallar, deberá comportarse acorde a unas pautas que haya marcado el mago que la embrujo. Cada hora tendrá derecho a repetir la tirada de Frialdad, reduciendo el bonificador de Intimidación un punto hasta un mínimo de +2. Si llegados a ese punto no ha superado la tirada, entonces sólo podrá repetir la tirada una vez al día empezando nuevamente con un +7 en Intimidación. La pauta se repetira hasta que se supere la tirada (pasando a semanas, meses, años y lustros)."}, {"id": "Hechizos-82", "fuente": "Hechizos", "nivel": "", "nombre": "Consumo Diabolica", "categorias": ["Combate"], "requisito": "Requiere Incendio Diabolica.", "texto": "Requiere Incendio Diabolica. Arcano de Combate. Este hechizo es uno de los dos únicos que se pueden conjurar durante la realización de Protego Diabolica. Consume prematuramente el ritual de Protego Diabolica para crear un estallido de magia oscura y fuego diabólico que se descontrolará, adoptando la forma de criaturas oscuras. El fuego diabólico comenzará a arrasar todo cuanto haya a su alrededor, incluido el conjurador y sus aliados. Adecuadamente conjurado, este hechizo puede arrasar ciudades enteras. Causa cada turno 10 PAs a todo el que se encuentre en el área de actuación, y sólo puede detenerse con la intervención coordinada de varios magos usando disipaciones mágicas al mismo tiempo (a criterio del master, aunque recomendamos que prime la epicidad para los jugadores en su resolución de escenas) o un ritual de contención apropiado preparado con antelación."}, {"id": "Hechizos-83", "fuente": "Hechizos", "nivel": "", "nombre": "Crucio", "categorias": ["Ultraje"], "requisito": "Requiere Especialización Mago Oscuro 3.", "texto": "Requiere Especialización Mago Oscuro 3. Arcano de Ultraje. Maldición Cruciatus. Una de las tres Maldiciones Imperdonables. Su uso en un ser humano conlleva la cadena perpetua en Azkaban. Genera un dolor insoportable y agónico en su víctima. Es la mayor forma de tortura conocida, sus efectos ni siquiera pueden igualarse a cualquier tortura convencional. Mientras Crucio se esté conjurando sobre un objetivo, éste deberá superar una tirada de Frialdad a dificultad 25 para poder intentar actuar, aunque el conjurador de Crucio tampoco podrá usar otros hechizos. Usos prolongados durante varias horas seguidas de esta maldición pueden inducir la locura o resultados aún peores. Una vez termine la exposición al Crucio, el objetivo deberá superar una tirada de Frialdad enfrentada al valor de 5 + Carisma + Intimidación del conjurador de Crucio para poder volver a actuar. Si intenta actuar contra cualquier otra persona que no sea el conjurador, tendrá un bonificador de +4 a esta tirada. Este hechizo no puede usarse y no tiene efecto en combate, aunque sí sobre un enemigo derrotado o que no se lo espere."}, {"id": "Hechizos-84", "fuente": "Hechizos", "nivel": "", "nombre": "Desmaius", "categorias": ["Combate"], "requisito": "Requiere Impedimenta.", "texto": "Requiere Impedimenta. Arcano de Combate. Encantamiento aturdidor. Deja inconsciente a la víctima sobre la que se conjura. Este hechizo sólo se puede usar contra un enemigo que esté en 0 PAs o menos. El objetivo queda fuera de combate mientras dure la inconsciencia. La inconsciencia durará una base de 1 turno, y se añadirán tres turnos por cada grado de éxito que esté por encima la tirada de Ataque frente a la de Defensa. En todo este tiempo, el objetivo estará considerado derrotado."}, {"id": "Hechizos-85", "fuente": "Hechizos", "nivel": "", "nombre": "Expecto Patronum", "categorias": ["Contrahechizo"], "requisito": "", "texto": "Contrahechizo de dementor. Encantamiento Patronus. Complicado hechizo antidementores. Este encantamiento materializa los pensamientos felices y las emociones positivas del conjurador en una neblina plateada que puede defender al conjurador de la presencia de lethifolds, dementores y otros seres particulares. Al usar el Patronus, el conjurador debe hacer una tirada de Frialdad. En función del resultado, podrá protegerse de más dementores. Un resultado de 9 permitirá defenderse de un único dementor. Si se obtiene un 12 permitirá hacerlo de diez dementores y que el Patronus adopte una forma corpórea. Con un 15 aumentará exponencialmente a unos cuarenta dementores. Por último, 18 o más permitirá expulsar a todos los dementores de la escena. Este resultado también permite usarlo para enviar mensajes o cargar objetos hacia personas conocidas por el conjurador."}, {"id": "Hechizos-86", "fuente": "Hechizos", "nivel": "", "nombre": "Exorcismo", "categorias": ["Utilidad"], "requisito": "Requiere Especializacion Mago Oscuro 2.", "texto": "Requiere Especializacion Mago Oscuro 2. Arcano de Utilidad. Este complejo ritual exorciza por completo a un ser de naturaleza espiritual. Para funcionar, el ser espiritual tiene que ser voluntario o estar completamente quieto durante la canalización de este ritual (como, por ejemplo, encerrado) o derrotado. Puede hacerse contra un espíritu agresivo, pero, para eso, debe superarse una tirada de Arcanismo enfrentado al valor de Frialdad del espíritu en cuestión."}, {"id": "Hechizos-87", "fuente": "Hechizos", "nivel": "", "nombre": "Fiendfyre", "categorias": ["Combate"], "requisito": "Requiere Incendio.", "texto": "Requiere Incendio. Arcano de Combate. Maldición de fuego demoníaco. Crea unas grandes llamas con forma de animal o criatura mágica. Es un fuego tremendamente poderoso y peligroso, que muta su forma según el conjurador y el momento de convocarlo. El fuego demoníaco causa un daño inmediato de 12 PAs por fuego y, después de eso, el objetivo seguirá sufriendo 4 PAs de daño cada turno hasta que se cesen los efectos del Fiendfyre."}, {"id": "Hechizos-88", "fuente": "Hechizos", "nivel": "", "nombre": "Finite Incantatem", "categorias": ["Contrahechizo"], "requisito": "Requiere Finite.", "texto": "Requiere Finite. Contrahechizo Genérico. Cesa todos los efectos mágicos realizados en un área concreta. Este hechizo no afecta sobre objetos mágicos o consecuencias permanentes de hechizos o rituales (no detendría el efecto de fuego de un Incendio, o haría visible a alguien bajo una capa de invisibilidad, ni podría eliminar a un inferius). Para determinar si un efecto es eliminado o no, se ha de hacer una tirada de Poder +2 enfrentada al valor de 5 + Poder del conjurador del efecto mágico a derrotar."}, {"id": "Hechizos-89", "fuente": "Hechizos", "nivel": "", "nombre": "Fluctus Máxima", "categorias": ["Utilidad"], "requisito": "Requiere Fluctus.", "texto": "Requiere Fluctus. Arcano de Utilidad. Este hechizo sólo se puede conjurar cuando se está canalizando una barrera mágica. El conjurador envía un pulso de energía arcana desde la punta de su varita a su propia barrera (no funciona en protecciones ajenas) y la convierte en restos arcanos que, posteriormente, enviar contra un enemigo. Convierte los impactos básicos restantes de las barrera en un hechizo que los arroja contra el enemigo y hace un daño de 3 PAs de daño por cada impacto restante. Después de conjurar este hechizo, se pierde la iniciativa igual que si se hubiera destruido la barrera."}, {"id": "Hechizos-90", "fuente": "Hechizos", "nivel": "", "nombre": "Fulgari", "categorias": ["Combate"], "requisito": "Requiere Incarcerous.", "texto": "Requiere Incarcerous. Arcano de Combate. Este hechizo no funciona en criaturas mágicas, sólo en objetivos humanos. Maldición de atadura. Invoca unas cuerdas oscuras y negras que atan violentamente al objetivo, impidiendo cualquier tipo de actuación. Estas cuerdas se cerrarán fuertemente, y sólo permitirán que se conjuren hechizos de protección mágica sobre uno mismo (como Protego Máxima) o el hechizo Relashio. Cualquier otro hechizo o la Aparición será imposible de realizar, así como cualquier acción física. Una persona puede librarse de las cuerdas superando una tirada de Arcanismo y otra de Frialdad a dificultad 15. Aunque la persona esté atada, no se la considerará derrotada."}, {"id": "Hechizos-91", "fuente": "Hechizos", "nivel": "", "nombre": "Furia Plantae", "categorias": ["Combate"], "requisito": "Requiere Impetus Plantae.", "texto": "Requiere Impetus Plantae. Arcano de Combate. Con un movimiento eres capaz que las plantas comiencen a pelear junto a ti. Ramas, raíces y tallos se enrollarán alrededor de la persona, elevándola por los aires, lanzándola, tirándola, dando golpes secos o incluso intentando asfixiarla. El objetivo que sea afectado por dicho conjuro recibirá -7 Iniciativa."}, {"id": "Hechizos-92", "fuente": "Hechizos", "nivel": "", "nombre": "Gubraith", "categorias": ["Utilidad"], "requisito": "Requiere Poder 7.", "texto": "Requiere Poder 7. Arcano de Utilidad. Encantamiento de fuego eterno. Súmamente difícil de realizar. Crea una llama de fuego imposible de apagar que no se extiende a otros materiales. Suele usarse como muestra de poder. Conjurar esta llama puede otorgar a su conjurador un gran reconocimiento y estatus. Cuando se hace una tirada de trasfondo con un objetivo que sepa que conoces este hechizo, se lanzarán dos dados en lugar de uno y se usará el resultado más alto."}, {"id": "Hechizos-93", "fuente": "Hechizos", "nivel": "", "nombre": "Harmonia Nectere Passus", "categorias": ["Contrahechizo"], "requisito": "Requiere Reparo.", "texto": "Requiere Reparo. Contrahechizo de Arovlop. Repara todos los objetos, mágicos o no, que hayan sido destruidos por el hechizo Arovlop o por cualquier otro medio (siempre que se conserven todos sus componentes vitales y la mayoría de las piezas totales). Aquellos objetos encantados que hayan perdido sus propiedades mágicas los recuperan."}, {"id": "Hechizos-94", "fuente": "Hechizos", "nivel": "", "nombre": "Illuminas Pluviam", "categorias": ["Combate"], "requisito": "Requiere Infulgurum.", "texto": "Requiere Infulgurum. Arcano de Combate. El conjurador canaliza energía durante unos instantes convoca una tormenta eléctrica y una lluvia de rayos que golpean con fuerza arrolladora al objetivo. Causa un daño de 12 PAs y un penalizador de -4 a la Iniciativa."}, {"id": "Hechizos-95", "fuente": "Hechizos", "nivel": "", "nombre": "Imperio", "categorias": ["Ultraje"], "requisito": "Requiere Especialización Mago Oscuro 3.", "texto": "Requiere Especialización Mago Oscuro 3. Arcano de Ultraje. Maldición Imperius. Es una de las tres Maldiciones Imperdonables. Su uso sobre un ser humano conlleva la cadena perpetua en la prisión de Azkaban. Elimina la voluntad del objetivo y lo convierte en una marioneta que obedecerá todas las órdenes del conjurador. Este hechizo no puede usarse y no tiene efecto en combate, aunque sí sobre un enemigo derrotado o que no se lo espere (en cuyo caso su Defensa se calcularía con Voluntad + Frialdad en vez de Destreza + Esquivar). En principio, el objetivo estará obligado a obedecer todas las órdenes que se le den, pero hay algunas excepciones a esto. Cuando la orden es muy contraria a su voluntad o su naturaleza (como, por ejemplo, que ataque a un amigo o que revele secretos), tendrá derecho a una tirada de Frialdad enfrentada al valor de 5 + Carisma + Coordinación del conjurador. Si la orden le obliga a causarse daño a sí mismo, tendrá un bonificador de +4 a la tirada de Frialdad. Adicionalmente, al final de cada hora, puede intentar hacer la misma tirada para librarse del influjo del Imperio."}, {"id": "Hechizos-96", "fuente": "Hechizos", "nivel": "", "nombre": "Impulso Fractus", "categorias": ["Combate"], "requisito": "Requiere Everte Statum.", "texto": "Requiere Everte Statum. Arcano de combate. Embrujo desorientador. Este hechizo hace que el oponente giré velozmente sobre sí mismo, haciéndole quedar desorientado y ralentizando enormemente su tiempo de reacción. El objetivo tarda un momento en recuperarse del aturdimiento, sufriendo un penalizador de -7 en Ataque."}, {"id": "Hechizos-97", "fuente": "Hechizos", "nivel": "", "nombre": "Incendio Diabolica", "categorias": ["Combate"], "requisito": "Requiere Protego Diabolica.", "texto": "Requiere Protego Diabolica. Arcano de Combate. Este hechizo es uno de los dos únicos hechizos que se pueden conjurar durante la realización de Protego Diabolica. Envía una lengua de fuego diabólico contra un objetivo. Sin embargo, para golpear, se usará el valor de Rituales en vez del de Duelo en la tirada de Ataque Mágico. En caso de golpear, causará un daño de 15 PAs."}, {"id": "Hechizos-98", "fuente": "Hechizos", "nivel": "", "nombre": "Legeremens", "categorias": ["Ultraje"], "requisito": "Requiere Legeremens Media.", "texto": "Requiere Legeremens Media. Arcano de Ultraje. Cuando se conjura este hechizo, el conjurador debe hacer una tirada de Empatía enfrentado al valor de 5 + Carisma + Subterfugio del objetivo del hechizo. En caso de superarla, el conjurador puede buscar una pieza de información en la mente del objetivo y conseguirla, leyéndole la mente. Una vez superado este hechizo, puede mantenerse conjurado, en cuyo caso el conjurador no podrá usar otros arcanos, durante tanto cuanto dure un intercambio social, buscando una pieza de información adicional en cada turno. En caso de que no exista contacto ocular entre el conjurador y el objetivo, el conjurador tiene un penalizador de -4 a su tirada de Empatía. En caso de que el enemigo esté derrotado, la tirada de Empatía tiene +4 que pasa a ser un +7 si el objetivo está inconsciente. Este hechizo puede intentar hacerse de forma sutil (que el objetivo no lo sienta en su mente, aunque seguirá necesitando los pases de varita y pronunciar el arcano), pero, en caso de ser así, suma otro -2 adicional a la tirada de Empatía. Se podrá realizar sin varita ni verbalización con un penalizador a la tirada de Empatía de -2 (salvo que se tenga Magia sin Varita y Conjuración Silenciosa, ambos) que no contará para el máximo de penalizador que pueda acumularse."}, {"id": "Hechizos-99", "fuente": "Hechizos", "nivel": "", "nombre": "Levinsana", "categorias": ["Combate"], "requisito": "Requiere Levicorpus.", "texto": "Requiere Levicorpus. Arcano de combate. Este hechizo hace levitar al adversario sin su consentimiento y de manera algo descontrolada, impidiendo que haga cualquier acción de movimiento. Sin embargo, pese a esto, todavía puede defenderse y continuar actuando, aunque con mucha dificultad. El objetivo sufre un penalizador de -4 sus valores de Ataque e Iniciativa, y, después, caerá al suelo."}, {"id": "Hechizos-100", "fuente": "Hechizos", "nivel": "", "nombre": "Lingualoopsia", "categorias": ["Combate"], "requisito": "Requiere Tarantallegra.", "texto": "Requiere Tarantallegra. Arcano de combate. Embrujo de lengua enredada. Obliga a la víctima a decir un montón de palabras aleatorias que conozca, dificultando enormemente su capacidad de conjurar correctamente. El objetivo tendrá un penalizador de -4 a sus valores de Ataque, Defensa e Iniciativa, pero a veces dirá conjuros aleatorios que vuelen hacia quien le lanzó este embrujo haciendo que éste obtenga un -4 en Defensa."}, {"id": "Hechizos-101", "fuente": "Hechizos", "nivel": "", "nombre": "Locomotor Finalis", "categorias": ["Combate"], "requisito": "Requiere Locomotor Terminatus.", "texto": "Requiere Locomotor Terminatus. Arcano de combate. Este maleficio logra paralizar gran todo el tronco inferior del cuerpo así como una de las extremidades del objetivo, dejando apenas un brazo con movimiento. Esto provoca una dificultad de movimiento casi total, y causa un penalizador de -4 en sus valores de Defensa e Iniciativa."}, {"id": "Hechizos-102", "fuente": "Hechizos", "nivel": "", "nombre": "Macrocranio", "categorias": ["Combate"], "requisito": "Requiere Dispergam.", "texto": "Requiere Dispergam. Arcano de combate. Este maleficio hace crecer enormemente la cabeza de la víctima llegando a hacer que parezca un gran globo. Aunque el arcano no resulta especialmente peligroso para la salud física (otra cosa es la social o psicológica) aumenta mucho la superficie de impacto para cualquier ataque, haciendo que sea más fácil impactar. El objetivo tendrá un penalizador de -7 a su valor de Defensa."}, {"id": "Hechizos-103", "fuente": "Hechizos", "nivel": "", "nombre": "Morswunde", "categorias": ["Combate"], "requisito": "Requiere ser Mortifago Experto.", "texto": "Requiere ser Mortifago Experto. Arcano de Combate Este hechizo es una forma de magia negra especialmente desarrollada por los mortífagos para hacer heridas y cicatrices permanentes sobre un enemigo. Hace una deflagración dañina de magia oscura de 10 PAs que siempre dejará una cicatriz permanente. Todas las Heridas provocadas por este hechizo se consideran Malditas, lo que significa que necesitan dos categorías de dificultad más para estabilizarse y curarse."}, {"id": "Hechizos-104", "fuente": "Hechizos", "nivel": "", "nombre": "Nebula Alchimia", "categorias": ["Combate"], "requisito": "Requiere Alchimia Incantatio Maxima.", "texto": "Requiere Alchimia Incantatio Maxima. Arcano de Combate. Versión avanzada de la condensación alquímica de pociones. El conjurador apunta, primero, a un frasco con una poción y, con varios giros de varita, la convierte en una forma gaseosa. Después, esta forma gaseosa se liberará de la poción (el color dependerá por completo del color y la consistencia de la propia poción) y se extenderá rápidamente a su alrededor y ocupará una estancia (o, en general, el espacio en el que esté sucediendo una escena), esparciendo el efecto mágico de la poción sin distinguir entre enemigos y aliados. En caso de que la poción sea perniciosa y alguien no quiera recibirlo, se deberá utilizar una tirada de Ataque del conjurador, que se enfrentará, individualmente, a todos los valores de Esquiva de aquellos que deseen apartarse."}, {"id": "Hechizos-105", "fuente": "Hechizos", "nivel": "", "nombre": "Nuntius", "categorias": ["Utilidad"], "requisito": "Requiere Nuntius Media.", "texto": "Requiere Nuntius Media. Arcano de Utilidad. Hechizo de comunicación mental. Este arcano permite comunicar un mensaje sin necesidad de verbalizarlo, de modo que las personas que lo reciben lo escuchan en su cabeza. En el momento de conjuración del hechizo, el conjurador deberá pensar el mensaje que quiere enviar, y podrá enviárselo a tantas personas como desee siempre que estas se encuentren a una distancia razonable (por ejemplo, un mismo edificio, un campo de batalla, etc.) y que haya visto en los últimos minutos."}, {"id": "Hechizos-106", "fuente": "Hechizos", "nivel": "", "nombre": "Oclumens", "categorias": ["Contrahechizo"], "requisito": "Requiere Oclumens Media.", "texto": "Requiere Oclumens Media. Contrahechizo Legeremántico. Cuando se conjura este hechizo, el conjurador debe hacer una tirada de Frialdad a una dificultad de 9. En caso de superarla, será inmune al hechizo Legeremens. Este hechizo también permite una mayor sensibilidad ante la legeremancia y prevenir sus efectos: si el personaje es víctima de un hechizo legeremántico, hará una tirada de Consciencia +4 enfrentada al valor pasivo de Subterfugio del legeremante. En caso de superarla, podrá reaccionar cerrando su mente incluso contra intentos furtivos de legeremancia básica, intermedia o avanzada. Se podrá realizar sin varita ni verbalización con un penalizador de -2 a la tirada de Frialdad (salvo que se tenga Magia sin Varita y Conjuración Silenciosa, ambos) que no contará para el máximo de penalizador que pueda acumularse."}, {"id": "Hechizos-107", "fuente": "Hechizos", "nivel": "", "nombre": "Parasitus Maxima", "categorias": ["Combate"], "requisito": "Requiere Parasitus.", "texto": "Requiere Parasitus. Arcano de Combate. La versión más poderosa del hechizo parasitario, succiona la energía vital del objetivo dejándole con un aspecto lívido y enfermizo. Causa 12 puntos de daño base al objetivo y recupera la mitad de la cantidad de daño causado al conjurador. Con este hechizo no se puede superar el máximo de PAs ni el límite de PAs impuesto por Heridas."}, {"id": "Hechizos-108", "fuente": "Hechizos", "nivel": "", "nombre": "Paries Ignis", "categorias": ["Combate"], "requisito": "Requiere Aqua Volatem y Partis Temporus.", "texto": "Requiere Aqua Volatem y Partis Temporus. Arcano de Combate. El hechizo crea una enorme cúpula de fuego mágico que envuelve al objetivo y lo encierra en una prisión ígnea, dejándole completamente atrapado hasta que se destroce la jaula con 12 impactos. Esta jaula sólo puede encerrar a un objetivo, para el que se debe superar una tirada de Ataque Mágico con un bonificador de +4 para impactar. Mientras mantengas este hechizo y la jaula siga en pie, el conjurador no puede usar otros hechizos. Si se desea desvanecer la barrera preventivamente, el conjurador puede escoger hacerlo: si es así, actuará el último en el orden de Iniciativa (independientemente del resultado de su tirada) y, además, no tendrá el efecto de la barrera desde el inicio de ese turno. También actuará el último en iniciativa el turno siguiente a que la barrera sea destruida. Si el conjurador intenta alejarse de la zona en la que ha conjurado mientras lo mantiene, la barrera se desvanecerá automáticamente. Los aliados de la persona o criatura encerrada pueden intentar colaborar para romperla, pero el resto de hechizos ofensivos contra el que se encuentre en el interior la atravesarán con normalidad."}, {"id": "Hechizos-109", "fuente": "Hechizos", "nivel": "", "nombre": "Partis Temporus", "categorias": ["Combate"], "requisito": "Requiere Fianto Duri.", "texto": "Requiere Fianto Duri. Arcano de Combate. El hechizo genera una poderosa protección que adoptará distintas formas y elementos cada vez, que es capaz de interceptar y desviar hasta 6 impactos conjurados contra la zona que cubre el conjurador. Este hechizo genera una zona de protección estática que puede cubrir a un grupo de personas. Mientras mantengas este hechizo y la protección siga en pie, el conjurador no puede usar otros hechizos. Si se desea desvanecer la barrera preventivamente, el conjurador puede escoger hacerlo: si es así, actuará el último en el orden de Iniciativa (independientemente del resultado de su tirada) y, además, no tendrá el efecto de la barrera desde el inicio de ese turno. También actuará el último en iniciativa el turno siguiente a que la barrera sea destruida. Si el conjurador intenta alejarse de la zona en la que ha conjurado, la barrera se desvanecerá."}, {"id": "Hechizos-110", "fuente": "Hechizos", "nivel": "", "nombre": "Portaberto", "categorias": ["Utilidad"], "requisito": "Requiere Aberto.", "texto": "Requiere Aberto. Arcano de Utilidad. Hechizo de cerradura de máximo nivel. Permite abrir cualquier cerradura o cualquier puerta que esté en el camino del conjurador. El mago hace una tirada de Latrocinio con un bonificador de +7 y sigue la misma escala del hechizo Alohomora. Además, permite abrir cerraduras encantadas, como las provocadas por los rituales Fermaportus o Fermaportus Maxima. Sin tener este hechizo, las dificultades aumentan en un grado de éxito. En caso de que la tirada de Latrocinio falle, la cerradura se abrirá igualmente, pero será destruída automáticamente en el proceso."}, {"id": "Hechizos-111", "fuente": "Hechizos", "nivel": "", "nombre": "Potentiae Actus", "categorias": ["Utilidad"], "requisito": "Requiere Dual Potens.", "texto": "Requiere Dual Potens. Arcano de Utilidad. Hechizo de apoyo. La varita del objetivo empieza a brillar poderosamente, iluminado con una radiante luz dorada. Potencia los efectos base del próximo hechizo que lance el objetivo. En caso de hechizos dañinos, este efecto será de +7 a la base de daño, sin alterar el resto de factores. En caso de hechizos de penalización, aumentará la penalización en -7 puntos (priorizando, si lo hubiera, el valor principal afectado). En hechizos narrativos, el efecto queda a discreción del master. Este hechizo no puede usarse sobre uno mismo."}, {"id": "Hechizos-112", "fuente": "Hechizos", "nivel": "", "nombre": "Repelium Máxima", "categorias": ["Combate"], "requisito": "Requiere Repelium.", "texto": "Requiere Repelium. Arcano de Combate. Este hechizo es, en realidad, una arriesgada maniobra de duelista que consiste en utilizar el poder de un mago contra sí mismo, aunque a costa de un gran riesgo. El hechizo Repelium Máxima permite devolver a su conjurador cualquier hechizo que haya lanzado. Para que esto funcione, sin embargo, el conjurador de Repelium Máxima deberá superar en la tirada de Iniciativa al mago al que intenta devolver el hechizo. Además, deberá superar con su propia tirada de Ataque Mágico la tirada de Ataque Mágico del conjurador del hechizo original. El hechizo se devolverá con el valor de Ataque Mágico del conjurador original del hechizo. En caso de fallar, recibirá el hechizo con un penalizador de -4 a su Esquiva."}, {"id": "Hechizos-113", "fuente": "Hechizos", "nivel": "", "nombre": "Rupturum", "categorias": ["Combate"], "requisito": "", "texto": "Especialidad Mago Oscuro 2. Arcano de Combate. Esta terrible maldición asesina es capaz de hacer explotar a su objetivo y reducirlo a poco más que una pulpa sanguinolenta. Sin embargo este arcano es vuelve del todo inocuo al impactar contra cosa que no sea un ser vivo. Se debe sumar el Vigor del objetivo a la defensa contra este hechizo pero en caso de superarse el efecto es la muerte autómatica al producirse una explosión de todo el cuerpo. En caso de recibir una contra de este hechizo, el atacante perderá un porcentaje de sus heridas equivalente al nivel de la contra +2 (Por lo que una contra de cuatro puntos matará al atacante). Este hechizo puede usarse sobre un enemigo que no esté a 0 PAs, pero contará con un -7 a su tirada de Ataque."}, {"id": "Hechizos-114", "fuente": "Hechizos", "nivel": "", "nombre": "Salvio Hexia", "categorias": ["Combate"], "requisito": "Requiere Protego Máxima.", "texto": "Requiere Protego Máxima. Arcano de Combate. Hechizo defensivo. La más poderosa de las protecciones contra la magia. Crear una poderosa aura de protección alrededor del objetivo del hechizo que le permite desviar casi cualquier cosa con la que le ataquen, repeliendo hasta 9 impactos. Mientras mantengas este hechizo y la protección siga en pie, el conjurador no puede usar otros hechizos. Si se desea desvanecer la barrera preventivamente, el conjurador puede escoger hacerlo: si es así, actuará el último en el orden de Iniciativa (independientemente del resultado de su tirada) y, además, no tendrá el efecto de la barrera desde el inicio de ese turno. También actuará el último en iniciativa el turno siguiente a que la barrera sea destruida. El conjurador podrá desplazarse libremente mientras este hechizo esté conjurado, lo que lo hace ideal para protegerse para ganar tiempo o escapar."}, {"id": "Hechizos-115", "fuente": "Hechizos", "nivel": "", "nombre": "Sectumsempra", "categorias": ["Combate"], "requisito": "Requiere Sectum.", "texto": "Requiere Sectum. Arcano de Combate. Maldición sangrante. Poderosa maldición que crea profundos cortes y heridas sangrantes en el cuerpo de la víctima. Si no se tratan rápidamente, pueden dejar cicatrices de por vida y resultar letales. Causa un daño de 6 PA durante los siguientes 3 turnos, empezando el turno siguiente a recibir este hechizo."}, {"id": "Hechizos-116", "fuente": "Hechizos", "nivel": "", "nombre": "Specialis Revelio", "categorias": ["Utilidad"], "requisito": "Requiere Revelio.", "texto": "Requiere Revelio. Arcano de Utilidad. Hechizo de análisis y rastreo mágico por excelencia. Después de conjurar este hechizo, se ha de hacer una tirada de Consciencia con un bonificador de +4 a dificultad 9. Si se supera esta tirada no sólo se conocerán los hechizos o encantamientos actuales (haciendo las mismas funciones que el hechizo Revelio), sino que también podrán rastrearse los hechizos utilizados en el pasado (conjurados una hora atrás superando un 9, dos horas con un 12, 6 horas con un 15, 12 horas con un 18, 24 horas con un 21 o una semana superando una dificultad de imposible). Adicionalmente, se ha de enfrentar el valor de la tirada con el valor de 5 + Destreza + Sigilo de cualquier persona oculta con el apoyo de algún hechizo (como, por ejemplo, Caeca Temporalis) o cualquier objeto oculto (como con el hechizo Evanesco) para saber si se revela su presencia o no."}, {"id": "Hechizos-117", "fuente": "Hechizos", "nivel": "", "nombre": "Turbinis", "categorias": ["Combate"], "requisito": "Requiere Ruptis.", "texto": "Requiere Ruptis. Arcano de Combate. Desata una poderosa tempestad de viento seco e hiriente que golpea con violencia al objetivo sobre el que se apunta el hechizo. Causa un daño de 12 PAs y un penalizador de -4 en su valor de Defensa."}, {"id": "Hechizos-118", "fuente": "Hechizos", "nivel": "", "nombre": "Vulnera Sanentur", "categorias": ["Contrahechizo"], "requisito": "Requiere Remedium.", "texto": "Requiere Remedium. Contrahechizo de Sectumsempra. Se utiliza para detener las heridas provocadas por la maldición Sectumsempra. También puede servir para detener otro tipo de heridas sangrantes como Diffindo o Sectum. Además, recupera los PAs perdidos por su efecto si se aplica antes de que termine el combate (aunque el efecto del maleficio ya haya concluido)."}]</script>
<script>
const ARCANOS = JSON.parse(document.getElementById('arcanos-data').textContent);

const FUENTES = ["Objetos","Rituales","Pociones","Hechizos"];
const NIVEL_ORDER = ["Doméstico","Básico","Básica","Intermedio","Intermedia","Avanzado","Avanzada"];
const CATS = ["Combate","Utilidad","Sanación","Ultraje","Contrahechizo"];

let state = {
  q: "",
  fuente: new Set(),
  nivel: new Set(),
  cat: new Set(),
  open: new Set(),
};

// ---- build filter chip rows ----
function buildChips(){
  const rowF = document.getElementById('row-fuente');
  FUENTES.forEach(f=>{
    const n = ARCANOS.filter(a=>a.fuente===f).length;
    const b = document.createElement('button');
    b.className='chip'; b.dataset.fuente=f;
    b.textContent = `${f} (${n})`;
    b.onclick=()=>{ toggleSet(state.fuente, f); render(); };
    rowF.appendChild(b);
  });

  const nivelesPresent = [...new Set(ARCANOS.map(a=>a.nivel).filter(Boolean))];
  const nivelesSorted = NIVEL_ORDER.filter(n=>nivelesPresent.includes(n));
  const rowN = document.getElementById('row-nivel');
  nivelesSorted.forEach(n=>{
    const b = document.createElement('button');
    b.className='chip'; b.dataset.nivel=n;
    b.textContent = n;
    b.onclick=()=>{ toggleSet(state.nivel, n); render(); };
    rowN.appendChild(b);
  });

  const rowC = document.getElementById('row-cat');
  CATS.forEach(c=>{
    const n = ARCANOS.filter(a=>a.categorias.includes(c)).length;
    if(n===0) return;
    const b = document.createElement('button');
    b.className='chip'; b.dataset.cat=c;
    b.textContent = `${c} (${n})`;
    b.onclick=()=>{ toggleSet(state.cat, c); render(); };
    rowC.appendChild(b);
  });
}

function toggleSet(set, val){
  if(set.has(val)) set.delete(val); else set.add(val);
}

function refreshChipStyles(){
  document.querySelectorAll('.chip[data-fuente]').forEach(el=>{
    el.classList.toggle('active', state.fuente.has(el.dataset.fuente));
  });
  document.querySelectorAll('.chip[data-nivel]').forEach(el=>{
    el.classList.toggle('active', state.nivel.has(el.dataset.nivel));
  });
  document.querySelectorAll('.chip[data-cat]').forEach(el=>{
    el.classList.toggle('active', state.cat.has(el.dataset.cat));
  });
}

function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const nq = norm(q);
  const nt = norm(text);
  let out = '';
  let i = 0;
  let idx;
  while((idx = nt.indexOf(nq, i)) !== -1){
    out += escapeHtml(text.slice(i, idx));
    out += '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>';
    i = idx + q.length;
  }
  out += escapeHtml(text.slice(i));
  return out;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function snippetAround(text, q){
  if(!q) return text.slice(0, 150) + (text.length>150 ? '…' : '');
  const nq = norm(q);
  const nt = norm(text);
  const idx = nt.indexOf(nq);
  if(idx === -1) return text.slice(0,150) + (text.length>150 ? '…' : '');
  const start = Math.max(0, idx - 55);
  const end = Math.min(text.length, idx + q.length + 90);
  return (start>0?'…':'') + text.slice(start, end) + (end<text.length?'…':'');
}

function matches(a, q){
  if(state.fuente.size && !state.fuente.has(a.fuente)) return false;
  if(state.nivel.size && !state.nivel.has(a.nivel)) return false;
  if(state.cat.size && ![...state.cat].every(c=>a.categorias.includes(c))) return false;
  if(!q) return true;
  const nq = norm(q);
  return norm(a.nombre).includes(nq) || norm(a.texto).includes(nq);
}

function render(){
  refreshChipStyles();
  const q = state.q.trim();
  const filtered = ARCANOS.filter(a=>matches(a,q));

  const results = document.getElementById('results');
  const empty = document.getElementById('emptyState');
  results.innerHTML = '';

  document.getElementById('count').innerHTML = q
    ? `<strong>${filtered.length}</strong> resultado${filtered.length!==1?'s':''} para "${escapeHtml(q)}"`
    : `<strong>${filtered.length}</strong> arcano${filtered.length!==1?'s':''}`;

  if(filtered.length===0){
    empty.style.display='block';
    return;
  }
  empty.style.display='none';

  filtered.sort((x,y)=> x.nombre.localeCompare(y.nombre, 'es'));

  const frag = document.createDocumentFragment();
  filtered.forEach(a=>{
    const card = document.createElement('div');
    card.className = 'card' + (state.open.has(a.id) ? ' open' : '');
    card.dataset.id = a.id;

    const tagsHtml = `
      <span class="tag fuente" data-f="${a.fuente}">${a.fuente}</span>
      ${a.nivel ? `<span class="tag nivel">${a.nivel}</span>` : ''}
      ${a.categorias.map(c=>`<span class="tag cat">${c}</span>`).join('')}
    `;

    card.innerHTML = `
      <div class="card-head">
        <div class="card-title-group">
          <p class="card-name">${highlight(a.nombre, q)}</p>
          <div class="tag-row">${tagsHtml}</div>
          <p class="card-snippet">${highlight(snippetAround(a.texto, q), q)}</p>
        </div>
        <span class="expand-ic">✛</span>
      </div>
      <div class="card-full">
        ${a.requisito ? `<p class="req">${escapeHtml(a.requisito)}</p>` : ''}
        <p>${highlight(a.texto, q)}</p>
      </div>
    `;

    card.addEventListener('click', ()=>{
      if(state.open.has(a.id)){ state.open.delete(a.id); }
      else { state.open.add(a.id); }
      card.classList.toggle('open');
    });

    frag.appendChild(card);
  });
  results.appendChild(frag);
}

let debTimer;
document.getElementById('search').addEventListener('input', (e)=>{
  clearTimeout(debTimer);
  const val = e.target.value;
  debTimer = setTimeout(()=>{ state.q = val; render(); }, 90);
});

document.getElementById('clearAll').addEventListener('click', ()=>{
  state.fuente.clear(); state.nivel.clear(); state.cat.clear();
  state.q = '';
  document.getElementById('search').value = '';
  render();
});

document.getElementById('totalCount').textContent = `${ARCANOS.length} arcanos catalogados`;

buildChips();
render();
</script>
</body>
</html>
