tesanía correspondiente (un arma siempre será Forja) a dificultad 9, el conjurador podrá hacer que otra persona pueda manipular el objeto libremente. Por cada grado de éxito podrá seleccionar a una persona adicional (aunque deberán ser nombradas todas durante la realización del ritual)."}, {"id": "Rituales-9", "fuente": "Rituales", "nivel": "Básico", "nombre": "Epoximise", "categorias": ["Ultraje", "Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Arcano de Ultraje. Encantamiento de pegamento. Se usa sobre dos superficies diferentes para que se peguen entre sí, y sean casi imposible de separarse. Cuando dos superficies se hayan pegado, hará falta una tirada de Atletismo a dificultad 18 para ser capaz de separarla. Este ritual no puede usarse en mitad de combate, aunque sí sobre un enemigo derrotado."}, {"id": "Rituales-10", "fuente": "Rituales", "nivel": "Básico", "nombre": "Fermaportus", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento sellador. Cierra mágicamente puertas y cerraduras, de tal manera que no puedan abrirse por medios convencionales. Un mago necesitará usar del hechizo Alohomora u otras variantes para superar la cerradura. Adicionalmente, aumenta la dificultad de las tiradas de Latrocinio mediante esos hechizos y sobre esa cerradura en un grado de éxito."}, {"id": "Rituales-11", "fuente": "Rituales", "nivel": "Básico", "nombre": "Flagrate", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de marca de fuego. Permite crear líneas de fuego con la varita que se quedan en el aire, de tal manera que puede escribir lo que él quiera en el aire. Estas letras no pueden borrarse a no ser que el mago así lo deseen, salvo que se use sobre ellas el encantamiento Deletrius. También se puede marcar cualquier superficie, que adquirirá un aspecto quemado y hendido si se usa este hechizo sobre ello."}, {"id": "Rituales-12", "fuente": "Rituales", "nivel": "Básico", "nombre": "Gamexarum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad Ritual antiplagas. Permite liberar a una zona de las plagas que pudieran habitar en ellas. Si se supera una tirada de Magizoología a dificultad 9, cualquier criatura que se pueda considerar una plaga (Bundimun, Doxys, Duendecillos...) sentirá la necesidad de abandonar el lugar. Además, no podrán volver a entrar de ninguna manera en la zona donde se esté manteniendo el ritual."}, {"id": "Rituales-13", "fuente": "Rituales", "nivel": "Básico", "nombre": "Herbivicus", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Ritual de cuidados de jardín que facilita el crecimiento de las plantas y la vida natural. El jardín atendido con Herbivicus hará que sus plantas crezcan mejor y más fuerte. En un momento de necesidad, un PJ puede declarar que tiene su alijo de ingredientes encantado con Herbivicus. Si hace eso, bloqueará un punto de rituales durante el resto de la aventura. A cambio, recibirá tantos puntos de Pociones como su valor de Herbología (1 si es Novato, 2 Competente, 3 Experto y 4 Maestro). Estos puntos se añaden después de todas las cuentas de otros objetos que otorguen puntos extra, como el Maletín del Pocionista Inquieto."}, {"id": "Rituales-14", "fuente": "Rituales", "nivel": "Básico", "nombre": "Illusia Minoris", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este ritual crea una ilusión menor. Una ilusión menor se considera una que sólo afecta a uno de los sentidos, y un alcance pequeño (por ejemplo, el olor de una rosa, el ruido del corretear de un ratón, una huella apareciendo en el barro). La ilusión durará mientras el conjurador mantenga el ritual. Las ilusiones son especialmente sencillas de conjurar sin llamar la atención, y si se hace una tirada para conjurar sin ser detectado, el uso de este hechizo tiene un bonificador de +2. Una ilusión puede intentar adaptarse después de conjurada, pero si se desea alterar las instrucciones de la ilusión y cambiar sus patrones de movimiento, se puede hacer a cambio de permitir a cualquier testigo repetir la tirada de Consciencia con un bonificador de +2 por cada ocasión."}, {"id": "Rituales-15", "fuente": "Rituales", "nivel": "Básico", "nombre": "Locomotor", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Arcano de Utilidad. Este sencillo ritual sirve para dotar de vida a un objeto para que se mueva de acuerdo a su naturaleza. Para conjurarse, requiere añadir el nombre del objeto al final del hechizo. Ej: Locomotor Baúl."}, {"id": "Rituales-16", "fuente": "Rituales", "nivel": "Básico", "nombre": "Los ojos del muerto | Oculi Morti", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Mago Oscuro 2.", "texto": "Requiere Especialización Mago Oscuro 2. Arcano de Utilidad. Útil y sencillo hechizo de investigación nigromántica. El ritualista hace una tirada de Consciencia. El resultado de esta tirada permitirá saber cuánto tiempo del pasado de la persona se puede revivir: superando un 7 permitirá acceder a los últimos segundos de vida, un 9 a la última escena que experimentó, un 12 será media hora, un 15 una hora, un 18 permitirá revivir tres horas, un 21 seis horas y un resultado de 25 permitirá ver las últimas 24 horas de vida del objetivo. En caso de que los ojos del cadáver estén maltratados o afectados de alguna manera, todas las dificultades aumentan en 2 grados de éxito. Todo se verá desde el punto de vista del difunto, no pudiendo ver nada que los ojos del muerto no captaran."}, {"id": "Rituales-17", "fuente": "Rituales", "nivel": "Básico", "nombre": "Mimble Wimble", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Maldición de lengua atada. Este ritual debe hacerse sobre un objetivo voluntario o un rival derrotado. Después de esta maldición, el objetivo no podrá volver a hablar de un tema y, cada vez que lo intente, se le atará la lengua y se trabará. Este efecto dura hasta que el ritual sea disipado. Se puede intentar hacer este ritual sobre una persona que no esté derrotada ni sea voluntaria, pero se deberá superar una tirada de Intimidación enfrentada al valor pasivo de Frialdad del objetivo, y éste podrá intentar liberarse una vez por escena con una tirada de Frialdad enfrentada al resultado de esa tirada de Intimidación. Si no se está viendo al objetivo ni se posee nada del mismo, la tirada de Intimidación contará con un -4."}, {"id": "Rituales-18", "fuente": "Rituales", "nivel": "Básico", "nombre": "Morsmordre", "categorias": ["Utilidad"], "requisito": "Requiere ser Mortifago Novato.", "texto": "Requiere ser Mortifago Novato. Arcano de Utilidad. Este hechizo lanza un destello de luz hacia el cielo y dibuja la Marca Tenebrosa en el mismo. Esta Marca Tenebrosa es más complicada de borrar que mediante métodos convencionales y contará con un +4 para resistir cualquier magia que busque eliminarla u ocultarla. Toda aquella persona que vea la marca tenebrosa y no sea mortífago deberá superar una tirada de frialdad a dificultad 9 o contar con un penalizador a cualquier tirada. Cada grado de fallo implica un -2 (de 7 a 8 sería -2, de 5 a 6 -4 y 4 o menos -6)."}, {"id": "Rituales-19", "fuente": "Rituales", "nivel": "Básico", "nombre": "Nebulus", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Ritual de niebla. Este ritual cubre una zona de terreno con una densa niebla que impide y dificulta la visibilidad, llenándose poco a poco de una densa capa de niebla. Todas las personas que se encuentren dentro de la niebla sufrirán un penalizador de -2 a todas sus tiradas de Alerta o Investigación para pistas relacionadas con el sentido de la vista, y las personas que se escapen durante la niebla contarán con un +2 a sus tiradas de Sigilo. La tirada de Rituales determinará también la extensión del ritual: superando un 7 cubrirá las inmediaciones del ritualista, con un 9 una estancia entera, con un 12 una casa, con un 15 podrá cubrir un terreno de cientos de metros cuadrados, con 18 podrá llegar a recorrer kilómetros, un 21 cubrirá una ciudad y un 25 podrá llegar a afectar a todo un país."}, {"id": "Rituales-20", "fuente": "Rituales", "nivel": "Básico", "nombre": "Oriéntame", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento brújula. Se usa para que la varita funcione como una brújula y apunte al norte. Si se supera una tirada de Supervivencia con un bonificador de +2 a una dificultad 9, el personaje siempre sabrá dónde se encuentra y cómo orientarse en lugares desconocidos, como para regresar a un campamento o a la civilización. Este efecto durará mientras el personaje mantenga el ritual activo."}, {"id": "Rituales-21", "fuente": "Rituales", "nivel": "Básico", "nombre": "Pericullum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Conjuración de chispas. Conjura una lluvia de chispas hacia el cielo, del color que escoja el conjurador, y que funcionan a modo de bengala. Permite utilizarse para revelar la propia posición a kilómetros de distancia. Estas chispas están especialmente diseñadas para aliados que quieran señalizar o dar aviso de algo, y cualquiera que vea las chispas en el cielo de un amigo podrá dirigirse a ellas superando una tirada de Supervivencia a dificultad 7. En caso de que las chispas las haya conjurado una persona desconocida o un enemigo, la dificultad para localizarle por las chispas será de 12."}, {"id": "Rituales-22", "fuente": "Rituales", "nivel": "Básico", "nombre": "Repello Inimicum", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Ritual defensivo. Traza una línea en el suelo allá por donde vaya recorriendo la varita. Una vez está trazada en el suelo, cualquiera (salvo el propio ritualista) que la atraviese sufrirá automáticamente 8 PAs de daño sin opción de defenderse de ello. Esto sólo sucederá una vez por persona. Se debe realizar una tirada de Rituales a dificultad 7 para afectar a las dos primeras personas que la crucen, añadiendo dos personas más por cada grado de éxito adicional."}, {"id": "Rituales-23", "fuente": "Rituales", "nivel": "Básico", "nombre": "Repello Muggletum", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Ritual antimuggles. Este hechizo vuelve una zona segura de la presencia muggle. A medida que se acercan, los muggles se verán sugestionado y recordarán tener otras cosas que hacer y la abandonan. El ritualista hace una tirada de Subterfugio; esta tirada determinará la extensión máxima del ritual (aunque puede hacerlo menos extenso si quiere): superando un 7 cubrirá el contacto físico directo, con un 9 las inmediaciones del ritualista, con un 12 un par de estancias de distancia, a partir de 15 todo un edificio, con un 18 cubrirá cientos de metros, un 21 cubrirá varios kilómetros, y un 25 cubrirá una ciudad entera."}, {"id": "Rituales-24", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual antiaparición | Captus", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Previene la zona en la que se ha elaborado el ritual (generalmente un terreno del tamaño de una vivienda) de que se pueda usar la Aparición en su interior. Una vez hecho el ritual, el ritualista hace una tirada de Rituales para determinar la extensión del ritual: superando un 7 cubrirá el contacto físico directo, con un 9 las inmediaciones del ritualista, con un 12 un par de estancias de distancia, a partir de 15 todo un edificio, con un 18 cubrirá cientos de metros, un 21 cubrirá varios kilómetros, y un 25 cubrirá una ciudad entera."}, {"id": "Rituales-25", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de castigo menor | Damnum Minoris", "categorias": ["Ultraje"], "requisito": "requiere acción alguna en combate, pero no se podrá realizar dos veces al mismo objetivo en menos de 24 horas ni usar la misma muestra de tejido para dos arcanos distintos.", "texto": "Arcano de Ultraje. Ataque ritualístico mágico menor. El ritual debe elaborarse sobre una persona determinada. Cuando se activan las condiciones del ritual, una sacudida de dolor mágico no demasiado poderoso sacude al objetivo, causándole automáticamente 7 PAs. Para ejecutarse, el ritualista tiene que usar algo del cuerpo del objetivo (pelo, uñas, sangre...). Este ritual puede ejecutarse y quedará inactivo hasta que el mago pronuncie la palabra que haya decidido al ejecutar el arcano, momento en el que se realizará el daño. Decir esta palabra no requiere acción alguna en combate, pero no se podrá realizar dos veces al mismo objetivo en menos de 24 horas ni usar la misma muestra de tejido para dos arcanos distintos. Los puntos de rituales empleados en este arcano no se recuperan a lo largo de la aventura."}, {"id": "Rituales-26", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de codificación | Encriptio", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Ritual de cifrado simple. Este sencillo ritual sirve para provocar justo lo que insinúa su nombre: un pequeño código que oculte el contenido de un mensaje y que sólo se pueda descifrar cuando cualquiera que se acerque al documento pronuncie una contraseña, establecida por el ritualista. Si alguien trata de descifrar el código, deberá superar con una tirada de Consciencia con un penalizador de -4 el valor de 5 + Inteligencia + Cualquier habilidad de Inteligencia del ritualista, esta última tirada representando la manera en que codifica la información."}, {"id": "Rituales-27", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de comunicación | Loquitur", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Ritual que permite la comunicación remota. Este ritual puede realizarse sobre dos objetos que el ritualista tenga en este momento o sobre dos objetos separados con los que éste tenga familiaridad (como puede ser una chimenea o el reflejo de un espejo). El ritualista hace una tirada de Rituales para determinar el alcance de su ritual; ya sea la distancia que estos dos objetos idénticos aguantan, o la distancia a la que puede manifestarse en el objeto familiar: superando un 7 cubrirá una estancia entera, con un 9 una casa, con un 12 podrá cubrir un terreno de cientos de metros, con un 15 podrá alcanzar una extensión de varios kilometros, con 18 podrá llegar a recorrer una ciudad, un 21 cubrirá un país, y un 25 podrá llegar a afectar a todo un continente."}, {"id": "Rituales-28", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de convocación de criatura | Vocatfera", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Magizoólogo 1.", "texto": "Requiere Especialización Magizoólogo 1. Arcano de Utilidad. Ritual que se utiliza para atraer a las proximidades a una criatura mágica. Para realizar este ritual, se debe tener una muestra de una criatura similar a la que quieres atraer (por ejemplo, para atraer a un Nundu deberías tener piel, sangre o pelo de Nundu), y tenerla o no quedará a discreción del master. A la hora de elaborar el ritual, el invocador debe ser concreto con la criatura a la que quiere atraer (cuanta más concreción, más posibilidades hay de que acuda la criatura que deseamos. No es lo mismo convocar un dragón que un Ridgeback Noruego que un Ridgeback Noruego llamado Norberto). Tras eso, se debe hacer una tirada de Magizoología a dificultad variable según la peligrosidad de la criatura (7 por *, 9 por **, 12 por ***, 15 por **** y 18 por *****), y superando con 0 grados de éxito vendrán criaturas que se encuentren a una estancia entera, con un 1 grado una casa, con un 2 grados de éxito podrá cubrir un terreno de cientos de metros, con 3 grados podrá alcanzar una extensión de varios kilómetros, con 4 grados de éxito podrá llegar a recorrer una ciudad, un 5 grados cubrirá un país, y un 6 grados de éxito podrá llegar a afectar a todo un continente."}, {"id": "Rituales-29", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de encantamiento | Malleator", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 1.", "texto": "Requiere Especialización Encantador 1. Arcano de Utilidad. Este ritual puede usarse sobre un objeto para dotarle de una propiedad especial, grabando sobre su superficie alguna runa que le dé una capacidad mágica. Especialmente pensado para el uso en armas, aunque se podría convertir cualquier objeto en una runa con este ritual. El ritualista hace una tirada de Artesanía (Forja). El resultado de esta tirada representará cuántos espacios para runas es capaz de generar en su arma. Un resultado de 9 permitirá añadir un espacio para runas (y una runa a su elección), un 15 permitirá añadir dos espacios para runas (y las runas correspondientes) y un 21 permitirá añadir tres espacios para runas (y las runas correspondientes)."}, {"id": "Rituales-30", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de la Autopsia | Autopsius", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Medimago 1.", "texto": "Requiere Especialización Medimago 1. Arcano de Utilidad. Este sencillo ritual consiste en realizar una autopsia de un cadáver y obtener información de forma más sencilla que sin magia. En el momento de encontrarse ante un fallecido y ejecutar este ritual, se debe hacer una tirada de Medicina. El resultado de esta tirada permitirá averiguar datos del cadáver. Si se saca un 7, se podrá conocer la hora y causa de la muerte exacta. Un 9 revelaría datos físicos sobre el fallecido (sus valores más destacados en Atributos y Habilidades, por ejemplo). Un 12 diría datos médicos adicionales (otras enfermedades y dolencias, su estado de sangre, si tenía algún tipo de maldición que le afectara). Un 15 permitiría conocer otras informaciones relevantes del fallecido (a criterio del master. Por ejemplo, si había estado antes o no al borde de la muerte, si ha tenido algún accidente previo, detalles sobre su estado emocional..). Un 18 permitiría ver una representación visual en la cabeza del forense de las últimas acciones del fallecido antes de morir. Un 21 permitiría ver esa misma representación contando con un entorno a su alrededor e incluso a un posible asesino, de haberlo, pero se vería sin detalles claros (por ejemplo, no se vería el rostro del asesino). Un 25 permitiría ver todos los detalles del resultado anterior."}, {"id": "Rituales-31", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de llamada espiritual | Vocantus", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Mago Oscuro 2.", "texto": "Requiere Especialización Mago Oscuro 2. Arcano de Utilidad. Ritual que se utiliza para atraer a las proximidades a un ser de naturaleza espiritual. Para realizar este ritual, se debe tener una muestra de algo que fuera posesión del fantasma en cuestión, o, en el caso de otro tipo de espíritus, algo que pueda relacionarse con ellos. Poder tener acceso a ese material quedará a discreción del master. A la hora de elaborar el ritual, el invocador debe ser concreto con la aparición a la que quiere atraer (cuanta más concreción, más posibilidades hay de que acuda la aparición que deseamos. No es lo mismo convocar un fantasma, que el fantasma de un alumno, que el fantasma de un joven de Gryffindor llamado Tony). Tras eso, se debe hacer una tirada de Arcanismo. Cuantos más específica sea la búsqueda del ser espiritual en concreto, más complicado es el ritual. Si cualquier fantasma de la zona sirviera, bastaría con un 7, mientras que buscar a la jugadora de quidditch que murió el pasado martes apuñalada podría requerir de un 18 o más, Otra opción es que de igual que alma en pena venga, y solo se busque que sean muchas. En ese caso la dificultad base será 7 (aunque para otros seres espirituales puede aumentar a discreción del master) y cada grado de éxito irá doblando el número de las mismas. Según los grados de éxito que tenga esta tirada, se cubrirá una zona mayor o menor en la llamada. Con 0 grados de éxito vendrán criaturas que se encuentren a una estancia entera, con un 1 grado una casa, con un 2 grados de éxito podrá cubrir un terreno de cientos de metros, con 3 grados podrá alcanzar una extensión de varios kilómetros, con 4 grados de éxito podrá llegar a recorrer una ciudad, un 5 grados cubrirá un país, y un 6 grados de éxito podrá llegar a afectar a todo un continente."}, {"id": "Rituales-32", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de los ojos de la bestia menor | Animalis Oculus Minoris", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Magizoólogo 2.", "texto": "Requiere Especialización Magizoólogo 2. Arcano de Utilidad. Posee de forma psíquica a un animal no mágico o una criatura mágica de peligrosidad *, pudiendo ver y oír lo que esta ve. Para realizar este ritual, se debe tener una muestra de la criatura (pelo, piel, saliva, etc) en concreto. En este estado, el mago tiene los atributos (Atributos y Habilidades) del animal poseído. Adicionalmente, el mago puede intentar manejar al animal y forzarle a tomar alguna decisión que vaya contra su naturaleza: para hacer algo así, se debe superar una tirada de Magizoología (a una dificultad que decidirá el master según lo alejado de su naturaleza, pero como indicativo algo que le ponga en peligro debería ser dificultad 15). Esta tirada tiene éxito automático si el animal es un Compañero Animal canjeado por el mago. Si el animal muere cuando el mago se encuentra dentro de él, éste sufrirá automáticamente una Herida. Este ritual no funciona sobre seres (humanos, fantasmas, elfos, gigantes...), aunque el Ministerio de Magia les haya clasificado como criaturas mágicas (es decir, centauros y gente del agua)."}, {"id": "Rituales-33", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de modificación mental menor | Mutatio Mentis Minoris", "categorias": ["Ultraje"], "requisito": "Requiere Legeremens y Obliviate.", "texto": "Requiere Legeremens y Obliviate. Arcano de Ultraje. Para ejecutar este ritual, el objetivo debe estar inconsciente, derrotado o ser voluntario. El ritualista debe hacer una tirada de Legeremens previa para conocer la mente del objetivo. Después, con cuidado y durante un largo proceso (que es lo que dura la ejecución del ritual), podrá seleccionar algunos de esos recuerdos más superficiales (por ejemplo, qué ha comido ese día, cuál es su color favorito...) y sustituirlo por otro. Este ritual no elimina recuerdos, los altera e introduce nuevos. Ciertos eventos importantes y traumáticos para el objetivo de este ritual pueden desencadenar un intento por recuperar sus recuerdos, para lo que deberá hacer una tirada de Frialdad enfrentada a 5+Carisma+Subterfugio del ritualista. Los efectos de este hechizo se desvanecen si el ritualista deja de concentrarse en el arcano."}, {"id": "Rituales-34", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de ofuscación menor | Celaris Minoris", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este ritual afecta a todo el que se encuentre dentro de un círculo cuando termine de realizarse. La persona o personas afectadas se volverán difíciles de detectar por métodos mágicos, haciendo casi imposible localizarlos en mapas encantados, detectar si incumplen un Tabú o algún otro efecto de detección similar (aunque métodos de investigación muggle, o una mirada directa, no se verán afectados). El ritual aumenta en un grado de éxito la dificultad de todas las tiradas de detección mágica para percibir estas cosas (o, en caso de funcionar mediante tirada enfrentada, da un bonificador de +2 a la tirada de turno). En caso de que la detección mágica no especifique tirada, se deberá hacer una tirada de Consciencia enfrentada al valor de 5 + Destreza + Sigilo (+ este bonificador) de las personas ocultas arcanamente."}, {"id": "Rituales-35", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de permanencia | Permanentia", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Permite vincular un objeto a un lugar o posición determinada. Esto evita que sea movido cómodamente o pueda ser atraído con otros tipos de magias, como Accio. Por ejemplo, puede servir para impedir que un cuadro se descuelgue de la pared, o que alguien convoque un libro de tu biblioteca."}, {"id": "Rituales-36", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de tramitación de expediente | Ex Libris", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Sencillo ritual que se aplica sobre una biblioteca o un archivo. Una vez realizado el encantamiento, el ritualista podrá conocer todos los tomos y libros que hay en una biblioteca en concreto, y una aproximación de su contenido. Si la Biblioteca sobre la que se usa es propia (de un trasfondo canjeado), el ritualista podrá convocar los libros a su mano extendiendo la mano y podrá hacer tantos usos adicionales de Biblioteca en una misión como su valor de la habilidad de dicha biblioteca (1 para Novato, 2 para Competente, 3 para Experto y 4 para Maestro)."}, {"id": "Rituales-37", "fuente": "Rituales", "nivel": "Básico", "nombre": "Ritual de trampa arcana menor | Laqueus Minoris", "categorias": ["Ultraje"], "requisito": "", "texto": "Arcano de Ultraje. Este ritual deja una pequeña marca arcana en un objeto, localización o criatura. Al conjurarse, el mago debe determinar una circunstancia concreta de activación que sea sencilla (\"tocar el objeto\", \"abrir la puerta\", \"pisar la baldosa\", \"acariciar al perro\"). El primer mago que cumpla esas circunstancias de activación hará saltar la trampa y recibirá automáticamente un daño de 7 PAs que no podrá evitar ni atenuar de ninguna manera."}, {"id": "Rituales-38", "fuente": "Rituales", "nivel": "Básico", "nombre": "Sanatore Mínima", "categorias": ["Sanación"], "requisito": "Requiere Especialización Medimago 1.", "texto": "Requiere Especialización Medimago 1. Arcano de Sanación. Envuelve al objetivo en una pequeña aura blanca mientras restaura sus heridas. Al conjurarse este ritual sobre un objetivo, debe hacerse una tirada de Medicina a dificultad 7. En caso de superarse, el ritual estará haciendo efecto durante 7 turnos. Al término de esos 7 turnos, habrá curado completamente una Herida. Por cada grado de éxito por encima que se supere la tirada, se reducirá un turno la duración del ritual. Este hechizo se puede usar sobre uno mismo, aunque, para hacerlo, se debe tener la Especialización Medimago 3."}, {"id": "Rituales-39", "fuente": "Rituales", "nivel": "Básico", "nombre": "Sbond", "categorias": ["Combate"], "requisito": "Requiere ser Ordenista Novato.", "texto": "Requiere ser Ordenista Novato. Arcano de Combate. Sencillo hechizo de marcado que hace aparecer sobre una superficie la marca de un fénix envuelto en llamas. Este hechizo se usa como muestra de fidelidad o como manera de contrarrestar la Marca Tenebrosa por parte de la Orden del Fénix. Toda aquella persona que vea la al fénix y no sea mortífago podrá repetir una única vez cualquier tirada fallada de frialdad que tenga que ver con el coraje."}, {"id": "Rituales-40", "fuente": "Rituales", "nivel": "Básico", "nombre": "Serpensortia", "categorias": ["Combate"], "requisito": "", "texto": "Arcano de Combate. Conjuración de serpiente. Hace aparecer una serpiente de la nada. La serpiente durará convocada tanto tiempo como se mantenga el ritual o hasta que sea derrotada, lo que suceda primero. Su valor de Ataque es de 4, de Iniciativa de 2 y causará 4 PAs de daño si muerde a un objetivo. Se sumará +1 a uno de estos valores si se posee parsel a nivel básico, a dos valores por el nivel intermedio y a los tres si es avanzado (el orden será ataque, iniciativa y daño). Si la serpiente es objetivo de algún hechizo, será derrotada inmediatamente. Se pueden conjurar tantas serpientes como se quiera, siempre que se disponga de suficientes puntos de ritual libres."}, {"id": "Rituales-41", "fuente": "Rituales", "nivel": "Básico", "nombre": "Spongify", "categorias": ["Contrahechizo"], "requisito": "Requiere Especialización Encantador 1.", "texto": "Requiere Especialización Encantador 1. Contrahechizo de Duro Encantamiento de ablandamiento. Se usa sobre objetos o seres vivos para volverlos más blandos y maleables, lo que les hace especialmente frágiles. La mayoría de objetivos que se deforman con este ritual regresarán a su forma original cuando termine el hechizo. También sirve como contrahechizo del efecto Duro."}, {"id": "Rituales-42", "fuente": "Rituales", "nivel": "Básico", "nombre": "Transfiguración de objetos a animales menor | Diversium Animalis Minoris", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este ritual no es un arcano en concreto, más bien una habilidad genérica que puede hacer con distintas formas. Con este ritual , el objetivo puede convertir un objeto en un animal, manteniendo aproximadamente la masa y el volumen. Por ejemplo, podrá convertir una taza en una rata. Sin embargo, estos animales no podrán desarrollar patrones ni actitudes de ser vivo y serán eminentemente decorativos."}, {"id": "Rituales-43", "fuente": "Rituales", "nivel": "Básico", "nombre": "Transformación de objetos menor | Mutatio Minoris", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Esta forma de magia es capaz de alterar la forma de un objeto inanimado por la de otro. Esta transformación será simplemente estética (por ejemplo, podrá convertir la manga de una chaqueta en una espada, pero la espada no funcionará como arma)."}, {"id": "Rituales-44", "fuente": "Rituales", "nivel": "Básico", "nombre": "Transfiguración humana menor | Transfiguratio Minoris", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Este ritual no es un arcano en concreto, más bien una habilidad genérica que puede hacer con distintas formas. Con este ritual, el objetivo puede convertir una parte de su cuerpo en otra similar de un animal a un nivel básico (por ejemplo, convertir su nariz en el morro de un pato), siempre y cuando ésta no tenga ninguna funcionalidad más allá de la pura estética, similar a la capacidad de un metamorfomago."}, {"id": "Rituales-45", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Appare Vestigium", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Ritual de rastreo. El ritualista hace una serie de movimientos de varita y hace una tirada de Investigación a dificultad 12, con un bonificador de +4. Se aumentará a 15 la dificultad si el rastro conduce a varios kilómetros, 18 si se debe rastrear una ciudad de gran tamaño, a 21 si se rastrea por todo el país y a 25 si es por el continente. Si el ritualista supera, ante él se materializan rastros de actividad mágica reciente y movimientos de personas, pudiendo servir para rastrear a cualquiera que haya estado en un lugar determinado con relativa precisión, así como el curso que hayan seguido. Si la persona se está ocultando, se deberá enfrentar la tirada de Investigación de este ritual a la tirada de Sigilo de quien se oculta."}, {"id": "Rituales-46", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Caeca Temporalis", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento desilusionador. Oculta al objetivo del hechizo de estar expuesto a simple vista, mimetizándolo con el entorno como si fuera un camaleón. Si el mago supera una tirada de Sigilo a dificultad 12 y se queda quieto, se volverá completamente invisible e imposible de localizar mientras no se mueva."}, {"id": "Rituales-47", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Climatus", "categorias": ["Utilidad"], "requisito": "Requiere Nebulus.", "texto": "Requiere Nebulus. Arcano de Utilidad. Conjuración climática. Crea un microclima en el lugar deseado. Este hechizo puede provocar pequeñas lluvias, tormentas, nevadas o un sol seco y abrasador incluso en lugares cerrados. Todas las tiradas realizadas dentro de un clima adverso tienen un penalizador natural de -2 (conjurador incluído). Este ritual se puede conjurar inmediatamente, pero permanecerá activo durante toda una escena. La tirada de Rituales determinará también la extensión del ritual: superando un 7 cubrirá las inmediaciones del ritualista, con un 9 una estancia entera, con un 12 una casa, con un 15 podrá cubrir un terreno de cientos de metros cuadrados, con 18 podrá llegar a recorrer kilómetros, un 21 cubrirá una ciudad y un 25 podrá llegar a afectar a todo un país."}, {"id": "Rituales-48", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Engorgio", "categorias": ["Contrahechizo", "Utilidad"], "requisito": "Requiere Crescemultum.", "texto": "Requiere Crescemultum. Arcano de Utilidad. Contrahechizo de Reducio. Hechizo de ampliación. Aumenta masivamente el tamaño de los objetos sobre los que se conjuren, haciéndolos versiones colosales. Por ejemplo, podría ampliar el tamaño de un coche hasta tener el de una mansión. Este aumento de tamaño podría traer consecuencias mecánicas a discreción del master como aumentar el daño de un arma o lograr una mejor cobertura en un callejón. Si se lanza en combate (como al arma del enemigo) requerirá tirada de impacto de manera normal. Este ritual también puede aplicar el efecto de Crescemultum, pero sobre seres humanos voluntarios. También funciona como contrahechizo de Reducio."}, {"id": "Rituales-49", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Evanesco", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Complejo ritual que funciona sólo sobre objetos para hacerlos invisibles. Es imposible encontrar un objeto ocultado con Evanesco a simple vista, y requerirá que cualquier tirada de una habilidad de Percepción para localizar o encontrar el objeto supere al menos dos grados de éxito más que de costumbre para encontrarlo. El objeto permanecerá invisible mientras se mantenga el ritual."}, {"id": "Rituales-50", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Geminio", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento multiplicador. Encanta un objeto para que, cada vez que se toque, éste se multiplique. Los duendes de Gringotts tienen un encantamiento para evitar ser estafados con este hechizo. Hacerse con el objeto que esté encantado con este ritual requerirá superar una tirada de Destreza a dificultad 9. Es ideal como medida disuasoria y para ganar tiempo."}, {"id": "Rituales-51", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Homonculous", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Arcano de Utilidad. Este ritual se lanza sobre un mapa o dibujo de una localización en la que se encuentra el ritualista (el dibujo puede dibujarse a mano y ser aproximado, pero debe ser fiel a la realidad. Por ejemplo, si una casa tiene una estancia secreta y no se incluye en el mapa, todo el que esté en esa estancia secreta será inmune). Desde ese momento y en adelante, el mapa dibuja etiquetas con los nombres de las personas que hay en su interior, y éstas comienzan a moverse por su superficie imitando los movimientos de esas personas. En caso de que alguien se encuentre escondido bajo algún medio de ocultación mágica, el ritualista deberá superar la tirada de ocultación (generalmente de sigilo) de dicha persona con una tirada enfrentada de Supervivencia propia, para ser capaz de que su magia lo reconozca e incluya en el mapa. El ritualista cuenta con un +4 a esta tirada de Supervivencia."}, {"id": "Rituales-52", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Illusia", "categorias": ["Utilidad"], "requisito": "Requiere Illusia Minoris.", "texto": "Requiere Illusia Minoris. Arcano de Utilidad. Este ritual crea una ilusión intermedia. Una ilusión intermedia se considera una que afecta a dos de los cinco sentidos, y que tiene un tamaño o un alcance medio (por ejemplo, la imagen y el sonido de un león rugiendo entre los árboles, o el sabor y el color de una poción determinada). La ilusión durará mientras el conjurador mantenga el ritual. Las ilusiones son especialmente sencillas de conjurar sin llamar la atención, y si se hace una tirada para conjurar sin ser detectado, el uso de este hechizo tiene un bonificador de +2. Una ilusión puede intentar adaptarse después de conjurada, pero si se desea alterar las instrucciones de la ilusión y cambiar sus patrones de movimiento, se puede hacer a cambio de permitir a cualquier testigo repetir la tirada de Consciencia con un bonificador de +2 por cada ocasión."}, {"id": "Rituales-53", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Juramento Inquebrantable", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Sella un contrato mágico entre dos personas cuyo incumplimiento provoca la muerte. A medida que las partes se comprometen a cada una de las cláusulas, una pequeña llama brillante sale de la varita del mago testigo y rodea las manos y brazos de los contratantes. Quien conozca este ritual puede ser a partes iguales testigo y parte del Juramento (pero no ambas a la vez). Al realizarse este arcano, se bloquearán los puntos de ritual utilizados durante el resto de la aventura. Este ritual puede durar años y no puede disiparse (aunque los puntos de ritual solo quedarán bloqueados durante la aventura que se realizó)."}, {"id": "Rituales-54", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Morsdicit", "categorias": ["Utilidad"], "requisito": "Requiere ser Mortifago Experto.", "texto": "Requiere ser Mortifago Experto. Arcano de Utilidad. Este ritual no requiere de componente verbal. Se aprieta la varita contra la Marca Tenebrosa que todo mortifago lleva para realizarlo. Tras esto, el conjurador tendrá que pensar en otros mortífagos concretos. Cualquiera de los mortifagos puede tratar de superar una tirada de Consciencia a dificultad 12 para poder ver una imagen mental de con quién está hablando, con un 15 podrá ver también su entorno mientras que con un 18 o más la conversación podrá ser mental. El conjurador del conjuro contará con un +7 a esta tirada. No se podrá usar este arcano en combate."}, {"id": "Rituales-55", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Muffliato", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Encantamiento de aislamiento sonoro. Genera un zumbido y un pitido en las orejas de la gente en un lugar escogido, haciendo muy difícil escuchar conversaciones de quien lo usa. Cualquiera que intente escuchar una conversación oculta bajo este hechizo tendrá que superar dos grados de éxito más en su tirada de Alerta. Si no estás intentando escuchar específicamente la conversación, no hay manera de detectarla pasivamente."}, {"id": "Rituales-56", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Planta Vitae", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Permite hacer crecer de forma acelerada semillas de plantas de un modo más avanzado, pudiendo estas ser utilizadas como ingrediente de pociones, herbología, etc. Este ritual dará al personaje que lo canjee tantos Puntos de Pociones adicionales como su nivel en la habilidad de Rituales (1 si es Novato, 2 Competente, 3 Experto y 4 Maestro)."}, {"id": "Rituales-57", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Portus Mínima", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Arcano de Utilidad. Convierte un objeto en un traslador. Este traslador debe tener una hora predeterminada a la que activarse en el momento de conjurar el hechizo. El traslador debe tardar al menos dos horas desde que se conjura hasta su hora de activación. Hasta activarse, el conjurador mantendrá activos los puntos de ritual de Portus Mínima."}, {"id": "Rituales-58", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Proteico", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 1.", "texto": "Requiere Especialización Encantador 1. Arcano de Utilidad. Encantamiento imitador. Se utiliza sobre varios objetos idénticos (o lo suficientemente parecidos). En cuanto uno de dichos objetos se modifique, todos los demás se modificarán acordemente. El ritualista puede unir tantos objetos como su valor de Percepción al mismo tiempo en un uso de este ritual. Para vincular más objetos, necesitará hacer más usos de Proteico."}, {"id": "Rituales-59", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Reducio", "categorias": ["Contrahechizo", "Utilidad"], "requisito": "Requiere Dimminuendo.", "texto": "Requiere Dimminuendo. Arcano de Utilidad. Contrahechizo de Engorgio. Encantamiento reductor. Encoge masivamente el tamaño de los objetos sobre los que se conjure, haciéndolos versiones ínfimas de esos objetos. Por ejemplo, podría encoger el tamaño de un coche hasta que pareciera uno de juguete capaz de llevarse en un bolsillo o en un llavero. Esta disminución de tamaño podría traer consecuencias mecánicas a discreción del master como reducir el daño de un arma o lograr una peor cobertura en un callejón. Si se lanza en combate (como al arma del enemigo) requerirá tirada de impacto de manera normal.Este ritual también puede aplicar el efecto de Dimminuendo, pero sobre seres humanos voluntarios. Puede usarse como contrahechizo de Engorgio."}, {"id": "Rituales-60", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual clarividencia | Procul Visio", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. El ritualista debe cerrar los ojos mientras hace el ritual y concentrarse en una persona o una localización. Tras hacerlo, podrá abrir los ojos y hacer una tirada de Consciencia para intentar observar el lugar o a la persona a través de la distancia, como si estuviera viéndolo desde una vista de pájaro. Esta tirada tendrá modificadores en función de si se posee algo de la otra persona o el grado de familiaridad con ella: desde un -4 si se trata de un completo desconocido, hasta un +1 con familiaridad moderada (conocerlo), un +2 si se tiene una propiedad de la misma, un +4 si es una familiaridad sentimental (amigos muy cercanos o familia) o un +7 si se cuenta con algo de su cuerpo. La dificultad de esta tirada determinará el alcance del ritual: superando un 7 cubrirá las inmediaciones del ritualista, con un 9 una estancia entera, con un 12 una casa, con un 15 podrá cubrir un terreno de cientos de metros cuadrados, con 18 podrá llegar a recorrer kilómetros, un 21 cubrirá una ciudad y un 25 podrá llegar a afectar a todo un país."}, {"id": "Rituales-61", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de castigo | Damnum", "categorias": ["Ultraje"], "requisito": "Requiere Ritual de castigo menor.", "texto": "Requiere Ritual de castigo menor. Arcano de Ultraje. Ataque ritualístico mágico menor. El ritual debe elaborarse sobre una persona determinada. Cuando se activan las condiciones del ritual, una sacudida de dolor mágico no demasiado poderoso sacude al objetivo, causándole automáticamente 14 PAs. Para ejecutarse, el ritualista tiene que usar algo del cuerpo del objetivo (pelo, uñas, sangre...). Este ritual puede ejecutarse y quedará inactivo hasta que el mago pronuncie la palabra que haya decidido al ejecutar el arcano, momento en el que se realizará el daño. Decir esta palabra no requiere acción alguna en combate, pero no se podrá realizar dos veces al mismo objetivo en menos de 24 horas ni usar la misma muestra de tejido para dos arcanos distintos. Los puntos de rituales empleados en este arcano no se recuperan a lo largo de la aventura."}, {"id": "Rituales-62", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de cerradura arcana | Fermaportus Máxima", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2, Fermaportus y Reparo.", "texto": "Requiere Especialización Encantador 2, Fermaportus y Reparo. Arcano de Utilidad. Este ritual de cerrado de puertas es en realidad un todo en uno para aumentar la seguridad de cualquier cerradura. Al aplicarse sobre una cerradura, aumenta la dificultad de las tiradas de Latrocinio mediante esos hechizos y sobre esa cerradura en dos grados de éxito, y sólo podrá abrirse por métodos mágicos (como con el hechizo Alohomora). Además, la puerta contiene un interesante encantamiento adicional que hace que, cada vez que sea destruída por la fuerza física o mágica se repare por sí misma. Cuando la cerradura sea destruida por un arcano básico o intermedio, este proceso será automático. Si es destruida por un arcano avanzado, el asaltante tendrá que realizar una tirada de Poder a dificultad 12. Si falla la cerradura se repará inmediatamente pero si la supera la puerta tardará en repararse un turno, más un turno extra por cada grado de éxito."}, {"id": "Rituales-63", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de comunicación mental | Loquitur Máxima", "categorias": ["Utilidad"], "requisito": "Requiere Ritual de comunicación.", "texto": "Requiere Ritual de comunicación. Arcano de Utilidad. Este ritual establece una conexión mediante la magia de las mentes de las personas que estén en la zona. Mientras la comunicación esté activa, la gente que es parte del ritual tendrá un penalizador de -1 a todas sus acciones, activas y pasivas, y el ritualista lo tendrá de -1 por cada persona, aparte de él, que sea parte del vínculo telepático. Al ejecutarlo, el ritualista hará una tirada de Empatía. En función del resultado, la zona de comunicación aumentará una distancia mayor superando un 7 las inmediaciones del ritualista, con un 9 un par de estancias de distancia, con un 12 todo un edificio, a partir de 15 cubrirá cientos de metros, con un 18 cubrirá varios kilómetros, un 21 cubrirá una ciudad entera y 25 alcanzará un país entero."}, {"id": "Rituales-64", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de encierro de Criatura | Custotfera", "categorias": [], "requisito": "Requiere Magizoólogo 1.", "texto": "Requiere Magizoólogo 1. Este ritual dibuja una serie de marcas en el suelo creando una zona mágica de la que no podrá escapar un ser de físico (normalmente una criatura o animal, aunque también afecta a seres). Tienen permitida la entrada, pero no la salida. La zona será, por defecto, de unos 10 metros de diámetro, La prisión resistirá hasta un total de 24 impactos de naturaleza físico, pero cualquier otro tipo de ataque físico o lanzado con una varita ignorará la prisión como si no existiera (ya sea lanzado desde el interior o el exterior). Salvo que se especifique lo contrario, los ataques de las criaturas contarán por un impacto por cada nivel de peligrosidad según la clasificación de estrellas mientras que los ataques de los seres (incluidos los humanos) irán en función del master (normalmente 1 o 2 impactos). Para conjurar la prisión alrededor de un objetivo se requerirá que entre voluntariamente (o a través de engaños), que se convoque a dicha criatura mágicamente a su interior, si es una criatura o animal y sus PAs han llegado a cero y logrando una tirada de Ataque o como última opción superar una tirada de Magizoología a Dificultad 9 por *, 12 por **, 15 por ***, 18 por **** y 21 por *****. Contra seres este ritual no puede usarse y no tiene efecto en combate, aunque sí sobre un enemigo derrotado o que no se lo espere (en cuyo caso su Defensa se calcularía con Voluntad + Frialdad en vez de Destreza + Esquivar)."}, {"id": "Rituales-65", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de encierro espiritual | Custontus", "categorias": [], "requisito": "Requiere Mago Oscuro 2.", "texto": "Requiere Mago Oscuro 2. Este ritual dibuja una serie de marcas en el suelo creando una zona mágica de la que no podrá escapar un ser de naturaleza espiritual (un fantasma, un familiar, un espectro, un no-ser etc). Tienen permitida la entrada, pero no la salida. La zona será, por defecto, de unos 10 metros de diámetro, La prisión resistirá hasta un total de 24 impactos de naturaleza espiritual, pero cualquier otro tipo de ataque físico o lanzado con una varita ignorará la prisión como si no existiera (ya sea lanzado desde el interior o el exterior). Salvo que se especifique lo contrario, los ataques de los seres espirituales contarán por un impacto por cada nivel de peligrosidad utilizando una analogía similar a las criaturas mágicas: la mayoría de fantasmas *, la mayoría de los familiares **, la mayoría de los espectros o elementales ***, aquellos seres espirituales y no-seres de nivel medio**** y aquellos seres espirituales y no-seres más poderosos*****. Para conjurar la prisión alrededor de un objetivo se requerirá que entre voluntariamente (o a través de engaños), que se invoque a dicho ser directamente en su interior, que sus PAs hayan llegado a cero y logrando una tirada de Ataque o como última opción superar una tirada de Arcanismo a Dificultad 9 por *, 12 por **, 15 por ***, 18 por **** y 21 por *****."}, {"id": "Rituales-66", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de infortunio | Infortunii", "categorias": [], "requisito": "", "texto": "Ritual inspirado en la Felix Felicis que altera las reglas y leyes de la probabilidad para perjudicar a la víctima del ritualista. La víctima parecerá particularmente torpe en tareas complejas y fallará en los asuntos más específicos y complicados, relegado a hacer tareas un poco más simples. Para ejecutarse, el ritualista tiene que usar algo del cuerpo del objetivo (pelo, uñas, sangre...). Si es un PJ, éste no podrá hacer uso de sus Puntos de Destino para \"Forzar el Destino\" o \"Imponerse al Destino\", mientras que si es un PNJ el primer uso de cualquier Punto de Destino en las modalidades anteriores será gratuito contra él."}, {"id": "Rituales-67", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de ofuscación intermedio | Celaris", "categorias": ["Utilidad"], "requisito": "Requiere Celaris Minoris.", "texto": "Requiere Celaris Minoris. Arcano de Utilidad. Este ritual afecta a todo el que se encuentre dentro de un círculo cuando termine de realizarse. La persona o personas afectadas se volverán difíciles de detectar por métodos mágicos, haciendo casi imposible localizarlos en mapas encantados, detectar si incumplen un Tabú o algún otro efecto de detección similar (aunque métodos de investigación muggle, o una mirada directa, no se verán afectados). El ritual aumenta en dos grados de éxito la dificultad de todas las tiradas de detección mágica para percibir estas cosas (o, en caso de funcionar mediante tirada enfrentada, da un bonificador de +4 a la tirada de turno). En caso de que la detección mágica no especifique tirada, se deberá hacer una tirada de Consciencia enfrentada al valor de 5 + Destreza + Sigilo (+ este bonificador) de las personas ocultas arcanamente."}, {"id": "Rituales-68", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de los ojos de la bestia | Animalis Oculis", "categorias": ["Utilidad"], "requisito": "Requiere Animalis Oculis Minoris.", "texto": "Requiere Animalis Oculis Minoris. Arcano de Utilidad. Posee de forma psíquica a una criatura mágica de peligrosidad ** o ***, pudiendo ver y oír lo que esta ve. Para realizar este ritual, se debe tener una muestra de la criatura (pelo, piel, saliva, etc) en concreto. En este estado, el mago tiene los atributos (Atributos y Habilidades) del animal poseído. Adicionalmente, el mago puede intentar manejar al animal y forzarle a tomar alguna decisión que vaya contra su naturaleza: para hacer algo así, se debe superar una tirada de Magizoología(a una dificultad que decidirá el master según lo alejado de su naturaleza, pero como indicativo algo que le ponga en peligro debería ser dificultad 15). Esta tirada tiene éxito automático si el animal es un Compañero Animal canjeado por el mago. Si el animal muere cuando el mago se encuentra dentro de él, sufrirá automáticamente una Herida. Este ritual no funciona sobre seres (humanos, fantasmas, elfos, gigantes...), aunque el Ministerio de Magia les haya clasificado como criaturas mágicas (es decir, centauros y gente del agua)."}, {"id": "Rituales-69", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de modificación mental | Mutatio Mentis", "categorias": ["Ultraje"], "requisito": "Requiere Mutatio Mentis Minoris.", "texto": "Requiere Mutatio Mentis Minoris. Arcano de Ultraje. Para ejecutar este ritual, el objetivo debe estar inconsciente, derrotado o ser voluntario. El ritualista debe hacer una tirada de Legeremens previa para conocer la mente del objetivo. Después, con cuidado y durante un largo proceso (que es lo que dura la ejecución del ritual), podrá seleccionar algunos de los recuerdos del objetivo que no estén anclados a su personalidad, pero tampoco sean completamente superficiales (por ejemplo, la identidad de algunos amigos del pasado, o alguna experiencia destacada del trabajo) y sustituirlo por otro. Este ritual no elimina recuerdos, los altera e introduce nuevos. Ciertos eventos importantes y traumáticos para el objetivo de este ritual pueden desencadenar un intento por recuperar sus recuerdos, para lo que deberá hacer una tirada de Frialdad enfrentada a 5+Carisma+Subterfugio del ritualista. Los efectos de este hechizo se desvanecen si el mago deja de concentrarse en el ritual."}, {"id": "Rituales-70", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual de trampa arcana | Laqueus", "categorias": ["Ultraje"], "requisito": "Requiere Laqueus Minoris.", "texto": "Requiere Laqueus Minoris. Arcano de Ultraje. Este ritual deja una pequeña marca arcana en un objeto, localización o criatura. Al conjurarse, el mago debe determinar una circunstancia concreta de activación que sea sencilla (\"tocar el objeto\", \"abrir la puerta\", \"pisar la baldosa\", \"acariciar al perro\"). El primer mago que cumpla esas circunstancias de activación hará saltar la trampa y recibirá automáticamente un daño de 14 PAs que no podrá evitar ni atenuar de ninguna manera."}, {"id": "Rituales-71", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Ritual simple de extensión indetectable | Magnus Interna", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Arcano de Utilidad. Encantamiento de extensión indetectable. Este ritual permite aumentar las dimensiones internas de un objeto pequeño, sin alterar su tamaño exterior. Si se posee este ritual, pueden tenerse los beneficios mecánicos y narrativos de un saco de piel de moke sin necesidad de canjear éste, o dotar a los aliados de efectos similares, pero deben gastarse los puntos de rituales correspondientes por cada aliado beneficiado por este efecto mágico."}, {"id": "Rituales-72", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Sanatore", "categorias": ["Sanación"], "requisito": "Requiere Sanatore Mínima.", "texto": "Requiere Sanatore Mínima. Arcano de Sanación. Envuelve al objetivo en una brillante aura blanca mientras restaura sus heridas. Al conjurarse este ritual sobre un objetivo, debe hacerse una tirada de Medicina a dificultad 9. En caso de superarse, el ritual estará haciendo efecto durante 7 turnos. Al término de esos 7 turnos, habrá curado completamente dos Heridas. Por cada grado de éxito por encima que se supere la tirada, se reducirá un turno la duración del ritual. Este hechizo se puede usar sobre uno mismo, aunque, para hacerlo, se debe tener la Especialización Medimago 3."}, {"id": "Rituales-73", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Tabú", "categorias": ["Utilidad"], "requisito": "", "texto": "Arcano de Utilidad. Se realiza sobre una palabra concreta, que quedará encantada. A partir de ese momento, cada vez que se pronuncie esa palabra, el ritualista sabrá dónde se ha pronunciado. El alcance de este ritual se medirá en función de la tirada de elaboración del ritual: superando un 7 cubrirá una estancia entera, con un 9 una casa, con un 12 podrá cubrir un terreno de cientos de metros, con un 15 podrá alcanzar una extensión de varios kilometros, con 18 podrá llegar a recorrer una ciudad, un 21 cubrirá un país, y un 25 podrá llegar a afectar a todo un continente."}, {"id": "Rituales-74", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Transfiguración de objetos a animales medianos | Diversium Animalis", "categorias": ["Utilidad"], "requisito": "Requiere Diversium Animalis Minoris.", "texto": "Requiere Diversium Animalis Minoris. Arcano de Utilidad. Este ritual no es un arcano en concreto, más bien una habilidad genérica que puede hacer con distintas formas. Con este ritual , el objetivo puede convertir un objeto en un animal, manteniendo aproximadamente la masa y el volumen. Por ejemplo, podrá convertir un armario en un león. Estos animales pueden ser, a todas luces, seres vivos, aunque no pueden tener propiedades mágicas."}, {"id": "Rituales-75", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Transformación de objetos medianos | Mutatio", "categorias": ["Utilidad"], "requisito": "Requiere Mutatio Minoris.", "texto": "Requiere Mutatio Minoris. Arcano de Utilidad. Esta forma de magia es capaz de alterar la forma de un objeto inanimado por la de otro que mantenga aproximadamente masa y tamaño. Este objeto puede ser completamente funcional, aunque carecer de propiedades mágicas. Por ejemplo, podría convertir un armario en una motocicleta que podría ser conducida libremente."}, {"id": "Rituales-76", "fuente": "Rituales", "nivel": "Intermedio", "nombre": "Transfiguración humana intermedia | Transfiguratio", "categorias": ["Utilidad"], "requisito": "Requiere Transfiguratio Minoris.", "texto": "Requiere Transfiguratio Minoris. Arcano de Utilidad. Este ritual no es un arcano en concreto, más bien una habilidad genérica que puede hacer con distintas formas. Con este ritual, el objetivo puede convertir partes completas de su organismo en las de otros animales (por ejemplo, convertir su cabeza en la de un tiburón, o convertir sus manos en garras), con las funciones completas, siempre que no haya propiedades mágicas involucradas."}, {"id": "Rituales-77", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Artus Argentum", "categorias": ["Utilidad"], "requisito": "Requiere Poder 5.", "texto": "Requiere Poder 5. Arcano de Utilidad. Este poderoso arcano permite al conjurador crear una réplica de plata de un miembro perdido, siempre que no sea del propio conjurador. Al momento de conjurar este hechizo, el conjurador debe pensar en una condición para la existencia del miembro (que puede o no comunicar al objetivo del hechizo). Esta condición debe poder expresarse en una frase simple y no muy larga. Si la condición no se respeta, se deberá hacer una tirada de Voluntad del dueño de dicha extremidad contra el 5+Poder+4 del ritualista que creo el miembro. Si se falla la tirada, el miembro se revela y el mago debe desprenderse de él o sufrir las consecuencias. Estas consecuencias van desde molestias (si se falla por un punto) hasta la muerte (si se falla por 4 o más puntos) y una vez que se activan no ya se pararán aunque el afectado se desaga del miembro. Este miembro puede volverse permanente si el conjurador lo mantiene como ritual activo durante toda la aventura o, en su defecto, una semana o más."}, {"id": "Rituales-78", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Aurorium", "categorias": ["Utilidad"], "requisito": "Requiere Poder 7.", "texto": "Requiere Poder 7. Arcano de Utilidad. Complicado arcano desarrollado por Lord Voldemort para volvar sin varita. Envuelve la parte inferior del cuerpo del conjurador, transformándolo en un humo negro. El objetivo es capaz de moverse en el aire, con todo lo que eso implica. Para maniobrar o desplazarse de esta forma, utilizará tiradas de Vuelo, tal y como si lo hiciera en escoba ya que alcanza velocidades similares."}, {"id": "Rituales-79", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Fidelio", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 2.", "texto": "Requiere Especialización Encantador 2. Arcano de Utilidad. Ritual de ocultación. Convierte aquello sobre lo que se conjura en un secreto que desaparece del mundo. Para realizar este ritual, debe tenerse el objeto o localización sobre la que se desea ejecutar. Durante el ritual, el mago designará un Guardián del Secreto (que no puede ser él mismo), que es quien podrá revelar el secreto a otras personas. Puede nombrar más de un Guardián Secreto si lo desea. Esta revelación debe ser voluntaria y no puede ser obtenida por medios como el veritaserum, la legeremancia o la tortura (aunque sí por medio del soborno o el chantaje). A la muerte de un Guardián Secreto, todas aquellas personas a las que este les hubiera revelado aquello que se ocultaba se convertirán automáticamente en los nuevos Guardianes Secretos. Una vez todos los Guardianes del Secreto mueren, la información se vuelve pública. Este es uno de los pocos rituales que dura permanentemente, una vez se ha realizado (aunque el gasto de Puntos de Ritual solo se tiene en cuenta en la aventura en la que se gastó). Este ritual no se puede disipar."}, {"id": "Rituales-80", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Illusia Maxima", "categorias": ["Utilidad"], "requisito": "Requiere Illusia.", "texto": "Requiere Illusia. Arcano de Utilidad.Este hechizo crea una ilusión compleja. Una ilusión compleja se considera una que puede afectar a los cinco sentidos, y que prácticamente sólo tiene como límite la imaginación del conjurador (por ejemplo, un dragón sobrevolando la escena al que se puede ver, contra el que chocan hechizos y que desprende calor).La ilusión durará mientras el conjurador mantenga el ritual. Las ilusiones son especialmente sencillas de conjurar sin llamar la atención, y si se hace una tirada para conjurar sin ser detectado, el uso de este hechizo tiene un bonificador de +2. Una ilusión puede intentar adaptarse después de conjurada, pero si se desea alterar las instrucciones de la ilusión y cambiar sus patrones de movimiento, se puede hacer a cambio de permitir a cualquier testigo repetir la tirada de Consciencia con un bonificador de +2 por cada ocasión."}, {"id": "Rituales-81", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Inferi", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Mago Oscuro 2.", "texto": "Requiere Especialización Mago Oscuro 2. Arcano de Utilidad. Máxima expresión de nigromancia. El ritual permite crear un inferius de un cadáver. Este inferius servirá al mago que posea el ritual, hasta su destrucción o hasta que éste desee dejar de invertir los puntos de ritual necesarios. El ritualista realizará una tirada de Rituales para decidir cuan fuerte es el inferius levantado. Con un resultado de 7, se obtendrá un Reanimado Torpe, con un 12 será un Reanimado Común y con un 18 un Reanimado de Combate. En caso de que el ritualista no esté conforme con el resultado obtenido y desee deshacerlo para probar nuevamente, los puntos de rituales invertidos permanecerán bloqueados durante 5 turnos."}, {"id": "Rituales-82", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Locomotor Maxima", "categorias": ["Utilidad"], "requisito": "Requiere Locomotor.", "texto": "Requiere Locomotor. Arcano de Utilidad. Este hechizo permite animar formas complejas para que lleven a cabo acciones complejas. Por ejemplo, permite que una estatua actúe de acuerdo a una serie de instrucciones determinadas. Algunos usos de este hechizo tienen nombres propios y encantaciones únicas (como Mobiliarbus para animar árboles), pero son distintas variaciones de este hechizo. Este gólem servirá al mago que posea el ritual, hasta su destrucción o hasta que éste desee dejar de invertir los puntos de ritual necesarios. El ritualista realizará una tirada de Rituales para decidir cuan fuerte es el inferius levantado. Con un resultado de 7, se obtendrá un Reanimado Torpe, con un 12 será un Reanimado Común, con un 15 será un Reanimado de Cámara y con un 18 un Reanimado de Combate. En caso de que el ritualista no esté conforme con el resultado obtenido y desee deshacerlo par probar nuevamente, los puntos de rituales invertidos permanecerán bloqueados durante 6 turnos."}, {"id": "Rituales-83", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Maldición", "categorias": [], "requisito": "Requiere Poder 7.", "texto": "Requiere Poder 7. Ésta es la forma más poderosa de maldiciones. Realizar esta Maldición puede cambiar el mundo mágico. No hay reglas determinadas para la ejecución de este ritual (usarlo debería ser algo establecido entre el master y el jugador), sólo ejemplos: Lord Voldemort, en un uso especialmente brillante de esta maldición, impidió que ningún profesor durara en el cargo de DCAO eternamente. Cuanto mayor sea la tirada, más poderosa y duradera será la maldición. No puede usarse fuera de misiones contra otros PJs sin su consentimiento expreso. Los puntos en rituales quedarán bloqueados durante toda la aventura en la que se use, sin posibilidad de recuperarlos de ningún modo, pero no así en otras aventuras."}, {"id": "Rituales-84", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Portus", "categorias": ["Utilidad"], "requisito": "Requiere Portus Mínima.", "texto": "Requiere Portus Mínima. Arcano de Utilidad. Convierte un objeto en un traslador. Este traslador se activará en cuanto el conjurador lo desee utilizar, sin necesidad de esperar a una hora concreta.Hasta activarse, el conjurador mantendrá activos los puntos de ritual de Portus.."}, {"id": "Rituales-85", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Protego Diabólica", "categorias": ["Utilidad"], "requisito": "Requiere Poder 7 y Fiendfyre.", "texto": "Requiere Poder 7 y Fiendfyre. Arcano de Utilidad. Ritual de magia oscura. Al contrario que otros rituales protectores, este ritual se conjura inmediatamente con un movimiento de varita, y mientras está activo solo permite utilizar los arcanos de la cadena Diabólica. Crea un poderoso círculo de fuego de llamas azules. Estas llamas azules son extremadamente letales: aquellas personas que el conjurador permita o cumplan con unas condiciones podrán atravesarlo, y el resto fallecerán calcinados. Algunas criaturas o magos particularmente hábiles podrán sobrevolar el círculo o acceder de otra manera superando una tirada de Atletismo (o el equivalente en un ser mágico) a una dificultad enfrentada al valor pasivo de Rituales del mago."}, {"id": "Rituales-86", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de castigo mayor| Damnum Mayoris", "categorias": ["Ultraje"], "requisito": "Requiere Ritual de castigo.", "texto": "Requiere Ritual de castigo. Arcano de Ultraje. Ataque ritualístico mágico menor. El ritual debe elaborarse sobre una persona determinada. Cuando se activan las condiciones del ritual, una sacudida de dolor mágico no demasiado poderoso sacude al objetivo, causándole automáticamente 21 PAs. Para ejecutarse, el ritualista tiene que usar algo del cuerpo del objetivo (pelo, uñas, sangre...). Este ritual puede ejecutarse y quedará inactivo hasta que el mago pronuncie la palabra que haya decidido al ejecutar el arcano, momento en el que se realizará el daño. Decir esta palabra no requiere acción alguna en combate, pero no se podrá realizar dos veces al mismo objetivo en menos de 24 horas ni usar la misma muestra de tejido para dos arcanos distintos. Los puntos de rituales empleados en este arcano no se recuperan a lo largo de la aventura."}, {"id": "Rituales-87", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de la forja duendigozna | Malleator Maxima", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Encantador 3 y Malleator.", "texto": "Requiere Especialización Encantador 3 y Malleator. Arcano de Utilidad. Este ritual es la mayor forma de magia para usar sobre objetos, uno de los secretos de los mayores artesanos mágicos. Permite dotar de verdaderas proezas mágicas a cualquier objeto convencional. Este ritual permite modificar Objetos Inventados ya existentes y añadirles nuevas opciones y efectos hasta crear objetos auténticamente poderosos, en vez de canjear objetos nuevos. Además de eso, puede usarse como una versión más avanzada de Malleator. Al usarlo, el ritualista hace una tirada de Artesanía que más adecuada resulte (para armas será Forja). El resultado de esta tirada representará cuántos espacios para runas es capaz de generar en su arma. Un resultado de 9 permitirá añadir un espacio para runas (y una runa a su elección), y cada grado de éxito posterior permitirá añadir un espacio para runas adicional y una runa extra a su elección, hasta un máximo de seis espacios extra a dificultad 25. En caso de usarse sobre un objeto mágico se le permitirá añadir un efecto mágico básico si se supera una tirada de 12, un efecto intermedio con un 15 y un efecto avanzado con un 18 en dicha tirada. Cada grado de éxito adicional permite añadir un efecto avanzado adicional (o dos imntermdios o cuatro básicos)."}, {"id": "Rituales-88", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de modificación mental mayor | Mutatio Mentis Mayoris", "categorias": ["Ultraje"], "requisito": "Requiere Mutatio Mentis.", "texto": "Requiere Mutatio Mentis. Arcano de Ultraje. Para ejecutar este ritual, el objetivo debe estar inconsciente, derrotado o ser voluntario. El ritualista debe hacer una tirada de Legeremens previa para conocer la mente del objetivo. Después, con cuidado y durante un largo proceso (que es lo que dura la ejecución del ritual), podrá seleccionar cualquier recuerdo, sea lo profundo e importante que sea (por ejemplo, el hecho de tener un hijo o una mujer, o incluso convertir a un mortífago y racista convencido en un defensor de los derechos promuggles) y sustituirlo por otro. Este ritual no elimina recuerdos, los altera e introduce nuevos. Ciertos eventos importantes y traumáticos para el objetivo de este ritual pueden desencadenar un intento por recuperar sus recuerdos, para lo que deberá hacer una tirada de Frialdad enfrentada a 5+Carisma+Subterfugio del ritualista. Los efectos de este hechizo se desvanecen si el mago deja de concentrarse en el ritual."}, {"id": "Rituales-89", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de los ojos de la bestia mayor | Animalis Oculis Mayoris", "categorias": ["Utilidad"], "requisito": "Requiere Animalis Oculis.", "texto": "Requiere Animalis Oculis. Arcano de Utilidad. Posee de forma psíquica a una criatura mágica de peligrosidad **** o ***** pudiendo ver y oír lo que esta ve. Para realizar este ritual, se debe tener una muestra de la criatura (pelo, piel, saliva, etc) en concreto. En este estado, el mago tiene los atributos (Atributos y Habilidades) del animal poseído. Adicionalmente, el mago puede intentar manejar al animal y forzarle a tomar alguna decisión que vaya contra su naturaleza: para hacer algo así, se debe superar una tirada de Magizoología (a una dificultad que decidirá el master según lo alejado de su naturaleza, pero como indicativo algo que le ponga en peligro debería ser dificultad 15) Esta tirada tiene éxito automático si el animal es un Compañero Animal canjeado por el mago. Si el animal muere cuando el mago se encuentra dentro de él, sufrirá automáticamente una Herida. Este ritual no funciona sobre seres (humanos, fantasmas, elfos, gigantes...), aunque el Ministerio de Magia les haya clasificado como criaturas mágicas (es decir, centauros y gente del agua)."}, {"id": "Rituales-90", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de ofuscación mayor | Celaris Mayoris", "categorias": ["Utilidad"], "requisito": "Requiere Celaris.", "texto": "Requiere Celaris. Arcano de Utilidad. Este ritual afecta a todo el que se encuentre dentro de un círculo cuando termine de realizarse. La persona o personas afectadas se volverán difíciles de detectar por métodos mágicos, haciendo casi imposible localizarlos en mapas encantados, detectar si incumplen un Tabú o algún otro efecto de detección similar (aunque métodos de investigación muggle, o una mirada directa, no se verán afectados). El ritual aumenta en tres grados de éxito la dificultad de todas las tiradas de detección mágica para percibir estas cosas (o, en caso de funcionar mediante tirada enfrentada, da un bonificador de +7 a la tirada de turno). En caso de que la detección mágica no especifique tirada, se deberá hacer una tirada de Consciencia enfrentada al valor de 5 + Destreza + Sigilo (+ este bonificador) de las personas ocultas arcanamente."}, {"id": "Rituales-91", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de paso limitado | Transitus Prohibere", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Hechicero 3.", "texto": "Requiere Especialización Hechicero 3. Arcano de Utilidad. Crea una línea mágica que aplica un efecto mágico (de cualquier hechizo, poción o ritual que el mago conozca) a cualquier persona que cruce la línea. No impide el paso de alguien, pero sí podrá extender a lo largo de toda esa línea los efectos mágicos más terribles. Por ejemplo, una combinación muy frecuente es una línea de edad, aunque podría hacerse para que un Laqueus se realizase en un área grande de espacio en vez de solo a un objetivo. Se puede combinar sus efectos con el de otros arcanos siempre que se conozcan, en cuyo caso sólo se consumirá la mitad de puntos de pociones o rituales de esos otros arcanos (al completar toda la suma, se redondeará hacia abajo)."}, {"id": "Rituales-92", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de profanación | Regio Desecrate", "categorias": ["Utilidad"], "requisito": "Requiere Especialización Mago Oscuro 2.", "texto": "Requiere Especialización Mago Oscuro 2. Arcano de utilidad. Este ritual permite corromper un área para reforzar a cualquier ente o criatura maligna bajo tu control, tus subalternos o arcanos de magia negra. Más allá de cómo la zona cambiará visualmente tras lanzar este ritual, cualquier Reanimado a tu servicio dentro del área, causará heridas malditas las cuales requerirán un nivel extra de dificultad para ser estabilizadas y dos para ser curadas (pudiendo además dejar feas cicatrices o incluso no llegándose a curar del todo). Además si el ritualista intenta lanzar un arcano que tenga por requisito la especialización de Mago Oscuro tendrá una bonificación de 1/2/4 en función del nivel de especialización requerido, aunque esto le consumirá un punto de rituales bloqueado hasta el final de la aventura por cada arcano lanzado. Esto también afecta a tus Reanimados, Aliados o Seguidores pero solo recibirán una bonificación de 0/1/2. Para determinar el tamaño del área se realizará una tirada de Rituales: superando un 7 cubrirá el contacto físico directo y un único subalterno, con un 9 las inmediaciones del ritualista y hasta tres subalternos, con un 12 un par de estancias de distancia pero no más de diez subalternos, a partir de 15 todo un edificio y hasta veinte subalternos, con un 18 cubrirá cientos de metros así como treinta subalternos, un 21 cubrirá varios kilómetros con un máximo de cuarenta subalternos, y un 25 en la tirada cubrirá una ciudad entera y todos tus subalternos ahí presentes."}, {"id": "Rituales-93", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de protección | Pacislocum", "categorias": [], "requisito": "", "texto": "Este ritual se utiliza para crear una zona protegida en la que solo el conjurador podrá realizar magia. Solo puede realizarse en un entorno controlado, debido a su complejidad, por lo que no puede conjurarse en combate. Una vez el ritual está en funcionamiento dificultará enormemente practicar magia dentro de la zona, con la excepción de quien lo ha conjurado, pero los efectos mágicos que hubiera previamente se mantendrán. El ritual protegerá a quien esté dentro de otros rituales aún si el mago que los conjura tiene sangre o tejidos de la víctima. La zona podrá ser atacada por métodos físicos, como un incendio, o una horda de inferi hambrientos. Este ritual puede disolverse con la cadena Finite de manera normal. Conjurar este arcano no consume ningún punto de ritual; no obstante, cada arcano no autorizado que se conjure dentro de esta zona consumirá 1, 2 o 3 puntos de rituales (según si es básico, intermedio o avanzado) del ritualista. Cuando el ritualista se quede sin puntos de rituales, la protección se rompe."}, {"id": "Rituales-94", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual de trampa arcana mayor | Laqueus Mayoris", "categorias": ["Ultraje"], "requisito": "Requiere Laqueus.", "texto": "Requiere Laqueus. Arcano de Ultraje. Este ritual deja una pequeña marca arcana en un objeto, localización o criatura. Al conjurarse, el mago debe determinar una circunstancia concreta de activación que sea sencilla (\"tocar el objeto\", \"abrir la puerta\", \"pisar la baldosa\", \"acariciar al perro\"). El primer mago que cumpla esas circunstancias de activación hará saltar la trampa y recibirá automáticamente un daño de 21 PAs que no podrá evitar ni atenuar de ninguna manera."}, {"id": "Rituales-95", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual del arcanista | Arcanistus", "categorias": ["Utilidad"], "requisito": "Requiere Delictum, Prior Incantato y Specialis Revelio.", "texto": "Requiere Delictum, Prior Incantato y Specialis Revelio. Arcano de Utilidad. Este complicado ritual de investigación es capaz de vincular a un mago con una forma de magia y averiguar lo que sucedió. La primera parte es localizar un rastro mágico. Este rastro puede ser cualquier cosa: desde un objeto encantado, hasta las consecuencias de un hechizo (por ejemplo, una pared quemada tras un hechizo de fuego). Localizar cualquiera de estos rastros normalmente requiere una tirada de Consciencia a dificultad Complicada (12), pero esto queda a discreción del master. Tras localizarlo, el ritual creará una ilusión en la que se verá, reproducido, la última escena que llegó a ese momento (por ejemplo, en el caso de una quemadura, se verá al mago que conjuró el fuego y a las llamas abrasando la pared), reproduciéndolo para que se pueda recrear la escena con atención. Si se detectan varios rastros, el ritualista puede hacer una recreación que los incluya, llegando a poder reproducirse, por ejemplo, duelos mágicos completos, si se tiene la suficiente pericia."}, {"id": "Rituales-96", "fuente": "Rituales", "nivel": "Avanzado", "nombre": "Ritual del esclavo fantasmal | Servuntus", "categorias": ["Utilidad"], "requisito": "Requiere Exorcismo.", "texto": "Requiere Exorcismo. Arcano de Utilidad. Permite atar un fantasma o espíritu en un objeto inanimado (muñeco en muchos casos). El objeto cobrará una especie de \"vida\" y obedecerá las órdenes del mago, quedando a la voluntad de este. Muchos ritualistas introducen las almas de sus enemigos de este modo en muñecos o animales disecados, dotándolos de vida para que ejerzan su voluntad. Es, como ellos lo llaman, su \"pequeña venganza\". El espíritu atado de este modo no podrá escapar de su \"prisión\" por sus propios métodos, por lo que pueden quedar encerrados durante una eternidad. La movilidad que tengan se basa en el tipo de objeto en el que son introducidos y nunca podrán atacar a su creador, teniendo que seguir sus órdenes de forma obligada. Adicionalmente, el mago puede escoger ordenar al espíritu que actúe fuera del objeto, aunque sólo podrá hacerlo durante un plazo de 15 minutos y a una distancia de 1 km por cada punto del valor de Poder+Rituales del mago."}, {"id": "Rituales-97", "fuente": "Rituales", "nivel": "Avanzado", "nombre":
